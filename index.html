let REQ=null; // {mode:'single'|'split', fund_id, splitAg, meses:[{competencia,teto}], competencia, valor, descricao}
function poNome(id){ const p=DATA.poProjetos.find(x=>x.id===id); return p?p.nome:'—'; }
/* Fee rateio (percentuais fixos por agência) — cada categoria já aponta para
   o fund real que consome aquele budget (Fee - <agência> TV/AC/LABG…).
   Ao solicitar uma PO de Fee, o valor total é dividido pelos percentuais
   configurados e uma PO é criada em cada fund correspondente. */
function feeSplitGroups(){
  const byAg={};
  (DATA.fee||[]).forEach(f=>{ if(!f.agencia||!f.categoria)return; (byAg[f.agencia]=byAg[f.agencia]||[]).push(f); });
  const out=[];
  Object.keys(byAg).forEach(ag=>{
    const splits=byAg[ag].map(f=>{
      const proj=DATA.poProjetos.find(p=>p.activity==='FEE'&&p.agencia===ag&&p.product_category===f.categoria&&p.aprovacao_status==='APROVADO');
      return {categoria:f.categoria, percentual:+f.percentual||0, fund_id:proj?proj.id:null, nome:proj?proj.nome:null};
    });
    if(splits.length && splits.every(s=>s.fund_id)) out.push({agencia:ag, splits});
  });
  return out;
}
async function mesesDoProjeto(pid){
  const p=DATA.poProjetos.find(x=>x.id===pid);
  if(DEMO_MODE){
    if(p&&p.rateio){
      const byM={}; (DATA.rateio||[]).filter(r=>r.fund_id===pid).forEach(a=>{const m=String(a.competencia).slice(0,7);byM[m]=(byM[m]||0)+(+a.valor||0);});
      return Object.keys(byM).sort().map(m=>({competencia:m+'-01',teto:byM[m]}));
    }
    return (DATA.tetos||[]).filter(t=>t.fund_id===pid).map(t=>({competencia:String(t.competencia).slice(0,10),teto:+t.teto})).sort((a,b)=>a.competencia.localeCompare(b.competencia));
  }
  try{
    if(p&&p.rateio){
      const {data}=await SBPO.from('rateio_alocacao').select('competencia,valor').eq('fund_id',pid);
      const byM={}; (data||[]).forEach(a=>{const m=String(a.competencia).slice(0,7);byM[m]=(byM[m]||0)+(+a.valor||0);});
      return Object.keys(byM).sort().map(m=>({competencia:m+'-01',teto:byM[m]}));
    }else{
      const {data}=await SBPO.from('tetos').select('competencia,teto').eq('fund_id',pid).order('competencia');
      return (data||[]).map(t=>({competencia:String(t.competencia).slice(0,10),teto:+t.teto}));
    }
  }catch(e){ return []; }
}
function consumoMes(pid,comp){
  return DATA.pos.filter(po=>po.fund_id===pid&&String(po.competencia).slice(0,7)===String(comp).slice(0,7)&&!['REJEITADA','CANCELADA'].includes(po.status)).reduce((s,po)=>s+(+po.valor||0),0);
}
function projMonths(pid){ return DATA.tetos.filter(t=>t.fund_id===pid).map(t=>({competencia:String(t.competencia).slice(0,10),teto:+t.teto})).sort((a,b)=>a.competencia.localeCompare(b.competencia)); }
function reqOptions(){
  // cut / frozen funds are not offered as PO targets at all
  let projs=DATA.poProjetos.filter(p=>p.aprovacao_status==='APROVADO'&&!fundRestr(p));
  if(PAPEL==='agencia'&&MINHA_AGENCIA) projs=projs.filter(p=>p.agencia===MINHA_AGENCIA);
  const groups=feeSplitGroups().filter(g=>!(PAPEL==='agencia'&&MINHA_AGENCIA)||g.agencia===MINHA_AGENCIA);
  const splitIds=new Set(groups.flatMap(g=>g.splits.map(s=>s.fund_id)));
  // the individual TV/AC/LABG fee funds are requested through their agency's split group, not directly
  const single=projs.filter(p=>!splitIds.has(p.id));
  return {single,groups};
}
/* ============================================================
   BUDGET CUT / SPENDING FREEZE
   ------------------------------------------------------------
   A fund can be marked CORTADA (its money was withdrawn) or BLOQUEADA
   (spending is frozen) WITHOUT its budget figure changing. Nothing here
   touches tetos or rateio_alocacao: the fund keeps the cap it was given,
   and the restriction is a separate fact recorded on the fund. That way
   "what was this fund given" and "what may still be spent" stay two
   different questions — reducing the cap would destroy the first answer to
   express the second, and the year's allocation history with it.

   It does bite, though: a restricted fund can't have new POs requested
   against it. A freeze that only changes a colour is decoration.
   ============================================================ */
const RESTR_META={
  CORTADA:{t:'Budget cut',short:'Cut',c:'#bf0008',bg:'#fbe4e1',bd:'#f2c4bf',icon:'alert'},
  BLOQUEADA:{t:'Spending blocked',short:'Blocked',c:'#7a5200',bg:'#fbf0d8',bd:'#ecd9a4',icon:'lock'}
};
function fundRestr(p){ return (p&&RESTR_META[p.restricao])?p.restricao:null; }
function canRestrict(){ return (['admin','marketing'].includes(PAPEL)||isManager)&&!viewOnly(); }

}
let FUNDRESTR=null;
function openCampRestricao(pid){

async function reqLoadMeses(){

function reqLoadMesesSplit(){
  const group=feeSplitGroups().find(g=>g.agencia===REQ.splitAg); if(!group)return;
  let comps=null;
  group.splits.forEach(s=>{ const set=new Set(projMonths(s.fund_id).map(m=>m.competencia)); comps=comps?new Set([...comps].filter(c=>set.has(c))):set; });
  REQ.meses=[...(comps||[])].sort().map(competencia=>({competencia}));

function reqSet(k,v){
  if(!REQ)return;
  if(k==='fund_id'){
    if(String(v).startsWith('FEE::')){ REQ.mode='split'; REQ.splitAg=v.slice(5); REQ.fund_id=v; reqLoadMesesSplit(); }
    else { REQ.mode='single'; REQ.fund_id=v; reqLoadMeses(); }
    return;
  }
  REQ[k]=v;
  if(k==='competencia'&&REQ.mode==='split'){ renderReqPO(); return; }
  renderReqPO();
}
function reqSplitBreakdown(){
  const group=feeSplitGroups().find(g=>g.agencia===REQ.splitAg); if(!group)return [];
  const total=+REQ.valor||0; const comp=REQ.competencia;
  let running=0;
  return group.splits.map((s,i)=>{
    let valor=r2(total*s.percentual);
    if(i===group.splits.length-1) valor=r2(total-running); else running+=valor;
    const teto=comp?(projMonths(s.fund_id).find(m=>m.competencia===comp)||{}).teto||0:0;
    const cons=comp?consumoMes(s.fund_id,comp):0;
    const saldo=teto-cons-valor;
    return {...s,valor,teto,cons,saldo};
  });
}

async function submitReqPO(){
  if(!REQ)return;
  if(REQ.mode==='split'){
    if(!REQ.splitAg){ toast('Choose the agency.'); return; }
    if(!REQ.competencia){ toast('Choose the allocation month.'); return; }

       are per-category, solicitar_po's cap check is per-projeto), so this
       still creates one `pos` row per category underneath. What changes is
       po_grupo_id: every row from this one submission shares the same fresh
       id, so the whole rest of the PO lifecycle (list, detail, approve,
       issue nº, invoice, validate) can treat them as a single PO — one
       request, one NF, one PO number — while the budget split keeps working
       exactly as before. */
    const grupoId=crypto.randomUUID();

      rows.forEach(r=>{ if(r.valor>0) demoAddPO(r.fund_id,REQ.competencia,REQ.splitAg,r.valor,(REQ.descricao||'')+' — '+r.categoria,grupoId); });

      }
      toast('PO requested for '+fmtMes(REQ.competencia)+' ✓ — budget split across '+rows.length+' categories.'); closeModal();
      await reloadPO(); go('pos');
    }catch(e){ toastErr(e); }
    return;
  }
  if(!REQ.fund_id){ toast('Choose the fund.'); return; }
  if(!REQ.competencia){ toast('Choose the allocation month.'); return; }
  const val=+REQ.valor||0; if(val<=0){ toast('Enter a value.'); return; }
  const ag=(PAPEL==='agencia'&&MINHA_AGENCIA)?MINHA_AGENCIA:(DATA.poProjetos.find(p=>p.id===REQ.fund_id)||{}).agencia||'';
  if(DEMO_MODE){

    return;
  }
  if(viewOnly()){toast(roMsg());return;}

    const {error}=await SBPO.rpc('solicitar_po',{p_fund:REQ.fund_id,p_competencia:REQ.competencia,p_agencia:ag,p_valor:val,p_descricao:REQ.descricao||''});

async function realocarPO(poId){
  if(viewOnly()){toast(roMsg());return;}
  if(!isManager&&PAPEL!=='admin'){ toast('Only admin can reallocate.'); return; }
  const po=DATA.pos.find(p=>p.id===poId); if(!po)return;
  const sibs=poGroupSiblings(po);

  const opts=meses.map(m=>fmtMes(m.competencia)).join(', ');
  const novo=prompt('Reallocate PO to which month? Project months: '+opts+(sibs.length>1?'\n\nApplies to all '+sibs.length+' categories in this PO.':'')+'\n\nEnter in YYYY-MM format (e.g. 2026-08):', String(po.competencia).slice(0,7));
  if(!novo)return;
  const comp=/^\d{4}-\d{2}$/.test(novo)?novo+'-01':novo;
  try{
    for(const p of sibs){ const {error}=await SBPO.from('pos').update({competencia:comp}).eq('id',p.id); if(error)throw error; p.competencia=comp; }
    toast('PO reallocated to '+fmtMes(comp)+' ✓'); go('pos');
  }catch(e){ toastErr(e); }
}

const CAMP_CATS=['TV','AC','Mobile','Monitor','Home Appliances','LABG'];
function campStatusMeta(s){
  return ({planejada:{t:'Planned',c:'s-blue'},ativa:{t:'Active',c:'s-green'},encerrada:{t:'Closed',c:'s-slate'}})[s]||{t:s||'—',c:'s-slate'};

/* Same cap/consumed/committed aggregation renderFunds() does per-fund
   (tetos + rateio_alocacao for the cap, pos by status for spend), just
   summed across every fund that belongs to this campanha instead of one. */
function campTotals(campId){
  const ids=new Set(campFunds(campId).map(p=>p.id));
  let teto=0,cons=0,comp=0;
  DATA.tetos.forEach(t=>{ if(ids.has(t.fund_id)) teto+=(+t.teto||0); });
  DATA.rateio.forEach(r=>{ if(ids.has(r.fund_id)) teto+=(+r.valor||0); });
  DATA.pos.forEach(po=>{ if(!ids.has(po.fund_id))return; const v=+po.valor||0; if(CONS.includes(po.status))cons+=v; else if(COMP.includes(po.status))comp+=v; });
  return {teto,cons,comp};
}

async function submitCampanha(){
  if(viewOnly()){toast(roMsg());return;}
  if(!CAMPEDIT)return; const ce=CAMPEDIT;
  if(!ce.nome.trim()){ toast('Give the campaign a name.'); return; }
  try{
    let campId=ce.id;
    if(campId){
      const {error}=await SBPO.from('campanhas').update({nome:ce.nome.trim(),budget_id:ce.budget_id||null,responsavel:ce.responsavel||null,status:ce.status,descricao:ce.descricao||null}).eq('id',campId);
      if(error)throw error;
    }else{
      const {data,error}=await SBPO.from('campanhas').insert({nome:ce.nome.trim(),budget_id:ce.budget_id||null,responsavel:ce.responsavel||null,status:ce.status,descricao:ce.descricao||null}).select().single();
      if(error)throw error;
      campId=data.id;
    }
    // Simplest correct approach given the low row counts: wipe this campanha's
    // category rows and re-insert the selected set, rather than diffing.
    await SBPO.from('campanha_categorias').delete().eq('campanha_id',campId);
    if(ce.cats.length){
      const {error:e2}=await SBPO.from('campanha_categorias').insert(ce.cats.map(cat=>({campanha_id:campId,categoria:cat})));
      if(e2)throw e2;
    }
    // Link/unlink funds to match the picker: anything checked gets campanha_id
    // set to this campanha; anything that was linked here but got unchecked
    // (including funds reassigned away in this same edit) gets nulled out.
    const toLink=ce.funds;
    const toUnlink=(DATA.poProjetos||[]).filter(f=>f.campanha_id===campId&&!toLink.includes(f.id)).map(f=>f.id);
    if(toLink.length){
      const {error:e3}=await SBPO.from('funds').update({campanha_id:campId}).in('id',toLink);
      if(e3)throw e3;
    }
    if(toUnlink.length){
      const {error:e4}=await SBPO.from('funds').update({campanha_id:null}).in('id',toUnlink);
      if(e4)throw e4;
    }
    CAMPEDIT=null; toast(ce.id?'Campaign updated ✓':'Campaign created ✓'); closeModal(); await reloadPOAll(); go('campanhas');
  }catch(e){ toastErr(e); }
}

/* ============================================================
   TELAS ADICIONAIS (espelham o protótipo aprovado)
   ============================================================ */
let TL_HILITE=null; // highlighted week index, or null — click a week header to toggle
function tlToggleWeek(w){ TL_HILITE=(TL_HILITE===w)?null:w; go(SCREEN); }
/* Windowed navigation — TL_OFF is a week offset from "one week before today's
   week" (so Today lands near the left edge with a little past context);
   TL_FIT=true restores the original fit-everything scale. Week indices shift
   when the window moves, so any highlighted column is cleared on navigation. */
let TL_FIT=false, TL_OFF=0; const TL_SPAN=10;
function tlNav(d){ if(d===0)TL_OFF=0; else TL_OFF+=d; TL_FIT=false; TL_HILITE=null; go(SCREEN); }
function tlFitToggle(){ TL_FIT=!TL_FIT; TL_HILITE=null; go(SCREEN); }
let TL_EXPANDED={}; // project id -> inline activities-timeline dropdown open?
function tlToggleProjRow(pid){ TL_EXPANDED[pid]=!TL_EXPANDED[pid]; go(SCREEN); }
/* Jump the Timeline's navigable window back to a specific date — used by the
   "◀ {date}" labels shown when a project/activity's bar sits entirely before
   the current window. Places that date about a week in from the left edge
   (same convention as the default "today" window) instead of flush at 0. */
function tlJumpTo(dateStr){
  if(!dateStr)return;
  const d=new Date(dateStr+'T00:00:00');
  const tdy=today0();
  const base=new Date(tdy); base.setDate(base.getDate()-base.getDay()-7);
  const dWeekStart=new Date(d); dWeekStart.setDate(dWeekStart.getDate()-dWeekStart.getDay());
  TL_OFF=Math.round((dWeekStart-base)/(7*864e5))-1;
  TL_FIT=false; TL_HILITE=null; go(SCREEN);
}
/* Gantt-style, not a plain list — each activity gets its own bar positioned
   on the SAME week scale (min/dayPct) as the parent project row above it, so
   the bars line up under the shared week header instead of needing one of
   their own. Tasks only carry a due date (no individual start), so each
   bar's start is chained from the previous activity's due date (or the
   project's own start for the first one) — a simple, readable approximation
   of sequencing rather than true independent start dates. */
function tlProjActivitiesHTML(p,min,dayPct,weeks){
  const tasks=(p.tasks||[]).slice().sort((a,b)=>String(a.fim||'9999').localeCompare(String(b.fim||'9999')));
  if(!tasks.length) return '<div style="font-size:12px;color:var(--txt-3);padding:8px 16px 8px 45px">No activities.</div>';
  const winEnd=new Date(min); winEnd.setDate(winEnd.getDate()+(weeks||1)*7);
  let prevEnd=projEffStart(p);
  return tasks.map(t=>{
    const st=statusOf(t.status), hp=healthPill(t.status);
    const endStr=t.fim||prevEnd;
    const s=new Date(prevEnd+'T00:00:00'), e=new Date(endStr+'T00:00:00');
    prevEnd=endStr;
    let bar;
    if(e<min){
      bar=t.fim?`<span onclick="tlJumpTo('${esc(t.fim)}')" title="Jump the timeline back to this date" style="position:absolute;left:8px;top:9px;font-size:9.5px;font-weight:700;color:var(--txt-3);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px">◀ ${fmtDate(t.fim)}</span>`
        :`<span style="position:absolute;left:8px;top:9px;font-size:9.5px;font-weight:700;color:var(--txt-3)">◀ —</span>`;
    }else if(s>=winEnd){
      bar=`<span style="position:absolute;right:8px;top:9px;font-size:9.5px;font-weight:700;color:var(--txt-3)">${t.fim?fmtDate(t.fim):'—'} ▶</span>`;
    }else{
      const left=Math.max(0,((s-min)/864e5)*dayPct);
      const rawR=(((e-min)/864e5)+1)*dayPct;
      const width=Math.min(Math.max(dayPct*1.3,Math.min(rawR,100)-left),100-left);

/* "Mark concluded" only ever shows on DELIVERED rows (project status is
   already "concluido" there — all tasks done). This does NOT touch task/
   status data at all; it just flags the project so the weekly report can
   archive it out of the active Delivered list into a separate terminal
   block, so Delivered doesn't keep growing with old, already-reported
   items every week. weeklyConcluded lives on the project record itself
   (not per-browser/localStorage) so the archived state is the same for
   everyone looking at Weekly Status, same as every other project field. */
async function weeklyMarkConcluded(pid){
  const p=DATA.projetos.find(x=>x.id===pid); if(!p)return;
  if(!canEdit(p)){ toast('Only the owner or admin can do this.'); return; }
  p.weeklyConcluded=true;
  try{ await SBPO.from('act_projects').upsert({id:p.id,data:p}); toast('Moved to Concluded ✓'); }
  catch(e){ toastErr(e); return; }
  go(SCREEN);
}

/* One row per PO slice — the same slices the table sums, so the sheet
   reconciles with the Cons. columns line by line. `pos` has no NF issue date
   column, so it comes from the FATURADA transition in po_log, fetched only
   when someone actually exports (and left blank if that read is denied). */
function ccPOExportRows(nfDates){
  const {accRows,monthList}=ccAggregate();
  /* Sorted on the raw YYYY-MM key, never on the rendered "Jan/26" label —
     that one sorts alphabetically (Apr before Jan) and would scramble the
     year boundary. The key is dropped again before the rows reach the sheet. */
  const items=[];
  accRows.forEach((a,ai)=>monthList.forEach(m=>{
    (a.det[m]||[]).forEach(d=>{
      const po=d.po, st=PO_STATUS[po.status]||{t:po.status};
      items.push({m,tail:ccTailRank(a),ai,row:{
        'Mês de lançamento':fmtMes(m+'-01'),
        'Categoria':d.categoria||'—',
        'Data da NF':(nfDates&&nfDates[po.id])?fmtDataBR(nfDates[po.id]):'—',
        'Valor':Math.round(d.share*100)/100,
        'Descrição da PO':po.descricao||'—',
        'Centro de custo':a.cc||'—',
        'Conta':a.acc||'—',
        'Descrição da conta':a.desc||'—',
        'Nº da PO':po.numero_po||'—',
        'Nº da NF':po.nf_numero||'—',
        'Fund':d.proj.nome||'—',
        'Agência':po.agencia||'—',
        'Status':st.t||po.status,
        '% do rateio':Math.round(d.ratio*10000)/100
      }});
    });
  }));
  /* Matriz (LABG) last, then posting month oldest first, then the Extrato
     row order (accRows already carries it) so a month's lines read down the
     sheet in the same sequence as the table above. */
  items.sort((x,y)=>x.tail-y.tail||x.m.localeCompare(y.m)||x.ai-y.ai);
  const rows=items.map(i=>i.row);
  return rows;
}
async function ccNFDates(){

}

/* ---- Overview period filter (all / year / quarter / month) ---- */
let BO_PER={mode:'all',val:''};
function boMonthIn(m){
  if(BO_PER.mode==='all'||!BO_PER.val)return true;
  if(BO_PER.mode==='year')return m.slice(0,4)===BO_PER.val;
  if(BO_PER.mode==='quarter'){const i=BO_PER.val.indexOf('-Q');const y=BO_PER.val.slice(0,i),q=+BO_PER.val.slice(i+2);return m.slice(0,4)===y&&Math.ceil(+m.slice(5,7)/3)===q;}
  if(BO_PER.mode==='month')return m===BO_PER.val;
  return true;
}
function boInPeriod(comp){ if(!comp)return BO_PER.mode==='all'; return boMonthIn(String(comp).slice(0,7)); }
function boSetMode(mode){
  const now=new Date(),y=String(now.getFullYear()),m=now.toISOString().slice(0,7),q=y+'-Q'+Math.ceil((now.getMonth()+1)/3);
  BO_PER={mode,val:mode==='year'?y:mode==='quarter'?q:mode==='month'?m:''};
  go(SCREEN);
}

/* Month "bolinhas": one dot per fund month, filled when that month is fully
   consumed (completed), amber when in progress, hollow when not started. */
function fundMonthCons(pid,m){ return (DATA.pos||[]).filter(po=>po.fund_id===pid&&String(po.competencia).slice(0,7)===m&&CONS.includes(po.status)).reduce((s,po)=>s+(+po.valor||0),0); }
/* "Used" in the sense the rest of the app means it: everything committed
   against the month's cap — invoiced (CONS), approved/issued (COMP) and still
   awaiting approval (PEND) — which is exactly what the fund drawer
   subtracts to show a month's balance. fundMonthCons() above is the narrower
   "already invoiced" figure; don't mix them or the timeline and the drawer
   will disagree about the same month. */
function fundMonthUsed(pid,m){ return (DATA.pos||[]).filter(po=>po.fund_id===pid&&String(po.competencia).slice(0,7)===m&&(CONS.includes(po.status)||COMP.includes(po.status)||PEND.includes(po.status))).reduce((s,po)=>s+(+po.valor||0),0); }
function fundMonthCap(pid,m){ let c=0; (DATA.tetos||[]).forEach(t=>{if(t.fund_id===pid&&String(t.competencia).slice(0,7)===m)c+=(+t.teto||0);}); (DATA.rateio||[]).forEach(r=>{if(r.fund_id===pid&&String(r.competencia).slice(0,7)===m)c+=(+r.valor||0);}); return c; }
/* Past months whose cap still has unused balance (cap minus everything
   committed against it, invoiced or not) — the set a "Reallocate" prompt
   should surface. Used both by the drawer's per-month button and by the
   Overview alert that makes the feature discoverable. */
function fundPastUnallocatedBalance(pid){
  const nowM=new Date().toISOString().slice(0,7);
  const months=Object.keys(fundMonthlyTotals(pid)).filter(m=>m<nowM).sort();
  const out=[];
  months.forEach(m=>{
    const cap=fundMonthCap(pid,m);
    if(!cap)return;
    const committed=(DATA.pos||[]).filter(po=>po.fund_id===pid&&String(po.competencia).slice(0,7)===m&&!['REJEITADA','CANCELADA'].includes(po.status)).reduce((s,po)=>s+(+po.valor||0),0);
    const saldo=cap-committed;
    if(saldo>0.5) out.push({mes:m,saldo});
  });
  return out;
}
/* The 12 calendar months of the fund's year — the dots strip is always a

function fundYearMonths(pid){
  const keys=Object.keys(fundMonthlyTotals(pid)).sort();
  const yr=keys.length?keys[0].slice(0,4):String(new Date().getFullYear());
  return Array.from({length:12},(_,i)=>yr+'-'+String(i+1).padStart(2,'0'));
}

/* Two part-to-whole charts closing the Overview: allocation by product

   Activity hues are the validated categorical order (all six checks pass).
   Category hues are the app's own; they pass CVD separation (worst adjacent
   ΔE 12.8) and the normal-vision floor (18.3), with one deliberate exception:
   LABG is a near-gray, which the chroma check flags as "reads gray" — that is
   precisely what Matriz/corporate is meant to read as here, and it is the same

const BO_ACT_COLOR={Campaign:'#2a78d6',FEE:'#eb6834',KOL:'#1baf7a',AON:'#eda100',Communication:'#e87ba4',Other:'#4a3aa7'};
const BO_PIE_TAIL='#8a90a0';
function boPieData(){
  let funds=DATA.poProjetos.filter(p=>p.aprovacao_status==='APROVADO');
  if(effPapel()==='agencia'&&effAgencia()) funds=funds.filter(p=>p.agencia===effAgencia());
  funds=funds.filter(p=>boScopeKeep(p.product_category));
  const ids=new Set(funds.map(c=>c.id));
  const catOf={}; DATA.poProjetos.forEach(p=>{catOf[p.id]=String(p.product_category||'').trim();});
  /* Category attribution mirrors the Overview's own: a plain fund's caps
     count under its category, a rateio fund's allocation under the
     category each slice was booked to. */
  const byCat={};
  (DATA.tetos||[]).forEach(t=>{ if(!ids.has(t.fund_id)||!boInPeriod(t.competencia))return; const c=catOf[t.fund_id]; if(c&&boScopeKeep(c)) byCat[c]=(byCat[c]||0)+(+t.teto||0); });
  (DATA.rateio||[]).forEach(r=>{ if(!ids.has(r.fund_id)||!boInPeriod(r.competencia))return; const c=r.categoria; if(c&&boScopeKeep(c)) byCat[c]=(byCat[c]||0)+(+r.valor||0); });
  const allocBy={};
  (DATA.tetos||[]).forEach(t=>{ if(!boInPeriod(t.competencia))return; allocBy[t.fund_id]=(allocBy[t.fund_id]||0)+(+t.teto||0); });
  (DATA.rateio||[]).forEach(r=>{ if(!boInPeriod(r.competencia))return; allocBy[r.fund_id]=(allocBy[r.fund_id]||0)+(+r.valor||0); });
  const byAct={}; funds.forEach(p=>{ const k=actKey(p); byAct[k]=(byAct[k]||0)+(allocBy[p.id]||0); });
  const shape=(obj,labelOf,colorOf)=>{
    let items=Object.keys(obj).filter(k=>obj[k]>0.005).map(k=>({k,label:labelOf(k),v:obj[k],color:colorOf(k)}));
    items.sort((a,b)=>b.v-a.v);
    if(items.length>6){
      const tail=items.slice(5);
      items=items.slice(0,5);
      items.push({k:'__other',label:`Other (${tail.length})`,v:tail.reduce((s,x)=>s+x.v,0),color:BO_PIE_TAIL});
    }
    const tot=items.reduce((s,x)=>s+x.v,0);
    return {items,total:tot};
  };
  return {
    cats:shape(byCat,k=>k,k=>catMeta(k).c),
    acts:shape(byAct,k=>actColLabel(k),k=>BO_ACT_COLOR[k]||BO_PIE_TAIL)
  };
}

function budgetExportRows(){

  DATA.rateio.forEach(r=>{tetoBy[r.fund_id]=(tetoBy[r.fund_id]||0)+(+r.valor||0);});
  DATA.pos.forEach(po=>{const v=+po.valor||0;if(CONS.includes(po.status))consBy[po.fund_id]=(consBy[po.fund_id]||0)+v;else if(COMP.includes(po.status))compBy[po.fund_id]=(compBy[po.fund_id]||0)+v;else if(PEND.includes(po.status))pendBy[po.fund_id]=(pendBy[po.fund_id]||0)+v;});

  const rows=[];
  orcs.forEach(o=>{
    (byOrc[o.id]||[]).forEach(p=>{
      const tot=tetoBy[p.id]||0, cons=consBy[p.id]||0, comp=compBy[p.id]||0, pnd=pendBy[p.id]||0;
      const rawc=tot?(cons+comp+pnd)/tot*100:0;
      const status=rawc>100.5?'Estourado':rawc>=90?'Próximo do limite':'Dentro do orçamento';
      const row={
        'Categoria': o.nome||o.product_category||'—',
        'Projeto': p.nome||'',
        'Fornecedor': p.agencia||'',
        'Atividade': actColLabel(actKey(p)),
        'Orçado (R$)': Math.round(tot*100)/100,

/* The Excel twin of the on-screen "Cost center / account — monthly budget,
   consumption & balance" table: same ccAggregate() pass, same admin/finance
   gate — one row per cost center/account/description, one Orçado/Consumido/
   Saldo triplet per month, plus the grand-total row. */
function costCenterExportRows(){
  const canSensitive=effIsManager()||['admin','financeiro'].includes(effPapel());
  if(!canSensitive) return null;
  const {accRows,monthList}=ccAggregate();
  const rows=accRows.map(a=>{
    const row={'Categoria':a.cat||'—','Centro de custo':a.cc||'—','Conta':a.acc||'—','Descrição':a.desc||'—'};
    let totB=0,totC=0;
    monthList.forEach(m=>{
      const b=a.months[m]||0, c=a.cons[m]||0, label=fmtMes(m+'-01');
      totB+=b; totC+=c;
      row[`${label} - Orçado`]=Math.round(b*100)/100;
      row[`${label} - Consumido`]=Math.round(c*100)/100;
      row[`${label} - Saldo`]=Math.round((b-c)*100)/100;
    });
    row['Total - Orçado']=Math.round(totB*100)/100;
    row['Total - Consumido']=Math.round(totC*100)/100;
    row['Total - Saldo']=Math.round((totB-totC)*100)/100;
    return row;
  });
  if(rows.length){
    const totalRow={'Categoria':'Total','Centro de custo':'','Conta':'','Descrição':''};
    let gB=0,gC=0;
    monthList.forEach(m=>{
      let b=0,c=0; accRows.forEach(a=>{b+=a.months[m]||0;c+=a.cons[m]||0;});
      const label=fmtMes(m+'-01');
      gB+=b; gC+=c;
      totalRow[`${label} - Orçado`]=Math.round(b*100)/100;
      totalRow[`${label} - Consumido`]=Math.round(c*100)/100;
      totalRow[`${label} - Saldo`]=Math.round((b-c)*100)/100;
    });
    totalRow['Total - Orçado']=Math.round(gB*100)/100;
    totalRow['Total - Consumido']=Math.round(gC*100)/100;
    totalRow['Total - Saldo']=Math.round((gB-gC)*100)/100;
    rows.push(totalRow);
  }
  return rows;
}

async function savePerson(){

  if(PERSON._new){
    if(!(PERSON.email||'').trim()){ toast('Enter an email.'); return; }
    if(!PERSON.papel){ toast('Select a role.'); return; }
    if(PERSON.papel==='agencia'&&!(PERSON.agencia||'').trim()){ toast('Choose the agency.'); return; }

      DATA.pessoas.push({user_id:'demo-'+uid(),nome:PERSON.nome,sobrenome:PERSON.sobrenome,email:PERSON.email,papel:PERSON.papel,agencia:PERSON.papel==='agencia'?PERSON.agencia:null,agencia_nivel:nivel});

    }

      const {data:sPO}=await SBPO.auth.getSession();
      const token=sPO&&sPO.session&&sPO.session.access_token;
      if(!token) throw new Error('no active PO session');
      const r=await fetch(PO_URL+'/functions/v1/admin-usuarios',{method:'POST',headers:{'Content-Type':'application/json','apikey':PO_KEY,'Authorization':'Bearer '+token},body:JSON.stringify({action:'convidar',email:PERSON.email.trim().toLowerCase(),papel:PERSON.papel,agencia:PERSON.papel==='agencia'?PERSON.agencia:null,agencia_nivel:nivel,nome:PERSON.nome,sobrenome:PERSON.sobrenome})});

async function deletarPessoa(userId){
  if(PAPEL!=='admin'){ toast('Only admin can delete.'); return; }
  const pe=(DATA.pessoas||[]).find(x=>x.user_id===userId)||{};
  const nome=[pe.nome,pe.sobrenome].filter(Boolean).join(' ')||pe.email||'this user';
  if(!confirm('Delete user "'+nome+'" ('+(pe.email||'')+')?\n\nThis removes their login and profile entirely.\n\nThis cannot be undone.'))return;

async function submitFund(){
  if(!FUND)return;
  if(!FUND.nome.trim()){ toast('Give the fund a name.'); return; }
  if(!FUND.orcamento_id){ toast('Choose a budget.'); return; }
  const rows=FUND.rows.filter(r=>r.mes&&(+r.valor||0)>0);
  if(!rows.length){ toast('Add at least one month with a value.'); return; }
  const orc=(DATA.orcamentos||[]).find(o=>o.id===FUND.orcamento_id); const cat=orc?(orc.product_category||orc.nome||''):'';
  // Same over-budget check the server enforces at approval time (aprovar_projeto),
  // surfaced here instead so the requester sees the block immediately when trying
  // to save — not later, as a surprise to whoever approves it.
  if(orc&&(+orc.valor_total||0)){
    const pStart=orc.periodo_inicio?String(orc.periodo_inicio).slice(0,10):null;
    const pEnd=orc.periodo_fim?String(orc.periodo_fim).slice(0,10):null;
    const inPeriod=mYYYYMM=>{ const d=mYYYYMM+'-01'; return (!pStart||d>=pStart)&&(!pEnd||d<=pEnd); };
    const vAloc=rows.filter(r=>inPeriod(r.mes)).reduce((s,r)=>s+(+r.valor||0),0);
    const approvedIds=new Set((DATA.poProjetos||[]).filter(p=>p.orcamento_id===FUND.orcamento_id&&p.aprovacao_status==='APROVADO').map(p=>p.id));
    const vUsado=(DATA.tetos||[]).filter(t=>approvedIds.has(t.fund_id)&&inPeriod(String(t.competencia).slice(0,7))).reduce((s,t)=>s+(+t.teto||0),0);
    const total=+orc.valor_total||0;
    if(vAloc+vUsado>total+0.5){
      toast(`This would exceed the "${esc(orc.nome||cat)}" budget: ${BRL(vAloc)} requested + ${BRL(vUsado)} already committed exceeds the ${BRL(total)} total. Reduce the values or pick a different budget.`);
      return;
    }
  }
  if(DEMO_MODE){
    const pid='demo-p-'+uid();
    DATA.poProjetos.push({id:pid,nome:FUND.nome.trim(),agencia:FUND.agencia||null,orcamento_id:FUND.orcamento_id,product_category:cat,activity:FUND.activity||null,rateio:false,aprovacao_status:'PENDENTE',dono:(currentUser&&currentUser.email)||''});
    rows.forEach(r=>DATA.tetos.push({fund_id:pid,competencia:r.mes+'-01',teto:r2(+r.valor)}));
    toast('Fund created ✓ (demo — now awaiting approval)'); closeModal(); go('funds');
    return;
  }
  if(viewOnly()){toast(roMsg());return;}
  try{
    let cc='',account='',account_desc='';
    try{ const {data:cls}=await SBPO.rpc('classificar',{p_d:cat,p_e:FUND.activity||'',p_f:''}); const c=(cls&&cls[0])||{}; cc=c.cc||''; account=c.account||''; account_desc=c.descricao||''; }catch(e){}
    const campos={nome:FUND.nome.trim(),agencia:FUND.agencia||null,orcamento_id:FUND.orcamento_id,product_category:cat,activity:FUND.activity||null,cc,account,account_desc,rateio:false,rateio_tipo:null,criado_por:'portal',campanha_id:FUND.campanha_id||null};
    const {data:proj,error}=await SBPO.from('funds').insert(campos).select().single();
    if(error)throw error;
    const pid=proj.id;
    {
      const tetos=rows.map(r=>({fund_id:pid,competencia:r.mes+'-01',teto:r2(+r.valor),definido_por:'portal'}));
      const {error:e2}=await SBPO.from('tetos').upsert(tetos,{onConflict:'fund_id,competencia'}); if(e2)throw e2;
    }
    toast('Fund created ✓'); closeModal(); await reloadPOAll(); go('funds');
  }catch(e){ toastErr(e); }
}

function openOrcNew(){ const nowM=new Date().toISOString().slice(0,7); const free=PRODUCT_CATS.filter(c=>!usedCats().has(c)); ORC={id:null,cat:free[0]||'',valor:'',ini:nowM,fim:nowM}; renderOrcForm(); }

async function submitOrc(){
  if(viewOnly()){toast(roMsg());return;}
  if(!ORC)return;
  const cat=String(ORC.cat||'').trim().toUpperCase();
  const val=+ORC.valor||0; if(val<0){ toast('Enter a valid value.'); return; }
  // Block lowering an existing budget below what's already allocated to its
  // approved funds — same idea as the fund-side check in submitFund():
  // surface it here, at save time, instead of leaving the budget silently
  // inconsistent (total < committed).
  if(ORC.id){
    const approvedIds=new Set((DATA.poProjetos||[]).filter(p=>p.orcamento_id===ORC.id&&p.aprovacao_status==='APROVADO').map(p=>p.id));
    const pStart=ORC.ini?ORC.ini+'-01':null, pEnd=ORC.fim?ORC.fim+'-01':null;
    const inPeriod=comp=>{ const d=String(comp).slice(0,10); return (!pStart||d>=pStart)&&(!pEnd||d<=pEnd); };
    const vUsado=(DATA.tetos||[]).filter(t=>approvedIds.has(t.fund_id)&&inPeriod(t.competencia)).reduce((s,t)=>s+(+t.teto||0),0);
    if(val<vUsado-0.5){
      toast(`Can't set the total below ${BRL(vUsado)} — that's already allocated to approved funds in this budget.`);
      return;
    }
  }
  try{
    if(ORC.id){
      const {error}=await SBPO.from('orcamentos').update({valor_total:val,periodo_inicio:ORC.ini?ORC.ini+'-01':null,periodo_fim:ORC.fim?ORC.fim+'-01':null}).eq('id',ORC.id);
      if(error)throw error;
      toast('Budget updated ✓');
    }else{
      if(!PRODUCT_CATS.includes(cat)){ toast('Pick a product category.'); return; }
      if(usedCats().has(cat)){ toast('A budget for '+cat+' already exists.'); return; }
      if(val<=0){ toast('Enter the total value.'); return; }
      const {error}=await SBPO.rpc('criar_orcamento',{p_nome:cat,p_valor:val,p_inicio:ORC.ini?ORC.ini+'-01':null,p_fim:ORC.fim?ORC.fim+'-01':null});
      if(error)throw error;
      toast('Budget created ✓');
    }
    closeModal(); await reloadPOAll(); go('budgets');
  }catch(e){ toastErr(e); }
}

/* percentualRaw carries the DB's full-precision value through the editor
   untouched — the visible `percentual` field is rounded to 2 decimals for
   display/typing, but percentages here often come from a fraction like
   10000/30000 that needs many more digits to reconcile split totals to the
   cent. Without this, saving the form (even to edit an unrelated field on
   some OTHER row) would silently truncate every row's percentual down to
   whatever 2-decimal value happens to be displayed. Editing the % field
   directly clears percentualRaw for that row — the typed value becomes the
   new source of truth at whatever precision was typed. */
function openFeeEditor(){ FEE=(DATA.fee||[]).map(f=>({agencia:f.agencia||'',tipo:FEE_TIPOS.some(([v])=>v===f.tipo)?f.tipo:'AGENCIA',categoria:f.categoria||'',percentual:f.percentual!=null?Math.round(f.percentual*10000)/100:'',percentualRaw:f.percentual!=null?f.percentual:null,cc:f.cc||'',account:f.account||'',descricao:f.descricao||''})); if(!FEE.length)FEE=[{agencia:'',tipo:'AGENCIA',categoria:'',percentual:'',percentualRaw:null,cc:'',account:'',descricao:''}]; renderFeeEditor(); }
function feeRowSet(i,k,v){ if(FEE&&FEE[i]){ FEE[i][k]=v; if(k==='percentual') FEE[i].percentualRaw=null; } }
function feeAddRow(){ FEE.push({agencia:'',tipo:'AGENCIA',categoria:'',percentual:'',cc:'',account:'',descricao:''}); renderFeeEditor(); }
function feeDelRow(i){ FEE.splice(i,1); renderFeeEditor(); }
/* NOTE: `tipo` is constrained by the DB (fee_rateio_tipo_check) to exactly
   'AGENCIA' or 'KOL' — it is a classifier of the split, not a free-text name.
   `agencia` is the free-text agency name. Rendering `tipo` as free text (as
   this editor used to) let people type anything and made every save fail
   the check constraint — that was the "error editing rateios" bug. Keep
   `tipo` a closed select so every row is always save-able. */
const FEE_TIPOS=[['AGENCIA','Agency fee'],['KOL','KOL fee']];
function renderFeeEditor(){
  if(!FEE)return;
  const inp=(i,k,ph,w)=>`<input value="${esc(FEE[i][k])}" onchange="feeRowSet(${i},'${k}',this.value)" placeholder="${ph}" style="width:${w||'100%'};padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:#fff;font:inherit;font-size:12px">`;
  const tipoSel=(i,f)=>`<select onchange="feeRowSet(${i},'tipo',this.value)" style="width:100%;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:#fff;font:inherit;font-size:12px">${FEE_TIPOS.map(([v,l])=>`<option value="${v}" ${f.tipo===v?'selected':''}>${l}</option>`).join('')}</select>`;
  const rows=FEE.map((f,i)=>`<div style="display:grid;grid-template-columns:1fr 1fr .8fr .6fr 1fr 1fr 1.4fr 24px;gap:7px;align-items:center;margin-bottom:7px">
    ${inp(i,'agencia','Agency')}${tipoSel(i,f)}${inp(i,'categoria','Category')}<input type="number" step="0.01" value="${esc(f.percentual)}" onchange="feeRowSet(${i},'percentual',this.value)" placeholder="%" style="padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:#fff;font:inherit;font-size:12px;text-align:right" class="mono">${inp(i,'cc','Cost center')}${inp(i,'account','Account')}${inp(i,'descricao','Description')}<button onclick="feeDelRow(${i})" style="width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:var(--txt-3);font-size:11px;cursor:pointer">✕</button>
  </div>`).join('');
  $('#modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div role="dialog" aria-modal="true" class="modal" style="max-width:920px">
    <div class="modal-h"><h3>Fee split configuration (rateio)</h3><button class="x" onclick="closeModal()" aria-label="Close dialog">✕</button></div>
    <div class="modal-b">
      <div style="font-size:11.5px;color:var(--txt-3);margin-bottom:10px">Define how a shared invoice is split across categories by fixed percentages. % is per row; each row carries its cost center and account for the payment process.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr .8fr .6fr 1fr 1fr 1.4fr 24px;gap:7px;font-size:10px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px"><span>Agency</span><span>Type</span><span>Category</span><span style="text-align:right">%</span><span>Cost center</span><span>Account</span><span>Description</span><span></span></div>
      ${rows}
      <button class="btn-ghost" onclick="feeAddRow()" style="margin-top:4px">+ Add split row</button>
    </div>
    <div class="modal-f"><span></span><div style="display:flex;gap:10px"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-acc" style="background:var(--po)" onclick="saveFee()">Save splits</button></div></div>
  </div></div>`;
}
async function saveFee(){
  if(viewOnly()){toast(roMsg());return;}
  if(!FEE)return;
  const rows=FEE.filter(f=>(f.agencia||'').trim()&&FEE_TIPOS.some(([v])=>v===f.tipo)).map(f=>({agencia:f.agencia.trim(),tipo:f.tipo,categoria:(f.categoria||'').trim(),percentual:f.percentualRaw!=null?f.percentualRaw:(+f.percentual||0)/100,cc:(f.cc||'').trim(),account:(f.account||'').trim(),descricao:(f.descricao||'').trim()}));
  try{
    await SBPO.from('fee_rateio').delete().not('agencia','is',null);
    if(rows.length){ const {error}=await SBPO.from('fee_rateio').insert(rows); if(error)throw error; }
    const {data:fee}=await SBPO.from('fee_rateio').select('agencia,tipo,categoria,percentual,cc,account,descricao'); DATA.fee=fee||[];
    toast('Fee splits saved ✓'); closeModal(); go('budgets');
  }catch(e){ toastErr(e); }
}

/* ============================================================
   INIT
   ============================================================ */
boot();
</script>
</body>
</html>
