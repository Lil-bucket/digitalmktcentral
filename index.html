<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131a">
<title>TCL Platform — Work + Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    /* neutrals — cool graphite scale */
    --ink:#10131a; --ink-2:#1a1e27; --ink-3:#252b3a;
    --paper:#f3f4f8; --paper-2:#fafbfd; --card:#fff;
    --bg:#c4cad6; /* page canvas — medium gray so white cards pop; surfaces stay on --paper */
    --line:#e4e7ee; --line-2:#d2d6e0;
    --txt:#171a21; --txt-2:#59606e; --txt-3:#6f7684;
    /* brand duality — Work (cobalt) + Budget (TCL red) */
    --accent:#2b4fdd; --accent-deep:#1f3cba; --accent-soft:#e9edfc;
    --po:#e20613; --po-deep:#b4000b; --po-soft:#fde9ea;
    /* status */
    --green:#16a06a; --green-bg:#e2f5eb; --amber:#d68a04; --amber-bg:#fbf0d8; --amber-ink:#9c6404;
    --red:#e0392b; --red-bg:#fbe4e1; --violet:#6d4bd1; --violet-bg:#ece6fa;
    --blue:#1273cf; --blue-bg:#e0eefb; --slate:#59606e; --slate-bg:#e9ecf2;
    /* type */
    --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    /* type scale — 6 steps, use these instead of ad-hoc px sizes */
    --fs-eyebrow:10.5px; --fs-xs:11.5px; --fs-sm:12.5px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-hero:32px;
    /* radius scale — field / card / pill */
    --r-xs:8px; --r-sm:10px; --r-md:13px; --r-lg:16px; --r-pill:20px;
    /* elevation */
    --sh-1:0 1px 2px rgba(16,19,26,.05),0 1px 3px rgba(16,19,26,.04);
    --sh-2:0 2px 6px -1px rgba(16,19,26,.07),0 6px 16px -6px rgba(16,19,26,.08);
    --sh-3:0 24px 64px -16px rgba(16,19,26,.38),0 8px 24px -12px rgba(16,19,26,.22);
    /* motion */
    --ease:cubic-bezier(.22,1,.36,1); --fast:.15s; --med:.22s;
    /* focus */
    --ring:0 0 0 3px rgba(43,79,221,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,h4{font-family:var(--sans);letter-spacing:-.02em;font-weight:700;text-wrap:balance}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:background var(--fast) var(--ease),color var(--fast) var(--ease),border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease),filter var(--fast) var(--ease),transform var(--fast) var(--ease)}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  ::selection{background:rgba(43,79,221,.16)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  input,select,textarea{accent-color:var(--accent)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#c7ccd8;border-radius:8px;border:2px solid var(--paper)}
  ::-webkit-scrollbar-thumb:hover{background:#a9b0c0}

  /* ===== AUTH GATE ===== */
  .gate{position:fixed;inset:0;z-index:200;background:var(--ink);background-image:radial-gradient(52rem 34rem at 12% -8%,rgba(43,79,221,.22),transparent 60%),radial-gradient(46rem 30rem at 96% 108%,rgba(226,6,19,.16),transparent 60%);display:none;align-items:center;justify-content:center;padding:24px}
  .gate.show{display:flex}
  .gate-card{background:var(--card);border-radius:20px;padding:40px 34px 34px;max-width:400px;width:100%;text-align:center;box-shadow:var(--sh-3);animation:gateIn .35s var(--ease) both}
  @keyframes gateIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .gate-logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--accent) 50%,var(--po) 50%);color:#fff;font-weight:800;font-size:26px;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 8px 20px -6px rgba(16,19,26,.4)}
  .gate-card h2{font-size:21px;letter-spacing:-.025em;margin-bottom:6px}
  .gate-card p{font-size:13px;color:var(--txt-2);line-height:1.55;margin-bottom:22px}
  .gate-inp{width:100%;background:var(--paper);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 14px;font:inherit;font-size:14px;margin-bottom:10px;outline:none;transition:border-color var(--fast),box-shadow var(--fast),background var(--fast)}
  .gate-inp::placeholder{color:var(--txt-3)}
  .gate-inp:focus{border-color:var(--accent);background:#fff;box-shadow:var(--ring)}
  .gate-btn{width:100%;justify-content:center;display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:13px 22px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;margin-top:2px;box-shadow:var(--sh-1)}
  .gate-btn:hover{background:var(--accent-deep)}
  .gate-btn:active{transform:scale(.985)}
  .gate-btn:disabled{opacity:.55;cursor:default;transform:none}
  .gate-links{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
  .gate-links a{color:var(--txt-2);font-size:12.5px;cursor:pointer}
  .gate-links a:hover{color:var(--accent);text-decoration:none}
  .hide{display:none!important}
  .skip-link{position:absolute;left:-9999px;top:0;z-index:400;background:var(--ink);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;font-weight:700;font-size:13px}
  .skip-link:focus{left:0;text-decoration:none;outline:2px solid var(--accent);outline-offset:2px}

  /* ===== SHELL ===== */
  .app{display:flex;min-height:100vh}
  .side{width:236px;flex-shrink:0;background:var(--ink);color:#ced4e0;padding:20px 14px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side::-webkit-scrollbar-thumb{border-color:var(--ink)}
  .brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
  .brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent) 50%,var(--po) 50%);display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;flex-shrink:0;box-shadow:0 4px 12px -3px rgba(0,0,0,.5)}
  .brand b{color:#fff;font-size:14px;font-weight:700;display:block;line-height:1.15;letter-spacing:-.01em}
  .brand span{font-family:var(--mono);font-size:9px;color:#7d8493;letter-spacing:.12em;text-transform:uppercase}
  .nav-sec{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.18em;padding:16px 11px 6px}
  .nav-sec.work{color:#8fa3ff} .nav-sec.budget{color:#ff8d95}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:#a2a9b8;font-weight:600;font-size:12.5px;width:100%;text-align:left;position:relative}
  .nav-btn:hover{background:var(--ink-2);color:#fff}
  .nav-btn.on{background:var(--ink-3);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .nav-btn .dot2{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:box-shadow var(--fast)}
  .nav-btn.on .dot2{box-shadow:0 0 0 3px rgba(255,255,255,.09)}
  .nav-btn .badge{margin-left:auto;background:var(--po);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:800;font-family:var(--mono)}
  .side-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:4px}
  .side-foot .acct{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#8a90a0;font-size:11px;font-weight:600}
  .side-foot .acct .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;flex-shrink:0}
  .side-foot .acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-foot button{padding:8px 10px;border-radius:8px;background:var(--ink-2);color:#c8cedb;font-size:11.5px;font-weight:600;text-align:left}
  .side-foot button:hover{background:var(--ink-3);color:#fff}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
  .top .tl{display:flex;align-items:center;gap:13px;min-width:0}
  .top .barcol{width:7px;height:32px;border-radius:4px;flex-shrink:0}
  .top h1{font-size:18px;letter-spacing:-.025em;margin:0}
  .top .sub{font-size:12px;color:var(--txt-3);margin-top:1px}
  /* No overflow-y:auto here — #view never actually gets its own scrollbar
     (nothing constrains its height, .main just grows taller than 100vh and
     the PAGE scrolls), so this was dead weight that additionally broke
     position:sticky for everything inside it: overflow-y:auto with no
     overflow-x set computes overflow-x to 'auto' too (CSS overflow-spec
     coupling rule), making #view itself a sticky-positioning containing
     block — any sticky descendant then sticks to #view's own (never-
     scrolling) box instead of the page, freezing it at the wrong offset
     instead of actually tracking scroll. */
  .view{flex:1;padding:26px 28px 56px}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 15px 13px;position:relative;overflow:hidden;box-shadow:var(--sh-1);transition:box-shadow var(--med) var(--ease),transform var(--med) var(--ease)}
  .kpi:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
  .kpi .bar{position:absolute;left:0;right:0;top:0;bottom:auto;width:auto;height:3px}
  .kpi .lbl{font-size:10.5px;color:var(--txt-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .kpi .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:25px;font-weight:700;margin-top:8px;letter-spacing:-.045em}
  .kpi .meta{font-size:11px;color:var(--txt-3);margin-top:4px}
  .grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh-1)}
  .panel-h{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .panel-h h3{font-size:14px;letter-spacing:-.015em}
  .panel-h .tag{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);font-weight:500;letter-spacing:.02em}
  .panel-b{padding:6px 8px}
  .row-item{display:flex;gap:11px;padding:12px 11px;border-radius:10px;align-items:flex-start;cursor:pointer;transition:background var(--fast) var(--ease)}
  .row-item:hover{background:var(--paper)}
  .pin{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .rt{text-align:right;flex-shrink:0}
  .who{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:var(--ink);color:#fff;padding:2px 9px;border-radius:20px;margin-top:6px}
  .empty{text-align:center;padding:36px 16px;color:var(--txt-3);font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .badge .d{width:6px;height:6px;border-radius:50%}
  .s-green{background:var(--green-bg);color:#0c7048}.s-green .d{background:var(--green)}
  .s-amber{background:var(--amber-bg);color:#9c6404}.s-amber .d{background:var(--amber)}
  .s-red{background:var(--red-bg);color:#b32418}.s-red .d{background:var(--red)}
  .s-violet{background:var(--violet-bg);color:#5535ad}.s-violet .d{background:var(--violet)}
  .s-blue{background:var(--blue-bg);color:#0e5ba6}.s-blue .d{background:var(--blue)}
  .s-slate{background:var(--slate-bg);color:#494c54}.s-slate .d{background:var(--slate)}
  .avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0}
  /* No overflow here on purpose — ANY non-visible overflow (hidden or auto,
     even on a single axis) makes this the sticky-positioning containing
     block for descendants, which silently breaks "stick to the page" for
     the sticky <th> below (it'd stick to this box's own scroll instead,
     which never happens, so it just sits frozen in the wrong spot). Corner
     rounding is done on the header/body cells instead of via clipping. */
  .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1)}
  .tbl-wrap th:first-child{border-top-left-radius:14px}
  .tbl-wrap th:last-child{border-top-right-radius:14px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--paper-2);white-space:nowrap;position:sticky;top:var(--sticky-top,73px);z-index:4}
  td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background var(--fast) var(--ease)}
  tbody tr:hover{background:var(--paper)}
  th.r,td.r{text-align:right}
  .prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;width:90px}
  .prog i{display:block;height:100%;border-radius:6px}
  .meter{height:22px;border-radius:7px;overflow:hidden;display:flex;border:1px solid var(--line);background:var(--paper)}
  .meter span{display:block;height:100%}
  .stage-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .banner{background:#fdf6e4;border:1px solid #ecd9a4;color:#7a5200;padding:11px 14px;border-radius:11px;font-size:12.5px;margin-bottom:18px}
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:60vh;color:var(--txt-3);font-size:13px}
  .loading::before{content:'';width:24px;height:24px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(1turn)}}
  /* Background data refresh in flight — quiet by design: the reload icon
     spins, nothing moves or blocks. */
  #btnSync.syncing .icn{animation:spin .9s linear infinite;color:var(--accent)}
  [contenteditable][data-placeholder]:empty:before{content:attr(data-placeholder);color:var(--txt-3)}
  [contenteditable] ul{margin:4px 0 4px 18px}

  /* ===== MODAL ===== */
  .overlay{position:fixed;inset:0;background:rgba(13,15,20,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:36px 20px;overflow-y:auto;animation:fadeIn .16s ease-out}
  @keyframes fadeIn{from{opacity:0}}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:840px;box-shadow:var(--sh-3);animation:modalIn .2s var(--ease)}
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .overlay.no-anim,.modal.no-anim{animation:none}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-h h3{font-size:16.5px;letter-spacing:-.02em}
  .modal-h .x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--txt-3);font-size:18px}
  .modal-h .x:hover{background:var(--paper);color:var(--txt)}
  .modal-b{padding:20px 22px;max-height:74vh;overflow-y:auto}
  .modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  /* ===== DRAWER (painel lateral) ===== */
  .overlay.right{align-items:stretch;justify-content:flex-end;padding:0}
  .drawer{width:600px;max-width:94vw;height:100vh;height:100dvh;border-radius:0;display:flex;flex-direction:column;box-shadow:-18px 0 50px rgba(13,15,20,.3);animation:drawerIn .24s var(--ease)}
  @keyframes drawerIn{from{transform:translateX(48px);opacity:.3}to{transform:translateX(0);opacity:1}}
  .drawer .modal-b{flex:1;max-height:none;position:relative}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{margin-bottom:14px}.field.full{grid-column:1/-1}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--txt-2);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper-2);font:inherit;font-size:13.5px;color:var(--txt);outline:none;transition:border-color var(--fast),box-shadow var(--fast),background var(--fast)}
  .field input::placeholder,.field textarea::placeholder{color:var(--txt-3)}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff;box-shadow:var(--ring)}
  .btn-acc{padding:10px 18px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:13.5px;box-shadow:var(--sh-1)}
  .btn-acc:hover{filter:brightness(.9) saturate(1.05)}
  .btn-acc:active{transform:scale(.98)}
  .btn-ghost{padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--txt-2);border:1px solid var(--line-2);background:var(--card)}
  .btn-ghost:hover{background:var(--paper);color:var(--txt);border-color:#b9bfcc}
  .btn-ghost:active{transform:scale(.98)}
  .btn-del{padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;color:var(--red);border:1px solid #f0b8b2;background:var(--card)}
  .btn-del:hover{background:var(--red);color:#fff;border-color:var(--red)}
  .btn-del:active{transform:scale(.98)}
  .atv{border:1px solid var(--line-2);border-radius:12px;padding:12px;margin-bottom:9px;background:var(--card);transition:border-color var(--fast)}
  .atv.done{background:#eef8f1;border-color:#bfe4d0}
  .atv-top{display:flex;align-items:center;gap:10px}
  .atv-top input.nm{flex:1;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper-2);font-weight:600;font-size:13.5px;transition:border-color var(--fast),box-shadow var(--fast)}
  .atv-top input.nm:focus{border-color:var(--accent);box-shadow:var(--ring);outline:none}
  .atv-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:center}
  .atv-meta input,.atv-meta select{padding:6px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--card);font:inherit;font-size:12px}
  .chip-btn{font-size:11px;font-weight:600;color:var(--txt-2);border:1px solid var(--line-2);border-radius:7px;padding:5px 9px;background:var(--card)}
  .chip-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .sub{display:flex;align-items:center;gap:7px;margin-top:5px;padding-left:6px}
  .sub input.st{flex:1;padding:5px 9px;border:1px solid var(--line-2);border-radius:6px;background:transparent;font:inherit;font-size:12.5px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:opacity .28s var(--ease),transform .28s var(--ease);z-index:300;box-shadow:var(--sh-3);border:1px solid rgba(255,255,255,.09);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .ment{background:var(--violet-bg);color:var(--violet);font-weight:700;border-radius:4px;padding:0 4px}

  /* ===== ICONS + PROGRESS ALIGNMENT ===== */
  svg.icn{display:inline-block;vertical-align:-2px;flex-shrink:0}
  .ich{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .pbar{height:6px;border-radius:4px;background:#e9ebf1;overflow:hidden;display:flex;min-width:0}
  .pbar span{display:block;height:100%}
  .pct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;width:40px;text-align:right;flex-shrink:0;color:var(--txt-2)}

  /* Scroll-shadow affordance: a soft edge shadow only appears on a side while
     there's still content to reveal there — background-attachment:local pair

  .cc-wrap{overflow-x:auto;position:relative;background-color:#fff;background-repeat:no-repeat;

  /* Always-visible horizontal scrollbar. macOS ships overlay scrollbars by
     default ("show when scrolling"), so this table — the one place in the app
     where sideways scrolling is the whole point — otherwise reads as having no
     scrollbar at all. Giving the track an explicit height opts this container
     out of overlay mode in Blink/WebKit and keeps the affordance on screen. */
  .cc-wrap::-webkit-scrollbar{height:11px}

     position:sticky + top:var(--sticky-top) for the page-scrolling tables, and
     it leaks in here too. Inside .cc-wrap (its own scrollport, no vertical
     scroll) that offset doesn't pin anything — it just shoves the whole header
     ~80px down over the first data rows. Only the frozen s1/s2/s3 columns want
     sticky here, and horizontally only, so top stays auto for them. */
  .cc-tbl th{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--paper-2);border-bottom:1px solid var(--line);padding:8px 10px;position:static;top:auto}

  .cc-tbl thead .mband{background:#f4f6fb}
  .cc-tbl .msep{border-left:1px solid var(--line)}
  /* Frozen identity columns. The `left` offsets are the running sum of the
     widths before them, so a width change here means changing the next
     column's offset too — and CC_STICKY_W, which ccScrollTo() uses to park a
     month clear of them. */
  .cc-tbl .s0,.cc-tbl .s1,.cc-tbl .s2,.cc-tbl .s3{position:sticky;top:auto;z-index:2;background:#fff}
  .cc-tbl .s0{left:0;min-width:62px;max-width:62px;overflow:hidden;text-overflow:ellipsis}
  .cc-tbl .s1{left:62px;min-width:92px;max-width:92px;overflow:hidden;text-overflow:ellipsis}
  .cc-tbl .s2{left:154px;min-width:96px;max-width:96px;overflow:hidden;text-overflow:ellipsis}
  .cc-tbl .s3{left:250px;min-width:170px;max-width:170px;overflow:hidden;text-overflow:ellipsis;box-shadow:inset -1px 0 0 var(--line-2)}
  /* No vertical sticky header here: .cc-wrap needs overflow-x:auto for the
     horizontal scroll + frozen s0/s1/s2/s3 columns, and per the CSS overflow
     spec that FORCES overflow-y to 'auto' too (a lone non-visible axis pulls
     the other one off 'visible') — making .cc-wrap itself the sticky
     containing block for its cells, not the page. A row can't stick to a
     scroll position that never happens. Solving both at once needs a
     JS-synced dual-scrollbar split (separate header/body scroll areas),
     which is out of scope here — left as horizontal-only sticky. */
  .cc-tbl thead .s0,.cc-tbl thead .s1,.cc-tbl thead .s2,.cc-tbl thead .s3{background:var(--paper-2);z-index:5}
  .cc-tbl tfoot td{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:none;font-weight:700}
  .cc-tbl tfoot .s0,.cc-tbl tfoot .s1,.cc-tbl tfoot .s2,.cc-tbl tfoot .s3{background:var(--paper-2)}

  .cc-tbl td.cc-drill{font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:#aeb5c4;text-underline-offset:3px}

function humanErr(e){
  const raw=(e&&(e.message||e.error_description||e.details))||String(e||'');

  if(s.includes('duplicate key')||s.includes('unique constraint')) return 'This month already has a value — edit the existing entry instead of adding a new one.';

function computeRecommendations(){
  const out=[];
  // 1) Projects stalled in the same stage/status for too long
  DATA.projetos.forEach(p=>{
    if(p.status==='concluido')return;
    const lu=latestLog(p);
    const base=lu?lu.t:p.inicio;
    if(!base)return;
    const days=Math.round((today0()-new Date(String(base).slice(0,10)+'T00:00:00'))/864e5);
    if(days>=10){
      out.push({sev:'high',icon:'pause',text:`"${p.nome}" has had no updates in ${days} days (stage: ${stageOf(p.etapa).name}).`,onclick:`openProj('${p.id}')`});
    }
  });
  // 2) Budget >90% consumed with no closed PO yet
  if(PO_ACCESS){
    const funds=(DATA.poProjetos||[]).filter(p=>p.aprovacao_status==='APROVADO');
    const tetoBy={},consBy={},hasConcl={};
    DATA.tetos.forEach(t=>tetoBy[t.fund_id]=(tetoBy[t.fund_id]||0)+(+t.teto||0));
    DATA.rateio.forEach(r=>tetoBy[r.fund_id]=(tetoBy[r.fund_id]||0)+(+r.valor||0));
    DATA.pos.forEach(po=>{ const v=+po.valor||0; if(['FATURADA','VALIDADA','CONCLUIDA','APROVADA','PO_GERADA','ATUALIZAR_INFO'].includes(po.status)) consBy[po.fund_id]=(consBy[po.fund_id]||0)+v; if(po.status==='CONCLUIDA') hasConcl[po.fund_id]=true; });
    funds.forEach(p=>{
      const tot=tetoBy[p.id]||0; if(!tot)return;
      const pct=(consBy[p.id]||0)/tot*100;
      if(pct>=90&&!hasConcl[p.id]){
        out.push({sev:'high',icon:'coins',text:`Fund "${p.nome}" has ${Math.round(pct)}% of its budget committed but no PO has been closed (CONCLUÍDA) yet.`,onclick:`openFundDetail('${p.id}')`});
      }
    });
    // Cap possibly double-counted: rows in BOTH tetos and rateio_alocacao
    const _hasTeto=new Set(DATA.tetos.map(t=>t.fund_id)), _hasRat=new Set(DATA.rateio.map(r=>r.fund_id));
    funds.forEach(p=>{ if(_hasTeto.has(p.id)&&_hasRat.has(p.id)) out.push({sev:'high',icon:'scale',text:`Fund "${p.nome}" has cap rows in BOTH tetos and rateio_alocacao — its cap may be double-counted. Check with diag_fees_rateio.sql.`,onclick:`openFundDetail('${p.id}')`}); });
    // 4) Agency PO volume vs. configured rateio split
    const feeByTipo={}; (DATA.fee||[]).forEach(f=>{ if(!f.tipo)return; (feeByTipo[f.tipo]=feeByTipo[f.tipo]||[]).push(f); });
    Object.keys(feeByTipo).forEach(tipo=>{
      const rows=feeByTipo[tipo]; const totalPct=rows.reduce((s,f)=>s+(+f.percentual||0),0); if(!totalPct)return;
      const fundsTipo=funds.filter(p=>p.rateio_tipo===tipo);
      if(!fundsTipo.length)return;
      const ids=new Set(fundsTipo.map(p=>p.id));
      const byCat={}; DATA.rateio.forEach(r=>{ if(ids.has(r.fund_id)&&r.categoria) byCat[r.categoria]=(byCat[r.categoria]||0)+(+r.valor||0); });
      const totalAlloc=Object.values(byCat).reduce((s,v)=>s+v,0); if(!totalAlloc)return;
      rows.forEach(f=>{
        const expected=(+f.percentual||0)/totalPct*100;
        const actual=((byCat[f.categoria]||0)/totalAlloc)*100;
        if(Math.abs(actual-expected)>=15){
          out.push({sev:'medium',icon:'scale',text:`Rateio "${tipo}" — category "${f.categoria||'—'}" is running at ${Math.round(actual)}% of allocation vs. ${Math.round(expected)}% configured.`,onclick:`go('budgets')`});
        }
      });
    });
  }
  // 3) Overdue tasks
  DATA.projetos.forEach(p=>{
    if(p.status==='concluido')return;
    (p.tasks||[]).forEach(t=>{
      if(t.done||!t.fim)return;
      const dd=daysTo(t.fim);
      if(dd!==null&&dd<0){
        out.push({sev:'medium',icon:'clock',text:`Task "${t.n||'Untitled'}" in "${p.nome}" is ${-dd} day(s) overdue.`,onclick:`openProj('${p.id}')`});
      }
    });
  });
  const order={high:0,medium:1,low:2};
  out.forEach(r=>r.hash=recHash(r.text));
  const dismissed=recDismissed(), now=Date.now();
  const visible=out.filter(r=>!(dismissed[r.hash]&&(now-dismissed[r.hash])<14*864e5));
  return visible.sort((a,b)=>order[a.sev]-order[b.sev]).slice(0,12);
}

/* Network backstop: even though every write path already checks viewOnly()
   (true in demo mode) before touching SBPO, swap it for an inert stub too —
   belt and suspenders, so a write path that's missed a viewOnly() check
   (e.g. something in the Work module) fails safely instead of silently
   reaching the real Supabase project. */
function fakeSupabaseClient(){
  const err={message:'Demo mode — no backend connected.'};
  const builder={select(){return builder;},eq(){return builder;},neq(){return builder;},in(){return builder;},not(){return builder;},order(){return builder;},limit(){return builder;},
    update(){return builder;},upsert(){return builder;},insert(){return builder;},delete(){return builder;},
    maybeSingle:()=>Promise.resolve({data:null,error:null}),single:()=>Promise.resolve({data:null,error:err}),
    then(resolve){ resolve({data:null,error:err}); }};
  return {
    auth:{ getSession:async()=>({data:{session:null}}), signOut:async()=>({error:null}), signInWithPassword:async()=>({data:null,error:err}), onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}) },
    from(){ return builder; },
    rpc:async()=>({data:null,error:err})
  };
}

/* Public shared-timeline view — a link generated by exportProjTimeline(),
   e.g. central.po-control.com.br/?share=<uuid>. Needs no auth: get_timeline_share
   is a SECURITY DEFINER RPC callable by the anon role, returning exactly the
   one row matched by id (the table itself has no SELECT policy at all, so it
   can't be listed/enumerated any other way). Replaces the whole document with
   the stored standalone export — same document.open/write/close technique
   used to preview exports during dev, just triggered on load instead of from
   the console. */
async function renderSharedTimeline(shareId){
  const fail=msg=>{
    document.open();
    document.write('<!doctype html><html><head><meta charset="utf-8"><title>Timeline link</title><style>:root{color-scheme:light}body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#fff;color:#14161c;font-size:14px}</style></head><body>'+msg+'</body></html>');
    document.close();
  };
  try{
    const {data,error}=await SBPO.rpc('get_timeline_share',{share_id:shareId});
    if(error) throw error;
    if(!data){ fail('This link is invalid or the timeline is no longer available.'); return; }
    document.open(); document.write(data); document.close();
  }catch(e){ fail('Could not load this timeline.'); }
}
async function boot(){
  try{
    const shareId=new URLSearchParams(location.search).get('share');
    if(shareId){ await renderSharedTimeline(shareId); return; }
  }catch(e){}
  try{
    if(new URLSearchParams(location.search).get('demo')==='1'){ startDemo(); return; }
  }catch(e){}
  let gateMsg;
  try{
    const {data}=await SBPO.auth.getSession();
    if(data&&data.session&&data.session.user){
      /* getSession() hands back whatever localStorage holds — an expired
         refresh token included. Booting on that leaves the app looking
         signed in while every query comes back 400 InvalidJWT and nothing
         on screen says why. getUser() validates against the server, so a
         dead session lands on the sign-in gate instead of a zombie app. */
      const {error:dead}=await SBPO.auth.getUser();
      if(!dead){ onSignedIn(data.session.user); return; }
      try{ await SBPO.auth.signOut({scope:'local'}); }catch(e){}
      gateMsg='Session expired. Sign in again.';
    }
  }catch(e){}
  showGate(gateMsg);
  SBPO.auth.onAuthStateChange((ev,sess)=>{
    if(sess&&sess.user){if(!booted)setTimeout(()=>onSignedIn(sess.user),0);}
    else if(ev==='SIGNED_OUT'){booted=false;showGate('Session ended. Sign in again.');}
  });
}

  try{ await loadPTasksRemote(); }catch(e){}

/* Resolves the signed-in user's role directly against the single Supabase
   project (Budget-Control) — replaces the old two-project ssoPO() dance
   (a separate sign-in re-using the just-typed password, plus a password-sync
   fallback edge function) that existed only because Work and Budget used to
   live in different Supabase projects. Now there is one session, so there is
   nothing left to synchronize. */
async function loadPapel(){
  window.__poErr='';
  try{
    const {data:p,error}=await SBPO.rpc('papel_atual');
    if(error){ window.__poErr='papel_atual: '+error.message; }
    PAPEL=p||'';
    PO_ACCESS=!!PAPEL && PAPEL!=='pendente';
    if(!PAPEL && !window.__poErr) window.__poErr='no role for this user';
  }catch(e){ PO_ACCESS=false; window.__poErr=(e&&e.message)||'papel_atual failed'; }
  if(PAPEL==='agencia'){
    try{ const {data:a}=await SBPO.rpc('agencia_atual'); MINHA_AGENCIA=a||''; }catch(e){}
    try{ const {data:n}=await SBPO.rpc('agencia_nivel_atual'); AGENCIA_NIVEL=n||'completo'; }catch(e){}
  }
}

/* Every stored project passes through this on the way in: records written by
   older versions carry Portuguese/legacy key names (atividades, subitens,
   texto…) and some predate the status/pct fields entirely. etapa/status are
   derived, never trusted from the row — which also means a refresh
   recomputes "Late" against today's date, not against whenever this tab
   happened to be opened. */
function normProjeto(p){
  p.tasks=(p.tasks||p.atividades||p.activities||p.checklist||[]).map(t=>({...t, n:t.n||t.nome||t.titulo||t.title||'', done:!!t.done, fim:t.fim||t.due||'', status:t.status||(t.done?'concluido':'no_prazo'), pct:t.pct!=null?t.pct:(t.done?100:0), obs:t.obs||t.nota||'', subs:t.subs||t.subitens||[]}));
  p.logs=(p.logs||p.updates||[]).map(l=>({...l, txt:l.txt||l.texto||l.mensagem||l.msg||'', autor:l.autor||l.author||l.by||'', t:l.t||l.data||l.date||''}));
  p.etapa=effectiveEtapa(p); p.status=autoStatus(p);
  return p;
}

/* A table that failed keeps whatever it had instead of blanking: a refresh
   that half-fails should degrade to "one panel is stale", never to

function tookOr(r,prev){ return (!r||r.error)?prev:(r.data||[]); }
async function loadAll(){
  const wantPO=!!PO_ACCESS;

  // sequential waves (await the act_* tables, then await the eight PO ones),
  // so every full load cost two round-trips back to back. Each query also
  // catches on its own, so a single broken table can't reject the batch and
  // strand the other nine.
  const qs=Q_WORK().concat(wantPO?Q_BUDGET():[]);
  const r=await Promise.all(qs.map(q=>Promise.resolve(q).then(x=>x,e=>({data:null,error:e}))));
  const [pr,cf]=r;

  if(cf&&!cf.error){

    STAGE_DESCS=Object.assign({},STAGE_DESCS_DEFAULT,s.stageDescs||{});
  }
  if(!wantPO)return;
  const [orc,prj,pos,tet,rat,nt,pes,fee,camp,campCat,lay]=r.slice(2);
  DATA.orcamentos=tookOr(orc,DATA.orcamentos);
  DATA.poProjetos=(prj&&prj.error)?DATA.poProjetos:((prj.data||[]).filter(p=>p.aprovacao_status!=='REJEITADO'));
  DATA.pos=tookOr(pos,DATA.pos);
  DATA.tetos=tookOr(tet,DATA.tetos);
  DATA.rateio=tookOr(rat,DATA.rateio);
  DATA.notif=tookOr(nt,DATA.notif);
  DATA.pessoas=tookOr(pes,DATA.pessoas);

/* ============================================================
   LIVE REFRESH
   ============================================================
   DATA used to be fetched exactly once, at sign-in, and from then on only
   patched by whatever this tab itself wrote. A tab left open for a few hours
   was therefore showing a frozen snapshot: activities other people had
   already ticked off still counted as pending, so their projects kept
   rendering as "Late" until someone hit Reload — items that "looked late but
   weren't". Now every navigation, every screen re-render and every return to
   the tab refetches the whole app in the single parallel batch above. */
let SYNCING=false, LAST_SYNC=0, SYNC_SUPPRESS=false, SYNC_DEFERRED=false;
const SYNC_GAP=12000; // ms — implicit refreshes coalesce; nav clicks and tab-focus force through
function modalOpen(){ const m=document.getElementById('modalMount'); return !!(m&&m.firstElementChild); }
function syncBadge(on){
  const b=document.getElementById('btnSync'); if(!b)return;
  b.classList.toggle('syncing',!!on);
  b.title=on?'Updating…':'Reload page';
}
function syncRerender(){
  // SYNC_SUPPRESS stops the re-render's own go() from asking for yet another
  // refresh, which would loop forever.
  SYNC_SUPPRESS=true;
  try{ buildNav(); go(SCREEN); } finally{ SYNC_SUPPRESS=false; }
}
async function refreshAll(opts){
  const force=!!(opts&&opts.force);
  if(DEMO_MODE||!booted||SYNCING)return;
  if(!force&&Date.now()-LAST_SYNC<SYNC_GAP)return;
  SYNCING=true; syncBadge(true);
  try{ await loadAll(); LAST_SYNC=Date.now(); }
  catch(e){ console.warn('refresh:',e); }
  finally{ SYNCING=false; syncBadge(false); }
  // Data is in either way; only the repaint waits. Re-rendering underneath an
  // open modal would rebuild the screen behind it — and on 'reqpo' would even
  // re-fire openReqPO() over a half-filled form — so defer to closeModal().
  if(modalOpen()){ SYNC_DEFERRED=true; return; }
  syncRerender();
}
/* Sidebar navigation forces past the throttle: clicking into a screen is
   exactly when you expect to be looking at current data. The screen paints
   from cache first so navigation stays instant, then repaints when the batch
   lands. */
function navGo(id){ go(id); refreshAll({force:true}); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshAll({force:true}); });

/* #view has no height cap of its own (it grows to fit content) — the
   PAGE/body is what actually scrolls, with .top staying pinned via its own
   sticky+z-index:20. So any sticky table header rendered inside #view can't
   just use top:0 — that sits exactly where .top already is and ends up
   hidden behind it (higher z-index). --sticky-top is the real height of
   .top + #viewAsBar (the latter only appears for admin "View as" on Budget
   screens), measured fresh after every render since it varies by screen. */
function syncStickyOffset(){
  const topBar=document.querySelector('.top'), vab=document.getElementById('viewAsBar');
  const h=(topBar?topBar.getBoundingClientRect().height:0)+(vab?vab.getBoundingClientRect().height:0);
  document.documentElement.style.setProperty('--sticky-top',h+'px');
}

/* Opens the detail against a freshly-read row, not the cached one — clicking
   into an item is the moment its real status matters most, and one indexed
   row is a cheap read. Falls back to cache if the read fails, so a flaky
   connection still opens the modal. */
async function openProj(id){
  let p=DATA.projetos.find(x=>x.id===id); if(!p)return;
  if(!DEMO_MODE){
    try{
      const {data,error}=await SBPO.from('act_projects').select('data').eq('id',id).maybeSingle();
      if(!error&&data&&data.data){
        p=normProjeto(data.data);
        const i=DATA.projetos.findIndex(x=>x.id===id);
        if(i>=0)DATA.projetos[i]=p;
      }
    }catch(e){}
  }
  openProjModal(JSON.parse(JSON.stringify(p)), false);
}
/* Duplicate: opens a prefilled "new project" form (same type/categories/brand/
   activity names) rather than silently creating a copy — nothing is saved
   until the user reviews it and hits Create, same as any other new project.
   Progress-specific state (done/pct/status, sub-item completion, comment log)
   resets fresh; the due date/start carry over as a starting point to edit. */
function dupProj(id){
  const src=DATA.projetos.find(x=>x.id===id); if(!src)return;
  const clone=JSON.parse(JSON.stringify(src));
  clone.id=uid();
  clone.nome=(src.nome||'Project')+' (copy)';
  clone.owner=(currentUser&&currentUser.email)||clone.owner;
  clone.resp=(currentUser&&currentUser.email)||clone.resp;
  clone.tasks=(clone.tasks||[]).map(t=>{
    const nt={...t,id:uid(),done:false,pct:0,subs:(t.subs||[]).map(s=>({...s,id:uid(),done:false}))};
    nt.status=autoAtvStatus(nt);
    return nt;
  });
  clone.logs=[];
  delete clone.etapa_override;
  openProjModal(clone, true);
}

/* Export (read-only) — one row per project already in projList() (respects the
   active business-type/status filters), plus one activities sheet per project. */
function sanitizeSheetName(name){
  return (name||'').replace(/[:\\\/\?\*\[\]]/g,'').trim().slice(0,31)||'Projeto';
}
function exportWorkXLSX(){
  if(!window.XLSX){ toast('Exportação indisponível — script não carregado.'); return; }
  const list=projList();
  if(!list.length){ toast('Nenhum projeto para exportar.'); return; }
  const wb=XLSX.utils.book_new();
  const resumo=list.map(p=>({
    'Projeto': p.nome||'',
    'Responsável': respName(p.resp)||'',
    'Início': p.inicio||'',
    'Fim': p.prazo||'',
    'Status': statusOf(p.status).name
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumo), 'Resumo');
  const usedNames={};
  list.forEach(p=>{
    const base=sanitizeSheetName(p.nome);
    let name=base, n=2;
    while(usedNames[name]){ name=base.slice(0,28)+'_'+n; n++; }
    usedNames[name]=true;
    const ws=XLSX.utils.aoa_to_sheet([
      ['Projeto', p.nome||''],
      ['Responsável', respName(p.resp)||''],
      ['Início', p.inicio||''],
      ['Fim', p.prazo||''],
      ['Status', statusOf(p.status).name],
      []
    ]);
    const grid=(p.tasks||[]).map(t=>({
      'Atividade': t.n||'',
      'Responsável': respName(t.resp)||'',
      'Início': t.inicio||'',
      'Fim': t.fim||'',
      'Status': statusOf(t.status).name,
      'Observações': t.obs||''
    }));
    if(grid.length) XLSX.utils.sheet_add_json(ws, grid, {origin:-1});
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, `projetos_TCL_${new Date().toISOString().slice(0,10)}.xlsx`);
}

let FUND_CTX=null;
/* The funds actually on screen: what this profile may see (FUND_CTX.list

/* ===== Category view: activity columns (fixed, aligned across categories) + compact cards ===== */
const ACT_COL_ORDER=['Campaign','FEE','KOL','AON','Communication'];
function actColLabel(a){ return ({Campaign:'Campaign',FEE:'Fee',KOL:'KOL',AON:'AON',Communication:'Comms'})[a]||a||'Other'; }
// "Campaings" is a legacy misspelling that exists in some older records — fold
// it into "Campaign" so it doesn't show up as a second, visually-identical
// column (both render the same label via ACT_META, but were never the same
// grouping key).
const ACT_KEY_ALIASES={Campaings:'Campaign'};
function actKey(p){ const raw=(p.activity||'').trim()||'Other'; return ACT_KEY_ALIASES[raw]||raw; }
function orderActs(keys){
  const set=[...new Set(keys)];
  return set.sort((a,b)=>{ let ia=ACT_COL_ORDER.indexOf(a), ib=ACT_COL_ORDER.indexOf(b); if(ia<0)ia=99; if(ib<0)ib=99; return ia-ib||a.localeCompare(b); });
}
function fundGlobalActs(){
  const {list}=FUND_CTX||{list:[]};
  return orderActs(list.map(actKey));
}
function fundGlobalCats(){

/* Itemized fund row — one per fund, grouped by activity. This is the

/* Shared budget gauge: cap vs consumed+committed, as a single-color bar with

/* ===== Fund lifecycle + alternative views (list / timeline) ===== */
const LC_ORDER={over:0,near:1,active:2,pending:3,done:4};
function fundLastMonth(pid){
  const ms=Object.keys(fundMonthlyTotals(pid));
  (DATA.pos||[]).forEach(po=>{ if(po.fund_id===pid&&po.competencia&&!['REJEITADA','CANCELADA'].includes(po.status)) ms.push(String(po.competencia).slice(0,7)); });
  ms.sort(); return ms[ms.length-1]||'';
}
function fundLifecycle(p){
  if(!FUND_CTX) return 'active';
  if(p.aprovacao_status==='PENDENTE') return 'pending';
  const {tetoBy,consBy,compBy,pendBy}=FUND_CTX;
  const teto=tetoBy[p.id]||0, tot=(consBy[p.id]||0)+(compBy[p.id]||0)+(pendBy[p.id]||0);
  const pct=teto?tot/teto*100:0;
  const lastM=fundLastMonth(p.id), nowM=new Date().toISOString().slice(0,7);
  if(teto&&pct>=99.5&&lastM&&lastM<nowM) return 'done';
  if(teto&&pct>100.5) return 'over';
  if(teto&&pct>=90) return 'near';
  return 'active';
}
function fundBadgeHTML(p){
  const {tetoBy,consBy,compBy,pendBy}=FUND_CTX;
  const teto=tetoBy[p.id]||0, tot=(consBy[p.id]||0)+(compBy[p.id]||0)+(pendBy[p.id]||0);
  const pctTot=teto?tot/teto*100:0, lc=fundLifecycle(p);
  const base='font-size:10px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:4px';
  if(lc==='done') return `<span style="${base};background:var(--slate-bg);color:#494c54">${icn('check',10)} Completed</span>`;
  if(lc==='over') return `<span style="${base};background:#fbe4e1;color:#bf0008">${icn('alert',11)} ${Math.round(pctTot)}% over</span>`;
  if(lc==='near') return `<span style="${base};background:#fbf0d8;color:#9c6404">${Math.round(pctTot)}% committed</span>`;

/* ============================================================
   MONTH-END BALANCE REALLOCATION — a closed month's unused cap can be
   moved forward: fully to next month, split evenly across the fund's
   remaining registered months, or manual per-month amounts. Adds new
   tetos/rateio_alocacao rows (additive — the closed month's own record is
   untouched, everything here is summed by fund_id+competencia elsewhere
   in the app already).
   ============================================================ */
let REALLOC=null; // {pid,fromMonth,balance,mode,splitCount,rows:[{id,mes,valor}]}
/* Fresh, server-side reread of a month's unused balance — mirrors
   fundPastUnallocatedBalance()'s definition exactly (cap minus every PO not
   REJEITADA/CANCELADA) but bypasses the in-memory DATA cache, which is only
   as current as this browser tab's last load/reload. Used by submitRealloc
   as a right-before-write staleness check. */
async function reallocFetchCurrentBalance(pid,fromMonth){
  const comp=fromMonth+'-01';
  const [{data:tetoRows,error:e1},{data:rateioRows,error:e2},{data:poRows,error:e3}]=await Promise.all([
    SBPO.from('tetos').select('teto').eq('fund_id',pid).eq('competencia',comp),
    SBPO.from('rateio_alocacao').select('valor').eq('fund_id',pid).eq('competencia',comp),
    SBPO.from('pos').select('valor,status').eq('fund_id',pid).eq('competencia',comp)
  ]);
  if(e1)throw e1; if(e2)throw e2; if(e3)throw e3;
  const cap=(tetoRows||[]).reduce((s,r)=>s+(+r.teto||0),0)+(rateioRows||[]).reduce((s,r)=>s+(+r.valor||0),0);
  const committed=(poRows||[]).filter(po=>!['REJEITADA','CANCELADA'].includes(po.status)).reduce((s,po)=>s+(+po.valor||0),0);
  return r2(cap-committed);
}
function fundNextCalMonth(m){ const y=+m.slice(0,4), mo=+m.slice(5,7); return mo===12?(y+1)+'-01':m.slice(0,4)+'-'+String(mo+1).padStart(2,'0'); }
function fundFutureRegisteredMonths(pid,afterM){ return Object.keys(fundMonthlyTotals(pid)).filter(m=>m>afterM).sort(); }
function openReallocModal(pid,fromMonth,balance){
  const p=DATA.poProjetos.find(x=>x.id===pid); if(!p)return;
  const future=fundFutureRegisteredMonths(pid,fromMonth);
  REALLOC={pid,fromMonth,balance:+balance,mode:'next',splitCount:Math.max(future.length,3),rows:[{id:uid(),mes:fundNextCalMonth(fromMonth),valor:r2(balance)}]};
  renderReallocModal();
}
function reallocSetMode(mode){ if(!REALLOC)return; REALLOC.mode=mode; renderReallocModal(); }
function reallocSetSplitCount(v){ if(!REALLOC)return; REALLOC.splitCount=Math.max(1,Math.min(24,+v||1)); renderReallocModal(); }
function reallocManualSet(id,k,v){ const r=REALLOC&&REALLOC.rows.find(x=>x.id===id); if(r)r[k]=v; }
function reallocManualAdd(){ if(!REALLOC)return; const last=REALLOC.rows[REALLOC.rows.length-1]; REALLOC.rows.push({id:uid(),mes:last?fundNextCalMonth(last.mes):fundNextCalMonth(REALLOC.fromMonth),valor:''}); renderReallocModal(); }
function reallocManualDel(id){ if(!REALLOC)return; REALLOC.rows=REALLOC.rows.filter(x=>x.id!==id); renderReallocModal(); }
function reallocPreviewRows(){
  if(!REALLOC)return [];
  const {mode,fromMonth,balance,splitCount,pid}=REALLOC;
  if(mode==='next') return [{mes:fundNextCalMonth(fromMonth),valor:r2(balance)}];
  if(mode==='split'){
    const future=fundFutureRegisteredMonths(pid,fromMonth);
    let months=future;
    if(!months.length){ months=[]; let m=fromMonth; for(let i=0;i<splitCount;i++){ m=fundNextCalMonth(m); months.push(m); } }
    const n=months.length||1, each=r2(Math.floor(balance/n*100)/100);
    return months.map((m,i)=>({mes:m,valor:i===n-1?r2(balance-each*(n-1)):each}));
  }
  return REALLOC.rows.map(r=>({mes:r.mes,valor:+r.valor||0}));
}
function renderReallocModal(){

  const manualRows=mode==='manual'?`<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
    ${REALLOC.rows.map(r=>`<div style="display:flex;align-items:center;gap:9px"><input type="month" value="${esc(r.mes)}" onchange="reallocManualSet('${r.id}','mes',this.value);renderReallocModal()" style="padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font:inherit;font-size:12.5px"><input type="number" min="0" step="100" value="${esc(r.valor)}" onchange="reallocManualSet('${r.id}','valor',this.value);renderReallocModal()" placeholder="R$ 0" style="flex:1;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font:inherit;font-size:12.5px;text-align:right" class="mono"><button class="chip-btn" onclick="reallocManualDel('${r.id}')">✕</button></div>`).join('')}
    <button class="btn-ghost" onclick="reallocManualAdd()" style="align-self:flex-start;margin-top:2px">+ Add month</button>
  </div>`:'';
  const previewHTML=`<div style="border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:14px">
    <div style="padding:9px 13px;background:#fafbfd;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em">Preview</div>

      <div style="display:flex;justify-content:space-between;font-size:12.5px;border-top:1px solid #edeff4;padding-top:7px;margin-top:2px"><b>Total</b><b class="mono" style="color:${mismatch?'var(--po)':'inherit'}">${BRL(sum)}</b></div>
    </div>
  </div>${mismatch?`<div class="banner" style="background:var(--red-bg);border-color:#f0b8b2;color:#b32418;margin-top:10px">Total must match the available balance of ${BRL(balance)}.</div>`:''}`;
  $('#modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeRealloc()"><div role="dialog" aria-modal="true" class="modal" style="max-width:520px">

    <div class="modal-b">
      <div style="font-size:12.5px;color:var(--txt-3);margin-bottom:14px">${fmtMes(fromMonth+'-01')} closed with <b class="mono" style="color:var(--txt)">${BRL(balance)}</b> unused. Choose how to move it forward — the amount is added to the future months' caps and deducted from ${fmtMes(fromMonth+'-01')}, so the total budget stays the same.</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${modeCard('next','Add fully to next month',`Everything goes to ${fmtMes(fundNextCalMonth(fromMonth)+'-01')}.`)}
        ${modeCard('split','Distribute equally','Spread evenly across the following months.')}
        ${modeCard('manual','Manual','Pick the months and amounts yourself.')}
      </div>
      ${splitNote}
      ${manualRows}
      ${previewHTML}
    </div>
    <div class="modal-f"><span></span><div style="display:flex;gap:10px"><button class="btn-ghost" onclick="closeRealloc()">Cancel</button><button class="btn-acc" style="background:var(--po)" onclick="submitRealloc()">Reallocate</button></div></div>
  </div></div>`;
}
function closeRealloc(){ const pid=REALLOC&&REALLOC.pid; REALLOC=null; if(pid) openFundDetail(pid); else closeModal(); }
/* tetos has UNIQUE(fund_id,competencia) — a target month that already has a
   cap must be UPDATED (existing + amount), never inserted a second time. */
async function reallocCreditTetos(pid,targets){
  for(const t of targets){
    const comp=t.mes+'-01';
    const {data,error}=await SBPO.from('tetos').select('id,teto').eq('fund_id',pid).eq('competencia',comp).limit(1);
    if(error)throw error;
    const cur=(data||[])[0];
    if(cur){ const {error:e2}=await SBPO.from('tetos').update({teto:r2((+cur.teto||0)+(+t.valor||0))}).eq('id',cur.id); if(e2)throw e2; }
    else{ const {error:e3}=await SBPO.from('tetos').insert({fund_id:pid,competencia:comp,teto:r2(+t.valor||0),definido_por:'realocacao'}); if(e3)throw e3; }
  }
}
/* Reallocation MOVES money: the source month's cap must drop by the same amount,
   otherwise the total budget grows. teto has CHECK (teto >= 0). */
async function reallocDebitTetos(pid,fromMonth,amount){
  const comp=fromMonth+'-01';
  const {data,error}=await SBPO.from('tetos').select('id,teto').eq('fund_id',pid).eq('competencia',comp).limit(1);
  if(error)throw error;
  const cur=(data||[])[0]; if(!cur)return;
  const {error:e2}=await SBPO.from('tetos').update({teto:Math.max(0,r2((+cur.teto||0)-(+amount||0)))}).eq('id',cur.id);
  if(e2)throw e2;
}
/* rateio_alocacao has no unique key (rows are summed), but the source month's
   rows still have to be reduced proportionally by the amount moved out.
   Rounding each row's reduction independently can drift the total debited
   away from `amount` by a few cents — every row but the last keeps its own
   rounded reduction, the last absorbs whatever's left so the total moved
   always matches `amount` exactly (same pattern as submitCampValues). */
async function reallocDebitRateio(pid,fromMonth,amount){
  const comp=fromMonth+'-01';
  const {data,error}=await SBPO.from('rateio_alocacao').select('id,valor').eq('fund_id',pid).eq('competencia',comp);
  if(error)throw error;
  const rows=data||[]; const tot=rows.reduce((s,r)=>s+(+r.valor||0),0); if(!tot)return;
  let runningCut=0;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    let cut=r2((+amount||0)*((+r.valor||0)/tot));
    if(i===rows.length-1) cut=r2((+amount||0)-runningCut); else runningCut+=cut;
    const nv=Math.max(0,r2((+r.valor||0)-cut));
    const {error:e2}=await SBPO.from('rateio_alocacao').update({valor:nv}).eq('id',r.id); if(e2)throw e2;
  }
}
async function submitRealloc(){
  if(viewOnly()){toast(roMsg());return;}
  if(!REALLOC)return;
  const preview=reallocPreviewRows().filter(r=>r.mes&&(+r.valor||0)>0);
  if(!preview.length){ toast('Add at least one month with a value.'); return; }
  const sum=preview.reduce((s,r)=>s+(+r.valor||0),0);
  if(REALLOC.mode==='manual'&&r2(sum)!==r2(REALLOC.balance)){ toast('Total must match the available balance.'); return; }
  const p=DATA.poProjetos.find(x=>x.id===REALLOC.pid); if(!p)return;
  const moved=r2(sum);
  try{
    /* Guard against a stale-page double reallocation (real incident: a second
       user whose page hadn't refreshed re-opened this same month's balance
       and submitted again, crediting the destination month twice while the
       source month — already at 0 — just clamped, hiding the problem). The
       modal's REALLOC.balance was captured whenever the page/fund was
       last loaded; re-derive the SAME balance fresh from the server right
       before writing and refuse if it no longer matches — this is exactly
       what would have caught it. */
    const fresh=await reallocFetchCurrentBalance(REALLOC.pid,REALLOC.fromMonth);
    if(Math.abs(fresh-REALLOC.balance)>0.5){
      toast('This balance changed since you opened this — it may have already been reallocated. Reload and try again.');
      REALLOC=null; closeModal(); await reloadPOAll(); goCostCenter();
      return;
    }
    if(p.rateio){
      const cats=[...new Set((DATA.rateio||[]).filter(r=>r.fund_id===p.id).map(r=>r.categoria))];
      if(!cats.length){ toast('Cannot resolve rateio categories for this fund.'); return; }
      const totalByCat={}; (DATA.rateio||[]).filter(r=>r.fund_id===p.id&&r.competencia&&String(r.competencia).slice(0,7)===REALLOC.fromMonth).forEach(r=>{ totalByCat[r.categoria]=(totalByCat[r.categoria]||0)+(+r.valor||0); });
      const totAll=Object.values(totalByCat).reduce((a,b)=>a+b,0)||1;
      const rows=[];
      /* Same reconciliation as submitCampValues/reqSplitBreakdown — every
         category but the last keeps its own rounded share of pr.valor, the
         last absorbs the remainder so each month's split always sums back
         to exactly pr.valor. */
      preview.forEach(pr=>{
        let running=0;
        cats.forEach((cat,i)=>{
          const share=(totalByCat[cat]||(totAll/cats.length))/totAll;
          let valor=r2(pr.valor*share);
          if(i===cats.length-1) valor=r2(pr.valor-running); else running+=valor;
          rows.push({fund_id:p.id,categoria:cat,competencia:pr.mes+'-01',valor});
        });
      });
      const {error}=await SBPO.from('rateio_alocacao').insert(rows); if(error)throw error;
      await reallocDebitRateio(p.id,REALLOC.fromMonth,moved);
    } else {
      await reallocCreditTetos(p.id,preview);
      await reallocDebitTetos(p.id,REALLOC.fromMonth,moved);
    }
    toast('Balance reallocated ✓'); REALLOC=null; closeModal(); await reloadPOAll(); goCostCenter();
  }catch(e){ toastErr(e); }
}

/* Edit the fund's month-by-month values. For a normal / integral fund
   the values are the category caps (tetos). For a rateio fund, the value
   entered per month is the TOTAL, re-split across the rateio categories. */
let FUNDVAL=null;
function openCampValues(pid){
  const p=DATA.poProjetos.find(x=>x.id===pid); if(!p)return;
  const totals=fundMonthlyTotals(pid);
  const rows=Object.keys(totals).sort().map(m=>({id:uid(),mes:m,valor:totals[m]}));
  if(!rows.length) rows.push({id:uid(),mes:new Date().toISOString().slice(0,7),valor:''});
  FUNDVAL={id:pid,rateio:!!p.rateio,qual:(p.rateio?recoverQual(pid):''),rows};
  renderCampValues();
}
function fundValRowSet(id,k,v){ const r=FUNDVAL&&FUNDVAL.rows.find(x=>x.id===id); if(r)r[k]=v; }
/* R$ entry mask. Digits go in from the right — typing 1234 gives 12,34 — which
   is how people actually key money in, and it makes a malformed amount
   impossible to submit. Storage stays a plain number; only the field is
   formatted. */
const moneyFmt=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const moneyParse=s=>{ const d=String(s==null?'':s).replace(/\D/g,''); return d?(+d)/100:0; };
/* The fund's approved ceiling. A stored fact, fixed when the fund is
   approved — never derived from what it currently holds.

   The derived version this replaces (category budget minus the other
   funds, floored at the fund's own total) moved with the very edit it
   was meant to validate: raising a month raised the ceiling with it, so it
   could never report an overage, and pulling the months back down only ever
   showed a growing surplus against a number that had already drifted up.

   Falls back to what the fund holds today when cap_aprovado is missing — a
   fund still pending approval — so the box degrades to "no ceiling news"
   rather than to a ceiling of zero. */
function fundCapAprovado(pid){
  const p=(DATA.poProjetos||[]).find(x=>x.id===pid);
  if(!p) return null;
  if(p.cap_aprovado!=null&&p.cap_aprovado!=='') return +p.cap_aprovado;
  return Object.values(fundMonthlyTotals(pid)).reduce((s,v)=>s+v,0);
}
function fundCapPedido(p){ return (p&&p.cap_pedido!=null&&p.cap_pedido!=='')?+p.cap_pedido:null; }
/* Raising a cap is an approval, lowering it is not. Giving budget back needs
   nobody's permission; taking more does. So marketing files a request and an
   admin/manager decides, while an admin/manager can set the cap directly —
   which is also how a cap inflated by mistake gets corrected. */
let CAPEDIT=null;
function openCapEdit(pid){
  const p=DATA.poProjetos.find(x=>x.id===pid); if(!p)return;
  if(!canRestrict()){ toast('Only marketing managers or admin can set the cap.'); return; }
  CAPEDIT={id:pid,mode:'set',valor:fundCapAprovado(pid)||0,motivo:''};
  renderCapForm();
}
function openCapPedido(pid){
  const p=DATA.poProjetos.find(x=>x.id===pid); if(!p)return;
  CAPEDIT={id:pid,mode:'ask',valor:fundCapAprovado(pid)||0,motivo:''};
  renderCapForm();
}
function capSet(k,v){ if(CAPEDIT)CAPEDIT[k]=v; }
function capMoney(el){ const v=moneyParse(el.value); CAPEDIT.valor=v; el.value=v?moneyFmt(v):''; }

  const ask=CAPEDIT.mode==='ask';
  const delta=(+CAPEDIT.valor||0)-cur;
  /* Lowering below what the months already hold would leave the fund
     instantly over its own cap, so it's refused here rather than saved into an

  const below=!ask&&(+CAPEDIT.valor||0)<alloc-0.005;
  $('#modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div role="dialog" aria-modal="true" class="modal" style="max-width:480px">
    <div class="modal-h" style="align-items:flex-start"><span style="width:7px;height:30px;border-radius:4px;background:var(--po);flex-shrink:0;margin-right:2px"></span><div style="flex:1"><h3>${ask?'Request a higher cap':'Approved cap'}</h3><div style="font-size:12px;color:var(--txt-3)">${esc(p.nome||'')}</div></div><button class="x" onclick="closeModal()" aria-label="Close dialog">✕</button></div>
    <div class="modal-b">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">

        <div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper-2)"><div style="font-size:10px;font-weight:700;color:var(--txt-3);text-transform:uppercase">Months allocated</div><div class="mono" style="font-size:15px;font-weight:800;margin-top:3px">${BRL(alloc)}</div></div>
      </div>
      <div class="field"><label>${ask?'Cap you need':'New cap'}</label><span style="position:relative;display:flex;align-items:center"><span style="position:absolute;left:11px;font-size:12px;color:var(--txt-3);pointer-events:none">R$</span><input type="text" inputmode="numeric" value="${CAPEDIT.valor?moneyFmt(CAPEDIT.valor):''}" oninput="capMoney(this)" placeholder="0,00" class="mono" style="width:100%;padding:9px 11px 9px 34px;text-align:right"></span>

async function submitCampValues(){
  if(viewOnly()){toast(roMsg());return;}
  if(!FUNDVAL)return; const cv=FUNDVAL;
  const rows=cv.rows.filter(r=>r.mes&&(+r.valor||0)>0);
  if(!rows.length){ toast('Add at least one month with a value.'); return; }
  // Re-check the cap here too: the button is disabled while over, but the cap
  // is derived from data that a background refresh can move under the modal.
  const limit=fundCapAprovado(cv.id);
  const total=rows.reduce((s,r)=>s+(+r.valor||0),0);
  if(limit!=null&&total>limit+0.005){ toast(`Over the approved cap by ${BRL(total-limit)} — reduce the months, or request an increase.`); return; }
  try{
    if(cv.rateio){
      let splits=(DATA.fee||[]).filter(f=>f.tipo===cv.qual);
      if(!splits.length && cv.qual){ splits=(DATA.fee||[]).filter(f=>String(f.tipo||'').toUpperCase()===String(cv.qual||'').toUpperCase()); }
      if(!splits.length){ toast('Cannot resolve the rateio categories. Re-pick the rateio in "Edit category / budget".'); return; }
      const alloc=[];
      /* Independently rounding each category's share (r2(v*pct)) drifts a
         few cents/reais off the typed monthly total whenever the fee
         percentuals are repeating decimals (e.g. thirds) — every row but the
         last gets its own rounded share, the last absorbs whatever's left so
         the split always reconciles exactly to v. Same pattern already used
         by reqSplitBreakdown() for the PO-request split-by-percentage flow. */
      rows.forEach(r=>{
        const v=+r.valor||0; let running=0;
        splits.forEach((s,i)=>{
          let valor=r2(v*(+s.percentual||0));
          if(i===splits.length-1) valor=r2(v-running); else running+=valor;
          alloc.push({fund_id:cv.id,categoria:s.categoria||null,competencia:r.mes+'-01',valor});
        });
      });
      await SBPO.from('rateio_alocacao').delete().eq('fund_id',cv.id);
      const {error}=await SBPO.from('rateio_alocacao').insert(alloc); if(error)throw error;
    }else{
      await SBPO.from('tetos').delete().eq('fund_id',cv.id);
      const tetos=rows.map(r=>({fund_id:cv.id,competencia:r.mes+'-01',teto:r2(+r.valor),definido_por:'portal'}));
      const {error}=await SBPO.from('tetos').insert(tetos); if(error)throw error;
    }
    FUNDVAL=null; toast('Values updated ✓'); closeModal(); await reloadPOAll(); goCostCenter();
  }catch(e){ toastErr(e); }
}

let FUNDEDIT=null;
function guessCat(str){ const s=String(str||'').toUpperCase(); for(const c of PRODUCT_CATS){ if(new RegExp('(^|[^A-Z])'+c+'([^A-Z]|$)').test(s)) return c; } return ''; }
function fundMonthlyTotals(pid){
  const m={};
  DATA.tetos.filter(t=>t.fund_id===pid).forEach(t=>{const k=String(t.competencia).slice(0,7);m[k]=(m[k]||0)+(+t.teto||0);});
  DATA.rateio.filter(r=>r.fund_id===pid).forEach(r=>{const k=String(r.competencia).slice(0,7);m[k]=(m[k]||0)+(+r.valor||0);});
  return m; // {'2026-07': 148000, ...}

function recoverQual(pid){
  // Prefer the persisted rateio type (deterministic). Fall back to the old
  // heuristic only for legacy funds saved before rateio_tipo existed.
  const p=(DATA.poProjetos||[]).find(x=>x.id===pid);
  if(p&&p.rateio_tipo) return p.rateio_tipo;
  const cs=new Set((DATA.rateio||[]).filter(r=>r.fund_id===pid&&r.categoria).map(r=>r.categoria));
  if(!cs.size) return '';
  let found='';
  rateioTipos().forEach(tp=>{ const tset=new Set((DATA.fee||[]).filter(f=>f.tipo===tp).map(f=>f.categoria)); if(tset.size===cs.size && [...cs].every(c=>tset.has(c))) found=tp; });
  return found;
}

/* Fee-split POs share a po_grupo_id (set at creation, see submitReqPO) so
   the whole rest of the lifecycle can treat several underlying `pos` rows
   (one per category, needed for per-category budget enforcement) as a
   single PO — one card, one approval, one PO number, one NF. Every action
   function below resolves the real sibling rows from a clicked id and loops
   the same per-row RPC across all of them; only the list/detail rendering
   needs to collapse them into one displayed entry. */
function poGroupSiblings(po){
  if(!po)return [];
  if(!po.po_grupo_id)return [po];
  return DATA.pos.filter(x=>x.po_grupo_id===po.po_grupo_id);
}
function poGroupLabel(sibs){
  const nomeBy={}; DATA.poProjetos.forEach(p=>nomeBy[p.id]=p);
  const cats=[...new Set(sibs.map(p=>{const pr=nomeBy[p.fund_id]; return pr?pr.product_category:'';}).filter(Boolean))];
  return 'Fee — '+(sibs[0].agencia||'')+(cats.length?' ('+cats.join('/')+')':'');
}
/* Collapses grouped rows into one display entry per po_grupo_id (or per id
   when ungrouped) — combined value, all real ids kept on _sib for actions
   and the detail modal's breakdown. */
function poDisplayList(pos){
  const seen=new Map(); const out=[];
  pos.forEach(po=>{
    const key=po.po_grupo_id||po.id;
    if(seen.has(key)) seen.get(key)._sib.push(po);
    else{ const rep={...po,_sib:[po]}; seen.set(key,rep); out.push(rep); }
  });
  out.forEach(rep=>{ if(rep._sib.length>1) rep.valor=rep._sib.reduce((s,p)=>s+(+p.valor||0),0); });
  return out;
}

async function aprovarPO(id){

  if(viewOnly()){toast(roMsg());return;}
  try{
    for(const po of sibs){ const {error}=await SBPO.rpc('aprovar_po',{p_po:po.id}); if(error)throw error; }
    toast('PO approved ✓'); await reloadPO(); go(SCREEN);
  }catch(e){ toastErr(e); }
}
async function rejeitarPO(id){
  const sibs=poGroupSiblings(DATA.pos.find(x=>x.id===id));
  if(DEMO_MODE){ sibs.forEach(po=>po.status='REJEITADA'); toast('PO rejected (demo)'); go(SCREEN); return; }
  if(viewOnly()){toast(roMsg());return;}
  try{
    for(const po of sibs){ const {error}=await SBPO.rpc('rejeitar_po',{p_po:po.id}); if(error)throw error; }
    toast('PO rejected'); await reloadPO(); go(SCREEN);

async function aprovarCamp(id){
  if(DEMO_MODE){ const p=DATA.poProjetos.find(x=>x.id===id); if(p)p.aprovacao_status='APROVADO'; toast('Fund approved ✓ (demo)'); go(SCREEN); return; }
  if(viewOnly()){toast(roMsg());return;}
  try{
    const {error}=await SBPO.rpc('aprovar_fund',{p_fund:id}); if(error)throw error;
    /* Freeze the ceiling at approval. From here the monthly values may be
       redistributed or reduced freely, but the total can only grow through an
       approved request — which is the whole point of approving an opening. */
    const cap=r2(Object.values(fundMonthlyTotals(id)).reduce((s,v)=>s+v,0));
    try{ await SBPO.from('funds').update({cap_aprovado:cap}).eq('id',id); }
    catch(e2){ console.warn('cap_aprovado on approval:',(e2&&e2.message)||e2); }
    toast(`Fund approved ✓ — cap fixed at ${BRL(cap)}`); await reloadPOAll(); go(SCREEN);
  }
  catch(e){ toastErr(e); }
}
async function rejeitarCamp(id){
  const motivo=prompt('Reason for rejecting the fund:'); if(motivo===null)return;
  if(DEMO_MODE){ DATA.poProjetos=DATA.poProjetos.filter(x=>x.id!==id); toast('Fund rejected (demo)'); go(SCREEN); return; }
  if(viewOnly()){toast(roMsg());return;}
  try{ const {error}=await SBPO.rpc('rejeitar_fund',{p_fund:id,p_motivo:motivo}); if(error)throw error; toast('Fund rejected'); await reloadPOAll(); go(SCREEN); }
  catch(e){ toastErr(e); }
}

function fmtDataBR(s){ if(!s)return'—'; const p=String(s).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s; }
function calcVencimento(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr+'T00:00:00'); const day=d.getDate(); const y=d.getFullYear(), m=d.getMonth();
  if(day<=8) return new Date(y,m,25);
  if(day<=12) return new Date(y,m+1,5);
  if(day<=18) return new Date(y,m+1,15);
  return new Date(y,m+1,25); // 19-25 e 26-31 (bloqueio) → dia 25 do mês seguinte
}
function fmtDateObjBR(d){ if(!d)return'—'; return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function poEstimativaPagamento(po){
  if(po.vencimento) return {date:fmtDataBR(po.vencimento),confirmed:true};
  if(['REJEITADA','CANCELADA'].includes(po.status)) return null;
  const base=po.solicitado_em?String(po.solicitado_em).slice(0,10):null;
  if(!base) return null;
  return {date:fmtDateObjBR(calcVencimento(base)),confirmed:false};
}

function sanitizeRich(html){
  const tmp=document.createElement('div'); tmp.innerHTML=html||'';
  const allowed=new Set(['B','STRONG','UL','LI','BR','DIV']);
  function process(node){
    Array.from(node.childNodes).forEach(process);
    if(node.nodeType===1){
      if(!allowed.has(node.tagName)){
        while(node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
        node.parentNode.removeChild(node);
      } else {
        Array.from(node.attributes).forEach(a=>node.removeAttribute(a.name));
      }
    } else if(node.nodeType!==3){
      node.parentNode && node.parentNode.removeChild(node);
    }
  }
  Array.from(tmp.childNodes).forEach(process);
  return tmp.innerHTML;
}

/* Scans real people (DATA.pessoas — the actual roster with emails) for
   @mentions in a log update. Was scanning the legacy, largely-empty TEAM
   roster before, which is why "@mention" never actually notified anyone —
   TEAM entries rarely carry a usable email.
   Two passes so duplicate first names don't cross-fire: pass 1 matches full
   "@First Last" mentions (typed via the autocomplete, which always inserts
   the full name) and blanks out whatever it claims; pass 2 falls back to
   bare "@First" against whatever's left, so an already-claimed "@Ana Ramos"
   can't also accidentally match a separate "Ana Costa". */
function pmMentionScan(txt){
  const esc2=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const people=taggablePessoas();
  const out=[], seen=new Set(); let work=txt;
  people.forEach(pe=>{
    const nome=[pe.nome,pe.sobrenome].filter(Boolean).join(' ').trim();
    if(!nome||!nome.includes(' ')||seen.has(pe.email))return;
    const re=new RegExp('@'+esc2(nome)+'\\b','ig');
    if(re.test(work)){ out.push({nome,email:pe.email}); seen.add(pe.email); work=work.replace(re,m=>' '.repeat(m.length)); }
  });
  people.forEach(pe=>{
    if(seen.has(pe.email))return;
    const nome=[pe.nome,pe.sobrenome].filter(Boolean).join(' ').trim();
    if(!nome)return;
    const first=(pe.nome||nome).split(/\s+/)[0];
    const re=new RegExp('@'+esc2(first)+'\\b','i');
    if(re.test(work)){ out.push({nome,email:pe.email}); seen.add(pe.email); }
  });
  return out;
}

/* Clicking outside the modal (the dimmed backdrop) while editing an existing
   project saves instead of discarding — matches every other in-modal edit
   here, which already writes straight into EDIT with no separate "unsaved
   changes" concept. New projects still just cancel: autosaving a blank/
   half-filled "New project" form on an accidental outside click would create
   junk records, and validation (name/type required) would trap the user in
   a form they were trying to leave. */
function pmOverlayClose(){

async function saveProj(){
  if(!EDIT)return;
  if(!(EDIT.nome||'').trim()){ toast('Give the project a name.'); return; }
  if(!EDIT.ptipo){ toast('Select the project type.'); return; }
  const clean=JSON.parse(JSON.stringify(EDIT)); delete clean._new;
  const fromTask=clean._fromTask; delete clean._fromTask;
  clean.etapa=effectiveEtapa(clean); clean.status=autoStatus(clean);
  try{
    const {error}=await SBPO.from('act_projects').upsert({id:clean.id,data:clean});
    if(error)throw error;
    const i=DATA.projetos.findIndex(p=>p.id===clean.id);
    if(i>=0)DATA.projetos[i]=clean; else DATA.projetos.push(clean);
    if(fromTask){ const l=loadPTasks(); const t=l.find(x=>x.id===fromTask); if(t&&!t.done){ t.done=true; t.updatedAt=Date.now(); savePTasks(l); } }
    toast('Project saved ✓'); closeModal(); go(SCREEN);
  }catch(e){ toastErr(e); }
}
async function delProj(id){
  if(!confirm('Delete this project? This action cannot be undone.'))return;
  try{ await SBPO.from('act_projects').delete().eq('id',id); DATA.projetos=DATA.projetos.filter(p=>p.id!==id); toast('Project deleted'); closeModal(); go(SCREEN); }
  catch(e){ toastErr(e); }
}

/* Work-origin notifications (project @mentions) are computed live from
   project logs — there's no DB row to mark read/delete against, unlike
   Budget's "notificacoes" table. Persist read/dismissed state client-side
   per notification, keyed the same way buildNotifList already dedupes
   (proj+txt+t) — mirrors the existing dismissRec() localStorage pattern. */
function wnKey(x){ return x.proj+'|'+x.txt+'|'+x.t; }
function wnState(){ try{ return JSON.parse(localStorage.getItem('wn_state')||'{}')||{}; }catch(e){ return {}; } }
function wnSave(s){ try{ localStorage.setItem('wn_state',JSON.stringify(s)); }catch(e){} }
function notifMarkReadWork(key,val){ const s=wnState(); s[key]=val?'read':'unread'; wnSave(s); go(SCREEN); }
function notifDeleteWork(key){ const s=wnState(); s[key]='dismissed'; wnSave(s); go(SCREEN); }
async function notifMarkAllRead(){
  const wn=wnState();
  buildNotifList().filter(x=>x.origin==='work'&&!x.lida).forEach(x=>{ wn[x.key]='read'; });
  wnSave(wn);
  const ids=DATA.notif.filter(n=>!n.lida).map(n=>n.id);
  if(ids.length){
    try{ await SBPO.from('notificacoes').update({lida:true}).in('id',ids); DATA.notif.forEach(n=>n.lida=true); }
    catch(e){ toastErr(e); return; }
  }
  go(SCREEN); toast('All marked as read ✓');
}
async function notifClearAll(){
  const all=buildNotifList(); if(!all.length)return;
  if(!confirm('Delete all notifications? This cannot be undone.'))return;
  const wn=wnState();
  all.filter(x=>x.origin==='work').forEach(x=>{ wn[x.key]='dismissed'; });
  wnSave(wn);
  const ids=DATA.notif.map(n=>n.id);
  if(ids.length){
    try{ await SBPO.from('notificacoes').delete().in('id',ids); DATA.notif=[]; }
    catch(e){ toastErr(e); return; }
  }
  go(SCREEN); toast('Notifications cleared');
}
function buildNotifList(){
  const wn=wnState();
  const ms=myMentions().map(m=>({...m,origin:'work'}));
  const tbl=(DATA.mencoes||[]).map(m=>({proj:m.projeto_nome,pid:'',txt:m.mensagem,autor:m.autor,t:String(m.criado_em||'').slice(0,10),origin:'work'}));
  const budget=(DATA.notif||[]).map(n=>({proj:'Budget · PO',pid:'',poId:n.po_id||'',projId:n.fund_id||'',tipo:n.tipo||'',txt:n.mensagem||'PO update requiring your attention',autor:'PO',t:String(n.criada_em||'').slice(0,10),origin:'budget',id:n.id,lida:!!n.lida}));
  const seen=new Set();
  return [...tbl,...ms,...budget].filter(x=>{const k=x.proj+'|'+x.txt+'|'+x.t;if(seen.has(k))return false;seen.add(k);return true;})
    .map(x=>{
      if(x.origin!=='work')return x;
      const key=wnKey(x), st=wn[key];
      if(st==='dismissed')return null;
      return {...x,key,lida:st==='read'};
    }).filter(Boolean)
    .sort((a,b)=>String(b.t).localeCompare(String(a.t)));
}
