<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070d">
<title>MKT Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" integrity="sha384-JUh163oCRItcbPme8pYnROHQMC6fNKTBWtRG3I3I0erJkzNgL7uxKlNwcrcFKeqF" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<style>
  :root{
    /* neutrals — cool graphite scale */
    --ink:#10131a; --ink-2:#1a1e27; --ink-3:#252b3a;
    --paper:#0f1628; --paper-2:#0c1222; --card:#131b31;
    /* v2 surface — every card/panel in the mockups is this gradient + hairline */
    --surf:linear-gradient(180deg,#161f36,#111931); --line-card:rgba(255,255,255,.13);
    --sh-card:inset 0 1px 0 rgba(255,255,255,.06),0 12px 32px -12px rgba(0,0,0,.8);
    --field:#0a0f1d;
    --bg:#05070d; /* Estilo Realidade Virtual — canvas preto da página */
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --txt:#eef1f8; --txt-soft:#dfe3ee; --txt-1:#eef1f8; --txt-2:#a7aec2; --txt-3:#747c92;
    /* brand duality — Work (cobalt) + Budget (TCL red)
       accent/po ficam com o tom "deep" original (preenchimento sólido com
       texto branco, já testado ≥6:1); accent-deep passou a ser o tom "bright"
       usado como texto/borda/ícone sobre fundo escuro (5:1+) — os poucos
       pontos que usavam accent-deep como texto-sobre-pill-clara (dep-opt.on,
       cc-drill hover) foram trocados para var(--accent) logo abaixo. */
    --accent:#2b4fdd; --accent-deep:#4d7dff; --accent-soft:rgba(77,125,255,.14);
    --po:#e20613; --po-deep:#b4000b; --po-soft:rgba(255,59,78,.14);
    /* status — brilho ajustado para ≥4.5:1 sobre #05070d/--card */
    --green:#2fd88a; --green-bg:rgba(47,216,138,.14); --amber:#ffb020; --amber-bg:rgba(255,176,32,.14); --amber-ink:#ffb020;
    --red:#ff5c5c; --red-bg:rgba(255,92,92,.14); --violet:#a685ff; --violet-bg:rgba(166,133,255,.14);
    --blue:#4fb8ff; --blue-bg:rgba(79,184,255,.14); --slate:#9aa3b8; --slate-bg:rgba(154,163,184,.14);
    /* type */
    --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    /* type scale — 6 steps, use these instead of ad-hoc px sizes */
    --fs-eyebrow:10.5px; --fs-xs:11.5px; --fs-sm:12.5px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-hero:32px;
    /* radius scale — field / card / pill */
    --r-xs:8px; --r-sm:10px; --r-md:13px; --r-lg:16px; --r-pill:20px;
    /* elevation */
    --sh-1:none;
    --sh-2:var(--sh-card);
    --sh-3:0 40px 100px -20px rgba(0,0,0,.9);
    /* motion */
    --ease:cubic-bezier(.22,1,.36,1); --fast:.15s; --med:.22s;
    /* focus */
    --ring:0 0 0 3px rgba(43,79,221,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* Dark UI end to end: native controls (date-picker icons, select popups,
     scrollbars) render in their dark variant, and any field or option that
     doesn't set its own colour inherits the light text instead of the
     browser's default black — which read as black-on-navy across modals. */
  :root{color-scheme:dark}
  input,select,textarea{color:var(--txt)}
  input::placeholder,textarea::placeholder{color:var(--txt-3)}
  option,optgroup{background:#0f1628;color:#eef1f8}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    /* Estilo Realidade Virtual (Etapa 2) — grade + glow discretos sobre o canvas; cards/paineis internos não mudam nesta etapa */
    background-image:
      radial-gradient(46rem 30rem at 10% -10%, rgba(77,125,255,.14), transparent 60%),
      radial-gradient(40rem 28rem at 100% 10%, rgba(255,59,78,.08), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 24px);
    background-attachment:fixed}
  h1,h2,h3,h4{font-family:var(--sans);letter-spacing:-.02em;font-weight:700;text-wrap:balance}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:background var(--fast) var(--ease),color var(--fast) var(--ease),border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease),filter var(--fast) var(--ease),transform var(--fast) var(--ease)}
  a{color:#7d9dff;text-decoration:none} a:hover{color:#a9bdff}
  ::selection{background:rgba(77,125,255,.25)}
  :focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;border-radius:4px}
  input,select,textarea{accent-color:var(--accent-deep)}
  *{scrollbar-color:#1c2338 transparent;scrollbar-width:thin}

  /* ===== ESTILO REALIDADE VIRTUAL (Etapa 2 — layout raiz + navegação) =====
     Escopo local, só nestes seletores: login (.gate), sidebar (.side) e barra
     superior (.top). .gate-card (o formulário de login em si) e tudo dentro
     de .view (telas internas) continuam nos tokens antigos até a Etapa 3/4 —
     por isso os overrides ficam presos aqui, nunca no :root. */
  .gate,.side,.top,.skip-link{
    --ink:#0a0e18; --ink-2:#131829; --ink-3:#1c2338;
  }
  .top{
    --txt:#eef1f8; --txt-2:#a7aec2; --txt-3:#747c92;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --card:#0d1220; --paper:#0f1424;
  }

  /* ===== AUTH GATE ===== */
  .gate{position:fixed;inset:0;z-index:200;background:var(--ink);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 24px),radial-gradient(42rem 28rem at 8% -12%,rgba(77,125,255,.10),transparent 55%),radial-gradient(36rem 24rem at 98% 108%,rgba(255,59,78,.08),transparent 55%);display:none;align-items:center;justify-content:center;padding:24px}
  .gate.show{display:flex}
  .gate-card{background:var(--surf);border:1px solid var(--line-card);border-radius:20px;padding:40px 34px 34px;max-width:400px;width:100%;text-align:center;box-shadow:var(--sh-3);animation:gateIn .35s var(--ease) both}
  @keyframes gateIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .gate-logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--accent) 50%,var(--po) 50%);color:#fff;font-weight:800;font-size:26px;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 8px 20px -6px rgba(16,19,26,.4)}
  .gate-card h2{font-size:21px;letter-spacing:-.025em;margin-bottom:6px}
  .gate-card p{font-size:13px;color:var(--txt-2);line-height:1.55;margin-bottom:22px}
  .gate-inp{width:100%;background:var(--paper);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 14px;font:inherit;font-size:14px;margin-bottom:10px;outline:none;transition:border-color var(--fast),box-shadow var(--fast),background var(--fast)}
  .gate-inp::placeholder{color:var(--txt-3)}
  .gate-inp:focus{border-color:var(--accent-deep);background:var(--card);box-shadow:var(--ring)}
  .gate-btn{width:100%;justify-content:center;display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:13px 22px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;margin-top:2px;box-shadow:var(--sh-1)}
  .gate-btn:hover{background:var(--accent-deep)}
  .gate-btn:active{transform:scale(.985)}
  .gate-btn:disabled{opacity:.55;cursor:default;transform:none}
  .gate-links{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
  .gate-links a{color:var(--txt-2);font-size:12.5px;cursor:pointer}
  .gate-links a:hover{color:var(--accent-deep);text-decoration:none}
  .hide{display:none!important}
  .skip-link{position:absolute;left:-9999px;top:0;z-index:400;background:var(--ink);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;font-weight:700;font-size:13px}
  .skip-link:focus{left:0;text-decoration:none;outline:2px solid var(--accent-deep);outline-offset:2px}

  /* ===== SHELL (F1/D5 — top nav, fixed, sub-rows fixed right below it;
     replaces the old sidebar. Same DOM/IDs as before — #navGlobal/#navWork/
     #navBudget just now lay out horizontally — so buildNav()/navBtn() in the
     JS below needed no changes, only this CSS did.) ===== */
  .app{display:flex;flex-direction:column;min-height:100vh}
  /* Nav — Nav.dc.html: 62px glass bar, content boxed to the same 1280px as
     every page, brand left · hubs centred · bell + account right. Sign out,
     reload, "view as" and People & Roles live in the account menu so the bar
     carries exactly the mockup's six items. */
  .side{position:sticky;top:0;z-index:30;background:rgba(5,7,13,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
  .side-in{max-width:1280px;margin:0 auto;padding:0 28px;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:center;gap:11px;color:var(--txt);flex-shrink:0}
  .brand:hover{color:var(--txt)}
  .brand .dot{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4d7dff 50%,#ff3b4e 50%);box-shadow:0 0 22px -4px rgba(77,125,255,.6);flex-shrink:0}
  .brand b{font-weight:800;font-size:15.5px;letter-spacing:-.01em}
  .nav-mid{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}
  #navGlobal,#navWork,#navBudget{display:flex;align-items:center;gap:2px}
  .nav-sec{display:none}
  .nav-btn{display:flex;align-items:center;gap:6px;padding:0 13px;height:62px;color:#a7aec2;font-weight:600;font-size:14px;border-bottom:2px solid transparent;border-radius:0;white-space:nowrap}
  .nav-btn:hover{color:var(--txt)}
  .nav-btn.on{color:var(--txt);border-bottom-color:#4d7dff}
  .nav-btn .dot2{display:none}
  .nav-btn .badge,.nav-btn .tag{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#ff8a96;background:none;padding:0;border-radius:0}
  .nav-bell{position:relative;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#a7aec2;display:grid;place-items:center;flex-shrink:0}
  .nav-bell:hover,.nav-bell.on{color:#fff;border-color:rgba(255,255,255,.28)}
  .nav-bell .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#ff3b4e;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .side-foot{position:relative;display:flex;align-items:center;gap:14px;flex-shrink:0}
  .acct{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border-radius:12px;text-align:left}
  .acct:hover,.acct[aria-expanded="true"]{background:rgba(255,255,255,.05)}
  .acct .av{width:32px;height:32px;border-radius:50%;background:#1c2338;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--txt);flex-shrink:0}
  .acct-txt{display:flex;flex-direction:column;line-height:1.2}
  .acct-name{font-size:12.5px;font-weight:600;color:var(--txt);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct-role{font-family:var(--mono);font-size:10px;color:#ff8a96;text-transform:uppercase}
  .acct-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:60;min-width:260px;background:#0f1628;border:1px solid rgba(255,255,255,.14);border-radius:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);padding:6px}
  .acct-menu[hidden]{display:none}
  .acct-menu-h{padding:9px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column;gap:2px}
  .acct-menu-h span:first-child{font-size:12.5px;color:var(--txt);font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .acct-menu-h span:last-child{font-family:var(--mono);font-size:10.5px;color:var(--txt-3)}
  .acct-menu button,.acct-menu .mi{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--txt-2);text-align:left}
  .acct-menu button:hover{background:rgba(255,255,255,.06);color:var(--txt)}
  .acct-menu .mi{flex-direction:column;align-items:stretch;gap:6px;cursor:default}
  .acct-menu .mi label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3)}
  .acct-menu select{padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--field);color:var(--txt);font:inherit;font-size:12.5px}

  /* Page frame — every mockup <main>: max-width 1280, 28px gutters, the
     eyebrow (mono, muted) ABOVE a 38px/800 title, then the hub tabs. */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top,#hubTabsHost,#viewAsBar,.view{width:100%;max-width:1280px;margin-left:auto;margin-right:auto}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;padding:32px 28px 0;color:var(--txt)}
  .top .tl{display:flex;flex-direction:column;min-width:0}
  .top .tl-txt{display:flex;flex-direction:column}
  .top .barcol{display:none}
  .top h1{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 0}
  .top .sub{font-family:var(--mono);font-size:12px;color:var(--txt-2)}
  .top .sub:empty+h1{margin-top:0}
  .top>div:last-child{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:2px}
  #ctaBox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #hubTabsHost{padding:0 28px}
  #viewAsBar{padding:0 28px}
  /* No overflow on .view — it would become the sticky containing block for
     descendants (see syncStickyOffset). The page itself scrolls. */
  .view{flex:1;padding:22px 28px 64px}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:var(--surf);border:1px solid var(--line-card);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:none;transition:box-shadow var(--med) var(--ease),transform var(--med) var(--ease)}
  .kpi:hover{border-color:rgba(255,255,255,.2)}
  .kpi .bar{position:absolute;left:18px;top:20px;width:10px;height:10px;border-radius:3px}
  .kpi .bar~.lbl{padding-left:17px}
  .kpi .num{white-space:nowrap}
  .kpi .lbl{font-family:var(--mono);font-size:11.5px;color:var(--txt-3);font-weight:400}
  .kpi .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.03em}
  .kpi .meta{font-size:12.5px;color:var(--txt-2);margin-top:2px}
  .grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}
  .panel{background:var(--surf);border:1px solid var(--line-card);border-radius:16px;overflow:hidden;box-shadow:var(--sh-card)}
  .panel-h{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .panel-h h3{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .panel-h .tag{font-family:var(--mono);font-size:11.5px;color:var(--txt-3);font-weight:400}
  .panel-b{padding:6px 8px}
  .row-item{display:flex;gap:11px;padding:12px 11px;border-radius:10px;align-items:flex-start;cursor:pointer;transition:background var(--fast) var(--ease)}
  .row-item:hover{background:var(--paper)}
  .pin{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .rt{text-align:right;flex-shrink:0}
  .who{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:var(--ink);color:#fff;padding:2px 9px;border-radius:20px;margin-top:6px}
  .empty{text-align:center;padding:36px 16px;color:var(--txt-3);font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .badge .d{width:6px;height:6px;border-radius:50%}
  .s-green{background:var(--green-bg);color:var(--green)}.s-green .d{background:var(--green)}
  .s-amber{background:var(--amber-bg);color:var(--amber)}.s-amber .d{background:var(--amber)}
  .s-red{background:var(--red-bg);color:var(--red)}.s-red .d{background:var(--red)}
  .s-violet{background:var(--violet-bg);color:var(--violet)}.s-violet .d{background:var(--violet)}
  .s-blue{background:var(--blue-bg);color:var(--blue)}.s-blue .d{background:var(--blue)}
  .s-slate{background:var(--slate-bg);color:var(--slate)}.s-slate .d{background:var(--slate)}
  .avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0}
  /* No overflow here on purpose — ANY non-visible overflow (hidden or auto,
     even on a single axis) makes this the sticky-positioning containing
     block for descendants, which silently breaks "stick to the page" for
     the sticky <th> below (it'd stick to this box's own scroll instead,
     which never happens, so it just sits frozen in the wrong spot). Corner
     rounding is done on the header/body cells instead of via clipping. */
  .tbl-wrap{background:var(--surf);border:1px solid var(--line-card);border-radius:16px;box-shadow:var(--sh-card)}
  .tbl-wrap th:first-child{border-top-left-radius:14px}
  .tbl-wrap th:last-child{border-top-right-radius:14px}
  table{width:100%;border-collapse:collapse}
  /* Header cells read like the mockups' grid headers — plain 12px/600 muted
     text, no mono caps, no filled band, and no sticky (it floated mid-table). */
  th{text-align:left;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--txt-3);padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1);background:transparent;white-space:nowrap}
  td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background var(--fast) var(--ease)}
  tbody tr:hover{background:rgba(255,255,255,.025)}
  th.r,td.r{text-align:right}
  .prog{height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;width:90px}
  .prog i{display:block;height:100%;border-radius:6px}
  .meter{height:22px;border-radius:7px;overflow:hidden;display:flex;border:1px solid var(--line);background:var(--paper)}
  .meter span{display:block;height:100%}
  .stage-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .banner{background:var(--amber-bg);border:1px solid rgba(255,176,32,.3);color:var(--amber);padding:11px 14px;border-radius:12px;font-size:12.5px;margin-bottom:18px}
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:60vh;color:var(--txt-3);font-size:13px}
  .loading::before{content:'';width:24px;height:24px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent-deep);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(1turn)}}
  /* Background data refresh in flight — quiet by design: the reload icon
     spins, nothing moves or blocks. */
  #btnSync.syncing .icn{animation:spin .9s linear infinite;color:var(--accent-deep)}
  [contenteditable][data-placeholder]:empty:before{content:attr(data-placeholder);color:var(--txt-3)}
  [contenteditable] ul{margin:4px 0 4px 18px}

  /* v2 controls — segmented switch (List/Board/…), filter chips, search box */
  .seg{display:inline-flex;padding:4px;border-radius:12px;background:#111931;border:1px solid rgba(255,255,255,.12)}
  .seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--txt-2);white-space:nowrap}
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:var(--txt);color:#05070d}

  #ptBody h3{font-size:16px;font-weight:700;margin:14px 0 6px} #ptBody p{margin:0 0 10px;color:var(--txt-soft)} #ptBody ul,#ptBody ol{margin:0 0 10px 22px;color:var(--txt-soft)} #ptBody li{margin:3px 0}

  /* ===== MODAL ===== */
  .overlay{position:fixed;inset:0;background:rgba(3,5,10,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:36px 20px;overflow-y:auto;animation:fadeIn .16s ease-out}

  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--field);font:inherit;font-size:14px;color:var(--txt);outline:none;transition:border-color var(--fast),box-shadow var(--fast),background var(--fast)}

  /* ===== ACTIVITY PLANNER (project modal) =====

     elements (not display:contents) because they are drag targets. */
  .atv-wrap{--atv-cols:34px 20px minmax(140px,1fr) 118px 112px 112px 132px 78px 46px;

  .atv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--paper-2);border-radius:var(--r-md) var(--r-md) 0 0}
  .atv-top b{font-family:var(--sans);font-size:var(--fs-sm)}
  .atv-top .sub{font-size:var(--fs-xs);color:var(--txt-3);font-weight:600}
  .atv-hd,.atv-row{display:grid;grid-template-columns:var(--atv-cols);column-gap:8px;align-items:center;padding:0 12px}
  .atv-hd{border-bottom:1px solid var(--line)}
  .atv-hd>span{font-size:var(--fs-eyebrow);font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em;padding:7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .atv-check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--card);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0;line-height:1;flex-shrink:0}
  .atv-check:hover{border-color:var(--green)}
  .atv-check.on{background:var(--green);border-color:var(--green)}
  /* Borderless-until-touched fields: 40 boxed inputs in one panel reads as
     noise; the box appears on hover and focus, where it means something. */
  .atv-in{width:100%;min-width:0;padding:6px 8px;border:1px solid transparent;border-radius:var(--r-xs);background:transparent;font:inherit;font-size:var(--fs-sm);font-weight:600;color:var(--txt);outline:none;transition:border-color var(--fast),background var(--fast),box-shadow var(--fast)}

  .atv-in.done{text-decoration:line-through;color:var(--txt-3)}
  .atv-in.d8{font-family:var(--mono);font-size:var(--fs-xs);font-weight:500;color:var(--txt-2)}
  /* An unset date shows nothing but its calendar affordance — forty rows of
     "dd/mm/yyyy" is noise, and the field still announces itself on hover. */
  .atv-in.d8.empty::-webkit-datetime-edit{color:transparent}

  .dep-add:hover{border-style:solid;border-color:var(--accent-deep);color:var(--accent-deep);background:var(--accent-soft)}
  .dep-none{font-size:var(--fs-xs);color:var(--txt-3)}
  .atv-prog{display:flex;align-items:center;gap:6px}
  .atv-prog .pct{font-family:var(--mono);font-size:var(--fs-xs);font-weight:700;color:var(--txt-2);min-width:30px;text-align:right}
  .atv-act{display:flex;align-items:center;justify-content:flex-end;gap:2px}
  .atv-ico{width:22px;height:22px;border-radius:6px;color:var(--txt-3);display:grid;place-items:center;padding:0;flex-shrink:0}
  .atv-ico:hover{background:var(--paper);color:var(--txt)}
  .atv-ico.open{color:var(--accent-deep);background:var(--accent-soft)}
  .atv-ico.del:hover{background:var(--red-bg);color:var(--red)}
  .atv-chev{transition:transform var(--med) var(--ease)}

  .atv-panel{padding:10px 12px 12px calc(34px + 20px + 16px);background:var(--paper-2);border-bottom:1px solid var(--line)}
  .atv-panel-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}

  .atv-panel select,.atv-panel input[type=number]{padding:5px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--card);font:inherit;font-size:var(--fs-sm)}

  /* ===== PROJECT MODAL — two columns =====
     The plan and the conversation about the plan are different activities:
     splitting them means posting an update no longer costs a scroll past the

  .pm-body.modal-b{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}

  .pm-side-c textarea::placeholder{color:var(--txt-3)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:opacity .28s var(--ease),transform .28s var(--ease);z-index:300;box-shadow:var(--sh-3);border:1px solid rgba(255,255,255,.09);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:#0f7a4a;border-color:rgba(255,255,255,.16);padding:11px 20px}
  .ment{background:var(--violet-bg);color:var(--violet);font-weight:700;border-radius:4px;padding:0 4px}

  /* ===== ICONS + PROGRESS ALIGNMENT ===== */
  svg.icn{display:inline-block;vertical-align:-2px;flex-shrink:0}
  .ich{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .pbar{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden;display:flex;min-width:0}
  .pbar span{display:block;height:100%}
  .pct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;width:40px;text-align:right;flex-shrink:0;color:var(--txt-2)}

  /* ===== COST CENTER TABLE ===== */
  /* Scroll-shadow affordance: a soft edge shadow only appears on a side while
     there's still content to reveal there — background-attachment:local pair
     masks it with the page bg as content scrolls under, fixed pair stays put
     at the container edges. No JS needed to know when to show/hide it. */
  .cc-wrap{overflow-x:auto;position:relative;background-color:var(--card);background-repeat:no-repeat;
    background-image:
      linear-gradient(to right,var(--card) 30%,rgba(13,18,32,0)),
      linear-gradient(to left,var(--card) 30%,rgba(13,18,32,0)),
      linear-gradient(to right,rgba(0,0,0,.35),rgba(0,0,0,0)),
      linear-gradient(to left,rgba(0,0,0,.35),rgba(0,0,0,0));
    background-position:left center,right center,left center,right center;
    background-size:34px 100%,34px 100%,14px 100%,14px 100%;
    background-attachment:local,local,scroll,scroll;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) var(--paper-2);}
  /* Always-visible horizontal scrollbar. macOS ships overlay scrollbars by
     default ("show when scrolling"), so this table — the one place in the app
     where sideways scrolling is the whole point — otherwise reads as having no
     scrollbar at all. Giving the track an explicit height opts this container
     out of overlay mode in Blink/WebKit and keeps the affordance on screen. */
  .cc-wrap::-webkit-scrollbar{height:11px}
  .cc-wrap::-webkit-scrollbar-track{background:var(--paper-2);border-radius:0 0 12px 12px}
  .cc-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:7px;border:3px solid var(--paper-2)}
  .cc-wrap::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.34)}
  .cc-tbl{border-collapse:separate;border-spacing:0;width:100%}
  /* position/top reset is load-bearing: the global `th` rule sets
     position:sticky + top:var(--sticky-top) for the page-scrolling tables, and
     it leaks in here too. Inside .cc-wrap (its own scrollport, no vertical
     scroll) that offset doesn't pin anything — it just shoves the whole header
     ~80px down over the first data rows. Only the frozen s1/s2/s3 columns want
     sticky here, and horizontally only, so top stays auto for them. */
  .cc-tbl th{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:#161f36;border-bottom:1px solid var(--line);padding:8px 10px}
  /* Frozen header + total row. .cc-wrap is its own scroll box (both axes,
     capped to the viewport), so sticky top/bottom work against it and both
     scrollbars stay on screen however long the table is. Header/footer
     cells get opaque fills so figures never show through while scrolling. */
  .cc-wrap{max-height:calc(100vh - var(--nav-h,62px) - 48px);overflow:auto}
  .cc-tbl thead th{position:sticky;top:0;z-index:4}
  .cc-tbl thead tr:nth-child(2) th{top:var(--cc-h1,33px)}
  .cc-tbl thead .mband{background:#1b2440}
  .cc-tbl thead th.cc-now{background:#223462}
  .cc-tbl thead th.cc-tot{background:#262e45}
  .cc-tbl tfoot td{position:sticky;bottom:0;z-index:3}
  .cc-tbl tfoot td.mband{background:#1d2745}
  .cc-tbl tfoot td.cc-now{background:#223462}
  /* Row highlight — a tint laid over each cell's own fill (keeps banding,
     the current-month column and the frozen cells opaque underneath). */
  .cc-tbl tbody tr{cursor:pointer}
  .cc-tbl tbody tr:hover td{background-image:linear-gradient(rgba(255,255,255,.035),rgba(255,255,255,.035))}
  .cc-tbl tbody tr.cc-sel td{background-image:linear-gradient(rgba(77,125,255,.24),rgba(77,125,255,.24))!important;color:var(--txt)}
  .cc-tbl tbody tr.cc-sel td:not(.s0){box-shadow:inset 0 1px 0 rgba(125,157,255,.7),inset 0 -1px 0 rgba(125,157,255,.7)}
  .cc-nav{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.16);color:var(--txt);display:inline-grid;place-items:center;font-size:15px;line-height:1}
  .cc-nav:hover{background:rgba(255,255,255,.06)}
  .cc-tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
  .cc-tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .cc-tbl .mband{background:rgba(255,255,255,.02)}
  .cc-tbl thead .mband{background:rgba(255,255,255,.04)}
  .cc-tbl .msep{border-left:1px solid var(--line)}
  /* Frozen identity columns. The `left` offsets are the running sum of the
     widths before them, so a width change here means changing the next
     column's offset too — and CC_STICKY_W, which ccScrollTo() uses to park a
     month clear of them. */
  .cc-tbl .s0,.cc-tbl .s1,.cc-tbl .s2,.cc-tbl .s3{position:sticky;top:auto;z-index:2;background:var(--card)}
  .cc-tbl .s0{left:0;min-width:62px;max-width:62px;overflow:hidden;text-overflow:ellipsis}
  .cc-tbl .s1{left:62px;min-width:92px;max-width:92px;overflow:hidden;text-overflow:ellipsis}
  .cc-tbl .s2{left:154px;min-width:96px;max-width:96px;overflow:hidden;text-overflow:ellipsis}
  .cc-tbl .s3{left:250px;min-width:170px;max-width:170px;overflow:hidden;text-overflow:ellipsis;box-shadow:inset -1px 0 0 var(--line-2)}
  /* No vertical sticky header here: .cc-wrap needs overflow-x:auto for the
     horizontal scroll + frozen s0/s1/s2/s3 columns, and per the CSS overflow
     spec that FORCES overflow-y to 'auto' too (a lone non-visible axis pulls
     the other one off 'visible') — making .cc-wrap itself the sticky
     containing block for its cells, not the page. A row can't stick to a
     scroll position that never happens. Solving both at once needs a
     JS-synced dual-scrollbar split (separate header/body scroll areas),
     which is out of scope here — left as horizontal-only sticky. */
  .cc-tbl thead .s0,.cc-tbl thead .s1,.cc-tbl thead .s2,.cc-tbl thead .s3{background:#161f36;z-index:6;top:0}
  .cc-tbl tfoot td{background:#1a2340;border-top:1px solid rgba(255,255,255,.12);border-bottom:none;font-weight:700}
  .cc-tbl tfoot .s0,.cc-tbl tfoot .s1,.cc-tbl tfoot .s2,.cc-tbl tfoot .s3{background:#1a2340;z-index:5}
  /* current-month highlight — background tint, not a side-stripe accent */
  .cc-tbl .cc-now{background:var(--accent-soft)}
  .cc-tbl thead .cc-now{background:rgba(77,125,255,.22)}
  .cc-tbl tfoot .cc-now{background:rgba(77,125,255,.22)}
  .cc-now-lbl{display:inline-block;font-size:8px;font-weight:800;color:#fff;background:var(--accent);border-radius:5px;padding:1.5px 5px;margin-left:6px;letter-spacing:.04em;vertical-align:1px}
  /* A consumption figure that has POs behind it. Underlined on the number
     itself rather than boxed, so a row of them doesn't turn the table into a
     grid of buttons — it reads as "this number opens up", nothing louder. */
  .cc-tbl td.cc-drill{font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--line-2);text-underline-offset:3px}
  .cc-tbl td.cc-drill:hover{color:var(--accent-deep);text-decoration-color:var(--accent-deep);background:var(--accent-soft)}
  /* Budget is the quiet column of the triplet — it stays muted and light when
     it becomes clickable, so the row still reads Cons. first. */
  .cc-tbl td.cc-drill-b{font-weight:400;color:var(--txt-3)}
  .cc-tbl td.cc-drill-b:hover{color:var(--accent-deep)}
  /* A fund line inside the Budget breakdown — opens that fund. */
  .cc-camp-row{cursor:pointer;transition:background var(--fast) var(--ease)}
  .cc-camp-row:hover{background:var(--accent-soft)}
  .cc-tbl th.sortable{cursor:pointer;user-select:none}
  .cc-tbl th.sortable:hover{color:var(--txt-2)}
  .cc-tbl th .sort-i{display:inline-flex;vertical-align:-2px;margin-left:3px;opacity:.55}
  .cc-tbl th.sort-active .sort-i{opacity:1;color:var(--accent-deep)}

  /* ===== PO PHASE TABS ===== */
  .po-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
  .po-tab{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .po-tab:hover{border-color:var(--line-2)}

  /* ===== ENTRANCE ANIMATIONS (subtle: numbers, bars, charts only — no card/screen motion) ===== */
  @keyframes numIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .kpi .num,.stat-num{animation:numIn .28s var(--ease) both}
  @keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .pbar span,.prog i,.meter span,.seg-fill{transform-origin:left;animation:barIn .5s var(--ease) both}
  @keyframes dotLightUp{from{background:var(--paper-2);color:var(--txt-3);border-color:var(--paper-2);transform:scale(.7)}}
  .step-dot{animation:dotLightUp .35s var(--ease) both}

  /* ===== RESPONSIVE ===== */
  @media (max-width:1500px){ .kpis{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:1100px){ .grid2{grid-template-columns:1fr} .view{padding:20px 18px 48px} .top{padding:13px 18px} }
  @media (max-width:900px){
    .side-in{flex-wrap:wrap;padding:8px 16px 0;gap:8px 12px}
    .nav-mid{order:3;width:100%;margin:0 -4px}
    .nav-btn{height:42px;padding:0 11px}
    .acct-txt{display:none}
    .drawer{width:100vw!important;max-width:100vw}
    .top,#hubTabsHost,#viewAsBar{padding-left:16px;padding-right:16px}
    .view{padding:18px 16px 48px}
    .top h1{font-size:30px}
  }
  @media (max-width:640px){
    .att-row{grid-template-columns:minmax(0,1fr) 92px!important}
    .att-row>.avatar,.att-row>.att-pill,.att-row>.att-prog{display:none!important}
  }
  @media (max-width:820px){ .kpis{grid-template-columns:repeat(2,1fr)} .fgrid{grid-template-columns:1fr} }
  @media (max-width:700px){
    .top{flex-wrap:wrap;row-gap:10px}
    .top .tl{width:100%}
    #ctaBox{display:flex;flex-wrap:wrap;gap:8px}
  }
  @media (max-width:480px){ .kpis{grid-template-columns:1fr} .view{padding:16px 12px 40px} }

  /* ===== REDUCED MOTION ===== */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }

  /* ===== V2 BASE COMPONENTS (F0 — esteira de mudanças, seção 04) =====
     Classes puras, ainda não usadas em nenhuma tela: nada aqui muda o visual
     atual. F1/F2 conectam essas classes nas telas de Projeto e Budget. Cores
     seguem o vocabulário confirmado (Consumed/Committed/Available/Cut) e os
     tokens já existentes em :root — nenhuma cor nova foi inventada. */

  /* card — mesmo padrão de container já usado nas telas atuais
     (var(--card)/var(--line)/16px), como classe reaproveitável */
  .v2-card{background:var(--surf);border:1px solid var(--line-card);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--sh-card)}
  .v2-card--glow{box-shadow:0 0 40px -18px rgba(77,125,255,.5),var(--sh-2)}
  .v2-card-eyebrow{font-family:var(--mono);font-size:var(--fs-xs);color:var(--txt-3);text-transform:lowercase}
  .v2-card-title{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:2px}

  /* segmented bar — Consumed · Committed · Available · Cut, nessa ordem,
     larguras vindas de style="width:N%" no elemento (dado real, não CSS) */
  .v2-segbar{display:flex;height:14px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.1)}
  .v2-segbar i{display:block;box-shadow:inset -3px 0 0 #10172a}
  .v2-seg-cons{background:var(--accent-deep)}
  .v2-seg-comp{background:var(--violet)}
  .v2-seg-avail{background:rgba(255,255,255,.16)}
  .v2-seg-cut{background:repeating-linear-gradient(135deg,#ff3b4e 0 3px,rgba(255,59,78,.22) 3px 7px);box-shadow:none}
  .v2-segbar-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:var(--fs-sm);color:var(--txt-2)}
  .v2-segbar-legend span{display:inline-flex;align-items:center;gap:6px}
  .v2-segbar-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* donut — anel SVG; JS calcula stroke-dasharray/offset por fatia,
     esta classe só posiciona o rótulo central */
  .v2-donut{position:relative;display:inline-grid;place-items:center}
  .v2-donut svg{transform:rotate(-90deg)}
  .v2-donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .v2-donut-center b{display:block;font-family:var(--mono);font-size:var(--fs-lg);font-weight:700}
  .v2-donut-center small{display:block;font-size:var(--fs-xs);color:var(--txt-2)}

  /* gauge — arco de meio-círculo (saúde do mês), mesma lógica de path SVG
     usada nos protótipos; classe só cuida do rótulo grande sob o arco */
  .v2-gauge{position:relative}
  .v2-gauge-value{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.03em}
  .v2-gauge-value--ok{color:var(--green)} .v2-gauge-value--warn{color:var(--amber)} .v2-gauge-value--over{color:var(--red)}

  /* gantt — uma linha por atividade/campanha, trilha com barra posicionada
     via style="left:X%;width:Y%" (dado real) */
  .v2-gantt{position:relative}
  .v2-gantt-row{display:grid;grid-template-columns:200px minmax(0,1fr);align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--line)}
  .v2-gantt-row:last-child{border-bottom:none}
  .v2-gantt-label{font-size:var(--fs-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v2-gantt-track{position:relative;height:16px}
  .v2-gantt-bar{position:absolute;top:0;bottom:0;border-radius:5px;border:1.5px solid transparent}
  .v2-gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent-deep);box-shadow:0 0 12px var(--accent-deep);pointer-events:none}
</style>

<script>
/* ============================================================
   READ-ONLY TEST MODE (?readonly=1) — real data, nothing written.
   Installed before the Supabase client is created (it captures fetch), so
   every request the app makes goes through here. Reads pass; any write to
   the database, storage or edge functions is answered locally with an
   error and never leaves the browser. Allowed: sign-in/session (auth), the
   account-access function, GET reads, signed download URLs, and RPCs that
   were checked to be read-only (STABLE / no writes).
   ============================================================ */
const READONLY=/[?&]readonly=1\b/.test(location.search);
let READONLY_BLOCKED=0;
if(READONLY){
  const RO_READ_RPC=['papel_atual','agencia_atual','agencia_nivel_atual','listar_pessoas','classificar','saldos_para_decisao','get_timeline_share_project'];
  const realFetch=window.fetch.bind(window);
  window.fetch=function(input,init){
    const url=typeof input==='string'?input:(input&&input.url)||'';
    const method=String((init&&init.method)||(input&&input.method)||'GET').toUpperCase();
    if(/supabase\.co/.test(url)&&!['GET','HEAD','OPTIONS'].includes(method)){
      const path=url.replace(/^https?:\/\/[^/]+/,'').split('?')[0];
      const ok=path.startsWith('/auth/v1/')||path==='/functions/v1/acesso'||path.startsWith('/storage/v1/object/sign/')
        ||(path.startsWith('/rest/v1/rpc/')&&RO_READ_RPC.includes(path.slice('/rest/v1/rpc/'.length)));
      if(!ok){
        READONLY_BLOCKED++; console.warn('[read-only] blocked',method,path);
        setTimeout(()=>{ try{ renderReadonlyBadge(); }catch(e){} },0);
        return Promise.resolve(new Response(JSON.stringify({message:'Read-only test mode — nothing was saved.',code:'READONLY',details:'',hint:''}),{status:403,headers:{'Content-Type':'application/json'}}));
      }
    }
    return realFetch(input,init);
  };
}
function renderReadonlyBadge(){
  if(!READONLY) return;
  let el=document.getElementById('roBadge');
  if(!el){ el=document.createElement('div'); el.id='roBadge'; document.body.appendChild(el); }
  el.style.cssText='position:fixed;bottom:16px;left:16px;z-index:400;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.45);color:#ffb020;border-radius:12px;padding:9px 14px;font:600 12px "Hanken Grotesk",sans-serif;backdrop-filter:blur(8px);display:flex;align-items:center;gap:9px;box-shadow:0 10px 30px -10px rgba(0,0,0,.8)';
  el.innerHTML=`<span style="width:7px;height:7px;border-radius:50%;background:#ffb020"></span><b>READ-ONLY TEST</b><span style="color:#e8c98a;font-weight:500">real data · nothing is saved${READONLY_BLOCKED?` · ${READONLY_BLOCKED} write${READONLY_BLOCKED===1?'':'s'} blocked`:''}</span>`;
}
if(READONLY) document.addEventListener('DOMContentLoaded',renderReadonlyBadge);
</script>
<script>
/* Estilo Realidade Virtual — Chart.js não lê variáveis CSS (desenha em
   canvas), então os textos/linhas padrão dos gráficos precisam de cor
   explícita aqui; sem isso ficam pretos (ilegíveis) sobre os cards escuros. */

/* Saving is the most repeated action in the app and the least interesting
   news in it, so it is reported where the user is already looking: the Save
   button they just pressed turns green and says Saved. Nothing else moves —
   no toast crossing the screen, no modal closing under them, no repaint
   sending the page back to the top. A save confirms; it does not navigate.

   The button is found by remembering the last one clicked rather than by
   threading `this` through a dozen handlers: these are async, so `event` is
   long gone by the time the write returns. If that button is no longer on
   screen the save simply passes in silence, which is the correct outcome —
   there is nothing left to confirm on. */
let LAST_ACTION_BTN=null;
document.addEventListener('click',e=>{
  const b=e.target&&e.target.closest?e.target.closest('button'):null;
  if(b) LAST_ACTION_BTN=b;
},true);
function markSaved(btn){
  const b=btn||LAST_ACTION_BTN;
  if(!b||!document.body.contains(b)) return;
  if(b.dataset.saving==='1') return;
  b.dataset.saving='1';
  const html=b.innerHTML, bg=b.style.background, bd=b.style.borderColor, col=b.style.color, w=b.getBoundingClientRect().width;
  // Pinned width, so the label swap doesn't make the footer twitch.
  b.style.minWidth=Math.ceil(w)+'px';
  b.style.background='#0f7a4a'; b.style.borderColor='#0f7a4a'; b.style.color='#fff';
  b.innerHTML=`<span style="display:inline-flex;align-items:center;gap:7px">${icn('check',14,2.8)}Saved</span>`;
  setTimeout(()=>{
    if(!document.body.contains(b))return;
    b.innerHTML=html; b.style.background=bg; b.style.borderColor=bd; b.style.color=col; b.style.minWidth='';
    delete b.dataset.saving;
  },1800);
}
/* Kept as the name the save paths call, so "what a save looks like" stays one

/* Turn a raw Supabase/Postgres error into a sentence a user can act on,
   instead of dumping the constraint name in a toast. */
function humanErr(e){
  const raw=(e&&(e.message||e.error_description||e.details))||String(e||'');
  const s=raw.toLowerCase();
  if(s.includes('duplicate key')||s.includes('unique constraint')) return 'This month already has a value — edit the existing entry instead of adding a new one.';
  if(s.includes('violates check constraint')&&s.includes('teto')) return 'A monthly cap can\'t be negative. Adjust the amount and try again.';
  if(s.includes('foreign key')) return 'A linked record is missing or was removed. Refresh the page and try again.';
  if(s.includes('row-level security')||s.includes('permission denied')||s.includes('not authorized')) return 'You don\'t have permission to do this.';
  if(s.includes('network')||s.includes('failed to fetch')||s.includes('timeout')) return 'Connection problem. Check your internet and try again.';
  return raw.length>140?'Something went wrong. Please try again or contact support.':raw;
}
function toastErr(e){ toast(humanErr(e)); }

/* Tagging people (via the "+ tag someone" field or an @mention in a comment)

function canTagPeople(p){return true;}
/* Who can BE tagged: everyone on the roster except PO-only agency logins.
   That sub-level (agencia_nivel='po') has no Work module at all — its whole
   nav is "POs & Approvals" — so tagging one would email them about a project
   screen they cannot open. listar_pessoas() already returns agencia_nivel,
   so this needs no backend change. Existing tags are left alone: the rule
   gates adding, never displaying or removing. */
function isPoOnlyPessoa(pe){ return !!(pe&&pe.papel==='agencia'&&pe.agencia_nivel==='po'); }
function taggablePessoas(){ return (DATA.pessoas||[]).filter(pe=>pe.email&&!isPoOnlyPessoa(pe)); }
function pessoaByEmail(email){ return (DATA.pessoas||[]).find(x=>x.email===email); }
function isTagged(p){
  const me=((currentUser&&currentUser.email)||'').toLowerCase();
  return !!(me&&p&&(p.envolvidos||[]).some(x=>(x.email||'').toLowerCase()===me));
}
/* The activity list is a shared working surface, not an owner-only field:
   besides the owner/admin (canEdit), anyone on the marketing profile who is
   tagged on the project can add, rename, reorder and delete its activities.
   The main project fields (name, type, due date, categories, brand) and
   "Delete project" stay gated behind canEdit(). */
function canEditAtividades(p){ return canEdit(p)||(effPapel()==='marketing'&&isTagged(p))||(effPapel()==='agencia'&&projHasAgencia(p,effAgencia()))||(effPapel()==='tcl_member'&&isTagged(p)); }
/* The agency roster the Work module offers when assigning a project to one or
   more agencies. Drawn from the same two sources the Budget module already
   trusts — the people roster (perfis) and the funds' own agencia column —
   union whatever is already stored on projects, so an agency that was tagged
   before it had a login (or after it lost one) never silently disappears from
   the chips of the projects that reference it. */
function workAgencias(){
  const set=new Set();
  (DATA.pessoas||[]).forEach(pe=>{ if(pe.papel==='agencia'&&pe.agencia) set.add(pe.agencia); });
  (DATA.poProjetos||[]).forEach(f=>{ if(f.agencia) set.add(f.agencia); });
  (DATA.projetos||[]).forEach(p=>{ (projAgencias(p)||[]).forEach(a=>set.add(a)); });
  return [...set].filter(Boolean).sort();
}
/* One reader for "which agencies is this project shared with". `agencies` is
   the current field (multi-select chips on the project modal); `partner` and
   `agencia` are single-value fields written by older versions, kept readable
   so pre-existing projects stay visible to the agency they were assigned to. */
function projAgencias(p){
  if(!p) return [];
  const out=(p.agencies||[]).slice();
  [p.partner,p.agencia].forEach(a=>{ if(a&&!out.includes(a)) out.push(a); });
  return out;
}
function projHasAgencia(p,ag){ return !!(ag&&projAgencias(p).includes(ag)); }
/* An agency login sees a project when it is assigned to that agency, or when
   the person themself is tagged on it — "conforme a agência e o usuário".
   Everyone else sees everything; RLS on act_projects is deliberately open to
   any authenticated user, so this is a scoping rule, not a security boundary. */
function visProjs(){
  const ag=effAgencia();
  if(effPapel()==='agencia'&&ag){
    const meEmail=((currentUser&&currentUser.email)||'').toLowerCase();
    return DATA.projetos.filter(p=>projHasAgencia(p,ag)||(p.envolvidos||[]).some(x=>(x.email||'').toLowerCase()===meEmail));
  }
  /* TCL Member: no agency, no blanket access either — only the projects
     marketing (or admin) tagged them on via envolvidos. Unlike the agencia
     branch above there's no "assigned to my agency" fallback, since this
     role isn't attached to one. */
  if(effPapel()==='tcl_member'){
    const meEmail=((currentUser&&currentUser.email)||'').toLowerCase();
    return DATA.projetos.filter(p=>(p.envolvidos||[]).some(x=>(x.email||'').toLowerCase()===meEmail));
  }
  return DATA.projetos;
}

function computeRecommendations(){
  const out=[];
  // 1) Projects stalled in the same stage/status for too long
  DATA.projetos.forEach(p=>{
    if(p.status==='concluido')return;
    const lu=latestLog(p);
    const base=lu?lu.t:p.inicio;
    if(!base)return;
    const days=Math.round((today0()-new Date(String(base).slice(0,10)+'T00:00:00'))/864e5);
    if(days>=10){
      out.push({sev:'high',icon:'pause',text:`"${p.nome}" has had no updates in ${days} days (stage: ${stageOf(p.etapa).name}).`,onclick:`openProj('${p.id}')`});
    }
  });
  // 2) Budget >90% consumed with no closed PO yet
  if(PO_ACCESS){
    const funds=(DATA.poProjetos||[]).filter(p=>p.aprovacao_status==='APROVADO');
    const tetoBy={},consBy={},hasConcl={};
    DATA.tetos.forEach(t=>tetoBy[t.fund_id]=(tetoBy[t.fund_id]||0)+(+t.teto||0));
    DATA.rateio.forEach(r=>tetoBy[r.fund_id]=(tetoBy[r.fund_id]||0)+(+r.valor||0));
    DATA.pos.forEach(po=>{ const v=+po.valor||0; if(['FATURADA','VALIDADA','CONCLUIDA','APROVADA','PO_GERADA','ATUALIZAR_INFO'].includes(po.status)) consBy[po.fund_id]=(consBy[po.fund_id]||0)+v; if(po.status==='CONCLUIDA') hasConcl[po.fund_id]=true; });
    funds.forEach(p=>{
      const tot=tetoBy[p.id]||0; if(!tot)return;
      const pct=(consBy[p.id]||0)/tot*100;
      if(pct>=90&&!hasConcl[p.id]){
        out.push({sev:'high',icon:'coins',text:`Fund "${p.nome}" has ${Math.round(pct)}% of its budget committed but no PO has been closed (CONCLUÍDA) yet.`,onclick:`openFundDetail('${p.id}')`});
      }
    });
    // Cap possibly double-counted: rows in BOTH tetos and rateio_alocacao
    const _hasTeto=new Set(DATA.tetos.map(t=>t.fund_id)), _hasRat=new Set(DATA.rateio.map(r=>r.fund_id));
    funds.forEach(p=>{ if(_hasTeto.has(p.id)&&_hasRat.has(p.id)) out.push({sev:'high',icon:'scale',text:`Fund "${p.nome}" has cap rows in BOTH tetos and rateio_alocacao — its cap may be double-counted. Check with diag_fees_rateio.sql.`,onclick:`openFundDetail('${p.id}')`}); });
    // 4) Agency PO volume vs. configured rateio split
    const feeByTipo={}; (DATA.fee||[]).forEach(f=>{ if(!f.tipo)return; (feeByTipo[f.tipo]=feeByTipo[f.tipo]||[]).push(f); });
    Object.keys(feeByTipo).forEach(tipo=>{
      const rows=feeByTipo[tipo]; const totalPct=rows.reduce((s,f)=>s+(+f.percentual||0),0); if(!totalPct)return;
      const fundsTipo=funds.filter(p=>p.rateio_tipo===tipo);
      if(!fundsTipo.length)return;
      const ids=new Set(fundsTipo.map(p=>p.id));
      const byCat={}; DATA.rateio.forEach(r=>{ if(ids.has(r.fund_id)&&r.categoria) byCat[r.categoria]=(byCat[r.categoria]||0)+(+r.valor||0); });
      const totalAlloc=Object.values(byCat).reduce((s,v)=>s+v,0); if(!totalAlloc)return;
      rows.forEach(f=>{
        const expected=(+f.percentual||0)/totalPct*100;
        const actual=((byCat[f.categoria]||0)/totalAlloc)*100;
        if(Math.abs(actual-expected)>=15){
          out.push({sev:'medium',icon:'scale',text:`Rateio "${tipo}" — category "${f.categoria||'—'}" is running at ${Math.round(actual)}% of allocation vs. ${Math.round(expected)}% configured.`,onclick:`go('budgets')`});
        }
      });
    });
  }

  DATA.projetos.forEach(p=>{
    if(p.status==='concluido')return;
    (p.tasks||[]).forEach(t=>{
      if(t.done||!t.fim)return;
      const dd=daysTo(t.fim);
      if(dd!==null&&dd<0){
        out.push({sev:'medium',icon:'clock',text:`Task "${t.n||'Untitled'}" in "${p.nome}" is ${-dd} day(s) overdue.`,onclick:`openProj('${p.id}')`});
      }

  });

}

   ============================================================ */
function gateTo(mode){
  $('#gateLogin').classList.toggle('hide',mode!=='login');
  $('#gateCode').classList.toggle('hide',mode==='login');
  if(mode!=='login'){$('#caStep2').classList.add('hide');const cs=$('#caSendBtn');cs.classList.remove('hide');cs.textContent='Send code';}
  $('#gateMsg').textContent=mode==='login'?'Sign in with your corporate email.':(mode==='primeiro'?'First access: get a code by email to create your password.':'Get a code by email to reset your password.');
}
function showGate(msg){$('#gate').classList.add('show');$('#app').style.display='none';if(msg)$('#gateMsg').textContent=msg;}
function hideGate(){$('#gate').classList.remove('show');$('#app').style.display='flex';}
async function fnCall(action,payload){
  try{
    const r=await fetch(PO_URL+'/functions/v1/acesso',{method:'POST',headers:{'Content-Type':'application/json','apikey':PO_KEY,'Authorization':'Bearer '+PO_KEY},body:JSON.stringify({action,...payload})});
    return await r.json();
  }catch(e){return {ok:false,error:'Connection failed.'};}
}
async function doLogin(){
  const email=($('#liEmail').value||'').trim().toLowerCase(),senha=$('#liSenha').value||'';
  if(!email||!senha){showGate('Enter email and password.');return;}
  showGate('Signing in…');
  const {error}=await SBPO.auth.signInWithPassword({email,password:senha});
  if(error){showGate('Invalid email or password.');}
}
async function sendCode(){
  const email=($('#caEmail').value||'').trim().toLowerCase();
  if(!email){showGate('Enter your email.');return;}
  const b=$('#caSendBtn');b.disabled=true;b.textContent='Sending…';
  const j=await fnCall('codigo',{email});
  b.disabled=false;b.textContent='Resend code';
  if(j&&j.ok){$('#caStep2').classList.remove('hide');showGate('Code sent to '+email+'. Check your email (and spam).');}
  else showGate((j&&j.error)||'Could not send the code.');
}
async function setPassword(){
  const email=($('#caEmail').value||'').trim().toLowerCase(),codigo=($('#caCode').value||'').trim(),senha=$('#caSenha').value||'';
  if(!codigo||senha.length<6){showGate('Enter the code and a password of at least 6 characters.');return;}
  const j=await fnCall('definir',{email,codigo,senha});
  if(j&&j.ok){showGate('Password set! Signing in…');const {error}=await SBPO.auth.signInWithPassword({email,password:senha});if(error){showGate('Password created, but sign-in failed — try signing in manually.');}}
  else showGate((j&&j.error)||'Invalid or expired code.');
}
async function signOut(){try{await SBPO.auth.signOut();}catch(e){}booted=false;location.reload();}

  const builder={select(){return builder;},eq(){return builder;},neq(){return builder;},in(){return builder;},not(){return builder;},order(){return builder;},limit(){return builder;},
    update(){return builder;},upsert(){return builder;},insert(){return builder;},delete(){return builder;},
    maybeSingle:()=>Promise.resolve({data:null,error:null}),single:()=>Promise.resolve({data:null,error:err}),
    then(resolve){ resolve({data:null,error:err}); }};
  return {
    auth:{ getSession:async()=>({data:{session:null}}), signOut:async()=>({error:null}), signInWithPassword:async()=>({data:null,error:err}), onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}) },

/* Public shared-timeline view — one link per project, minted once by
   exportProjTimeline(), e.g. central.po-control.com.br/?share=<uuid>. Needs
   no auth: get_timeline_share_project is a SECURITY DEFINER RPC callable by
   the anon role, resolving the share id to its project and returning that
   project's CURRENT data (act_projects itself is authenticated-only, and
   act_timeline_shares has no SELECT policy at all, so neither is readable
   any other way). Because it's fetched live and rebuilt with
   buildTimelineExportHTML() on every visit, the same link keeps reflecting
   new stages/activities as they're completed — nothing to regenerate.
   Replaces the whole document with the built HTML, same document.
   open/write/close technique used elsewhere to preview exports. */
async function renderSharedTimeline(shareId){
  const fail=msg=>{
    document.open();
    document.write('<!doctype html><html><head><meta charset="utf-8"><title>Timeline link</title><style>:root{color-scheme:light}body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#fff;color:#14161c;font-size:14px}</style></head><body>'+msg+'</body></html>');
    document.close();
  };
  try{
    const {data,error}=await SBPO.rpc('get_timeline_share_project',{share_id:shareId});
    if(error) throw error;
    if(!data){ fail('This link is invalid or the timeline is no longer available.'); return; }
    document.open(); document.write(buildTimelineExportHTML(data)); document.close();
  }catch(e){ fail('Could not load this timeline.'); }
}
async function boot(){
  try{
    const shareId=new URLSearchParams(location.search).get('share');
    if(shareId){ await renderSharedTimeline(shareId); return; }
  }catch(e){}
  try{
    if(new URLSearchParams(location.search).get('demo')==='1'){ startDemo(); return; }
  }catch(e){}
  let gateMsg;
  try{
    const {data}=await SBPO.auth.getSession();
    if(data&&data.session&&data.session.user){
      /* getSession() hands back whatever localStorage holds — an expired
         refresh token included. Booting on that leaves the app looking
         signed in while every query comes back 400 InvalidJWT and nothing
         on screen says why. getUser() validates against the server, so a
         dead session lands on the sign-in gate instead of a zombie app. */
      const {error:dead}=await SBPO.auth.getUser();
      if(!dead){ onSignedIn(data.session.user); return; }
      try{ await SBPO.auth.signOut({scope:'local'}); }catch(e){}
      gateMsg='Session expired. Sign in again.';
    }
  }catch(e){}
  showGate(gateMsg);
  SBPO.auth.onAuthStateChange((ev,sess)=>{
    if(sess&&sess.user){if(!booted)setTimeout(()=>onSignedIn(sess.user),0);}
    else if(ev==='SIGNED_OUT'){booted=false;showGate('Session ended. Sign in again.');}
  });
}
async function onSignedIn(user){
  if(booted)return;booted=true;currentUser=user;
  isManager=MANAGER_EMAILS.map(e=>e.toLowerCase()).includes((user.email||'').toLowerCase());
  hideGate();
  $('#acctEmail').textContent=user.email||'';
  $('#acctAv').textContent=(user.email||'?')[0].toUpperCase();
  $('#acctAv').style.background=avColor(user.email);
  try{ await loadPapel(); }catch(e){ console.warn('papel_atual:',e); window.__poErr=(e&&e.message)||String(e); }
  // LAST_SYNC so the first go() below doesn't immediately refetch what we
  // just fetched.
  try{ await loadAll(); LAST_SYNC=Date.now(); }catch(e){ console.error('load:',e); }
  try{ await loadPTasksRemote(); }catch(e){}
  // diagnostic line in sidebar footer
  try{ const d=$('#poDiag'); if(d){ d.textContent = PO_ACCESS ? ('Budget: '+PAPEL) : ('Budget off — '+(window.__poErr||'no PO role')); d.style.color = PO_ACCESS ? '#7d8493' : '#ef7f88'; } }catch(e){}
  buildNav(); const nav=currentNav();
  /* Deep link from e-mail (e.g. the day-26 "Decide redistribution" CTA → #saldos). */
  const hashScr=(location.hash||'').replace(/^#/,''); const navAll=nav.work.concat(nav.budget);
  go(hashScr&&navAll.includes(hashScr)?hashScr:(navAll[0]||'dash'));
}

/* Resolves the signed-in user's role directly against the single Supabase
   project (Budget-Control) — replaces the old two-project ssoPO() dance
   (a separate sign-in re-using the just-typed password, plus a password-sync
   fallback edge function) that existed only because Work and Budget used to
   live in different Supabase projects. Now there is one session, so there is
   nothing left to synchronize. */
async function loadPapel(){
  window.__poErr='';
  try{
    const {data:p,error}=await SBPO.rpc('papel_atual');
    if(error){ window.__poErr='papel_atual: '+error.message; }
    PAPEL=p||'';
    PO_ACCESS=!!PAPEL && PAPEL!=='pendente';
    if(!PAPEL && !window.__poErr) window.__poErr='no role for this user';
  }catch(e){ PO_ACCESS=false; window.__poErr=(e&&e.message)||'papel_atual failed'; }
  if(PAPEL==='agencia'){
    try{ const {data:a}=await SBPO.rpc('agencia_atual'); MINHA_AGENCIA=a||''; }catch(e){}
    try{ const {data:n}=await SBPO.rpc('agencia_nivel_atual'); AGENCIA_NIVEL=n||'completo'; }catch(e){}
  }
}

/* ============================================================
   DATA LOADING (leitura real do banco único, Budget-Control)
   ============================================================ */
/* Every stored project passes through this on the way in: records written by
   older versions carry Portuguese/legacy key names (atividades, subitens,
   texto…) and some predate the status/pct fields entirely. etapa/status are
   derived, never trusted from the row — which also means a refresh
   recomputes "Late" against today's date, not against whenever this tab
   happened to be opened. */
function normProjeto(p){
  /* `inicio` (start date) and `dep` (finish-to-start predecessors) are newer
     than most stored rows — default them here so every render site can read
     t.inicio / t.dep without guarding, and so a project written by an older
     version doesn't need a migration to open. */
  const normSub=s=>({...s, n:s.n||s.nome||'', done:!!s.done, inicio:s.inicio||'', fim:s.fim||s.due||'', dep:Array.isArray(s.dep)?s.dep:(s.dep?[s.dep]:[]), resp:s.resp||'', obs:s.obs||''});
  p.tasks=(p.tasks||p.atividades||p.activities||p.checklist||[]).map(t=>({...t, n:t.n||t.nome||t.titulo||t.title||'', done:!!t.done, inicio:t.inicio||'', fim:t.fim||t.due||'', dep:Array.isArray(t.dep)?t.dep:(t.dep?[t.dep]:[]), status:t.status||(t.done?'concluido':'no_prazo'), pct:t.done?100:(t.pct!=null?t.pct:0), obs:t.obs||t.nota||'', subs:(t.subs||t.subitens||[]).map(normSub)}));
  p.agencies=Array.isArray(p.agencies)?p.agencies:[];
  p.logs=(p.logs||p.updates||[]).map(l=>({...l, txt:l.txt||l.texto||l.mensagem||l.msg||'', autor:l.autor||l.author||l.by||'', t:l.t||l.data||l.date||''}));
  p.etapa=effectiveEtapa(p); p.status=autoStatus(p);
  return p;
}
const Q_WORK=()=>[
  SBPO.from('act_projects').select('id,data,campanha_id,updated_at'),
  SBPO.from('act_config').select('data').eq('id','app').maybeSingle()
];
const Q_BUDGET=()=>[
  SBPO.from('orcamentos').select('id,nome,valor_total,product_category,periodo_inicio,periodo_fim'),
  SBPO.from('funds').select('id,nome,agencia,orcamento_id,product_category,activity,fund_tag,rateio,rateio_tipo,aprovacao_status,aprovacao_motivo,cc,account,account_desc,restricao,restricao_valor,restricao_motivo,restricao_em,cap_aprovado,cap_pedido,cap_pedido_motivo,cap_pedido_em,campanha_id,ativo'),
  SBPO.from('pos').select('id,fund_id,competencia,agencia,valor,descricao,numero_po,status,solicitado_em,nf_numero,vencimento,po_arquivo,fatura_url,evidencia_url,motivo_rejeicao,po_grupo_id'),
  SBPO.from('tetos').select('fund_id,competencia,teto,corte,corte_motivo,corte_em,devolucao,devolucao_motivo,devolucao_em,bloqueado,bloqueado_motivo'),
  SBPO.from('rateio_alocacao').select('fund_id,competencia,valor,categoria'),
  SBPO.from('notificacoes').select('id,mensagem,tipo,po_id,fund_id,lida,criada_em').order('criada_em',{ascending:false}).limit(200),
  SBPO.rpc('listar_pessoas'),
  SBPO.from('fee_rateio').select('agencia,tipo,categoria,percentual,cc,account,descricao'),
  SBPO.from('campanhas').select('*'),
  /* Extrato row order. Readable by marketing/finance/admin only, which is a
     superset of who can see the cost-center table; for anyone else the query
     comes back empty and ccLayoutIndex() falls back to CC_LAYOUT. */
  SBPO.from('extrato_layout').select('ord,categoria,cc,account,account_desc').order('ord')
];
/* A table that failed keeps whatever it had instead of blanking: a refresh
   that half-fails should degrade to "one panel is stale", never to
   "everything is empty". */
function tookOr(r,prev){ return (!r||r.error)?prev:(r.data||[]); }
async function loadAll(){
  const wantPO=!!PO_ACCESS;
  // ONE parallel batch for the whole app. Work and Budget used to be two
  // sequential waves (await the act_* tables, then await the eight PO ones),
  // so every full load cost two round-trips back to back. Each query also
  // catches on its own, so a single broken table can't reject the batch and
  // strand the other nine.
  const qs=Q_WORK().concat(wantPO?Q_BUDGET():[]);
  const r=await Promise.all(qs.map(q=>Promise.resolve(q).then(x=>x,e=>({data:null,error:e}))));
  const [pr,cf]=r;
  if(pr&&pr.error) console.error('projetos painel:',pr.error);
  else DATA.projetos=(pr.data||[]).map(x=>x.data&&{...x.data,campanha_id:x.campanha_id||null,_ver:x.updated_at||null}).filter(Boolean).map(normProjeto);
  if(cf&&!cf.error){
    const s=(cf.data&&cf.data.data)?cf.data.data:{};
    TEAM=(s.team||[]).map(p=>typeof p==='string'?{nome:p,empresa:''}:p);
    STAGE_DESCS=Object.assign({},STAGE_DESCS_DEFAULT,s.stageDescs||{});
  }
  if(!wantPO)return;
  const [orc,prj,pos,tet,rat,nt,pes,fee,camp,lay]=r.slice(2);
  DATA.orcamentos=tookOr(orc,DATA.orcamentos);
  DATA.poProjetos=(prj&&prj.error)?DATA.poProjetos:((prj.data||[]).filter(p=>p.aprovacao_status!=='REJEITADO'));
  /* Rejected funds stay out of every total (poProjetos), but are kept apart so
     their owner can fix and resubmit them instead of creating a duplicate. */
  DATA.fundsRejeitados=(prj&&prj.error)?DATA.fundsRejeitados:((prj.data||[]).filter(p=>p.aprovacao_status==='REJEITADO'));
  DATA.pos=tookOr(pos,DATA.pos);
  DATA.tetos=normTetos(tookOr(tet,DATA.tetos));
  DATA.rateio=tookOr(rat,DATA.rateio);
  DATA.notif=tookOr(nt,DATA.notif);
  DATA.pessoas=tookOr(pes,DATA.pessoas);
  DATA.fee=tookOr(fee,DATA.fee);
  DATA.ccLayout=tookOr(lay,DATA.ccLayout);
  DATA.campanhas=tookOr(camp,DATA.campanhas);
}

/* ============================================================
   LIVE REFRESH
   ============================================================
   DATA used to be fetched exactly once, at sign-in, and from then on only
   patched by whatever this tab itself wrote. A tab left open for a few hours
   was therefore showing a frozen snapshot: activities other people had
   already ticked off still counted as pending, so their projects kept
   rendering as "Late" until someone hit Reload — items that "looked late but
   weren't". Now every navigation, every screen re-render and every return to
   the tab refetches the whole app in the single parallel batch above. */
let SYNCING=false, LAST_SYNC=0, SYNC_SUPPRESS=false, SYNC_DEFERRED=false;
const SYNC_GAP=12000; // ms — implicit refreshes coalesce; nav clicks and tab-focus force through
function modalOpen(){ const m=document.getElementById('modalMount'); return !!(m&&m.firstElementChild); }
function syncBadge(on){
  const b=document.getElementById('btnSync'); if(!b)return;
  b.classList.toggle('syncing',!!on);
  b.title=on?'Updating…':'Reload page';
}
function syncRerender(){
  // SYNC_SUPPRESS stops the re-render's own go() from asking for yet another
  // refresh, which would loop forever.
  SYNC_SUPPRESS=true;
  try{ buildNav(); go(SCREEN); } finally{ SYNC_SUPPRESS=false; }
}
async function refreshAll(opts){
  const force=!!(opts&&opts.force);
  if(DEMO_MODE||!booted||SYNCING)return;
  if(!force&&Date.now()-LAST_SYNC<SYNC_GAP)return;
  SYNCING=true; syncBadge(true);
  try{ await loadAll(); LAST_SYNC=Date.now(); }
  catch(e){ console.warn('refresh:',e); }
  finally{ SYNCING=false; syncBadge(false); }
  // Data is in either way; only the repaint waits. Re-rendering underneath an
  // open modal would rebuild the screen behind it — and on 'reqpo' would even
  // re-fire openReqPO() over a half-filled form — so defer to closeModal().
  if(modalOpen()){ SYNC_DEFERRED=true; return; }
  syncRerender();
}
/* Sidebar navigation forces past the throttle: clicking into a screen is
   exactly when you expect to be looking at current data. The screen paints
   from cache first so navigation stays instant, then repaints when the batch
   lands. */
function navGo(id){ go(id); refreshAll({force:true}); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshAll({force:true}); });

const W_LABELS={dash:'Dashboard',board:'Board',list:'List',timeline:'Timeline',team:'Team',weekly:'Weekly Status',mytasks:'Tasks',agencywork:'Assigned Work',notif:'Notifications'};
const B_LABELS={saldos:'Balance decisions',bo:'Overview',budgets:'Categories',costcenter:'Cost center',funds:'Funds',campanhas:'Timeline',pos:'POs & Approvals',approvals:'Approvals',podesk:'PO Desk',people:'People & Roles',reqpo:'Request PO',mypos:'My POs',balance:'Balance'};
const ROLE_NAV={
  admin:      {work:['dash','list','timeline','team','weekly','mytasks'], budget:['bo','costcenter','budgets','campanhas','funds','pos','saldos','people']},
  /* No 'costcenter' for Marketing: rateios and the cost-center/account table
     are the accounting layer (Admin/Finance), same line as production. */
  marketing:  {work:['dash','list','timeline','weekly','mytasks'],        budget:['bo','budgets','campanhas','funds','pos','saldos']},
  financeiro: {work:[],                                                          budget:['bo','funds','pos']},
  agencia:    {work:['dash','list','timeline','mytasks'],               budget:['bo','campanhas','funds','pos']},
  /* TCL Member: internal staff with Work-only access, no Budget nav at all —
     Budget's own RLS policies are role allow-lists that never mention this
     role, so it has zero Budget access even if someone typed the screen id
     directly. Which projects it sees is scoped further in visProjs(): only
     ones marketing/admin tagged them on (envolvidos), not "everything" like
     admin/marketing get. */
  tcl_member: {work:['dash','list','timeline','mytasks'],                budget:[]}
};
const PANEL_ONLY_WORK=['dash','list','timeline','weekly','mytasks'];
const GLOBAL_NAV=['notif'];
function currentNav(){
  // Work-module screens follow PAPEL; Budget screens additionally require
  // PO_ACCESS (PAPEL resolved and not 'pendente') — both come from the same
  // single Supabase session/papel_atual() call now, see loadPapel().
  // Restricted agency sub-level (agencia_nivel='po') is a narrower carve-out
  // of the 'agencia' role, not a separate PAPEL — only "POs & Approvals",
  // no Work screens, no Overview/Budgets/Funds (those carry budget caps
  // this sub-level shouldn't see; enforced again at the RLS level, this is
  // just the nav — see repoint_role_functions_to_perfis-era RLS policies).
  if(PAPEL==='agencia'&&AGENCIA_NIVEL==='po') return {global:GLOBAL_NAV, work:[], budget:(PO_ACCESS?['pos']:[])};
  const role=ROLE_NAV[PAPEL];
  /* No role (or 'pendente'): nothing to navigate. The Work tables now require
     a valid role at the RLS level too, so showing the Work nav here would only
     render empty screens — go() shows the "no access yet" screen instead. */
  if(!role) return {global:[], work:[], budget:[]};
  return {global:GLOBAL_NAV, work:role.work, budget:(PO_ACCESS?role.budget:[])};
}
function navBadge(id){
  if(id==='notif') return notifUnreadCount();
  if(id==='pos'||id==='approvals') return approvalsPendingCount();

/* Top nav — one flat row of hubs (Home/Projects/Budget/POs/Team/Notes), same
   shape as Nav.dc.html, instead of every screen this app has as its own item.
   A hub with several screens (Projects, Budget) shows its members as an
   underlined sub-tab row under the page title, same pattern Budget.dc.html
   uses for Overview/Categories/Cost center/Timeline — just with the fuller
   screen set this app actually has instead of the prototype's 4. */
const NAV_HUBS=[
  {id:'dash',label:'Home',screens:['dash']},
  /* Weekly status is a sub-tab of Projects (hubTabsHTML); ROLE_NAV gives
     the 'weekly' screen to Admin and Marketing only, so the tab row only
     appears for them and nobody else can open the screen. */
  {id:'list',label:'Projects',screens:['list','timeline','weekly']},
  {id:'bo',label:'Budget',screens:['bo','budgets','costcenter','campanhas','funds','saldos']},
  {id:'pos',label:'POs',screens:['pos','mypos','reqpo']},
  {id:'mytasks',label:'Notes',screens:['mytasks']},
  {id:'team',label:'Team',screens:['team'],tag:'ADMIN'},
  /* People & Roles is reached from the account menu (Nav.dc.html has exactly
     the six items above); it stays a hub so go()/hubTabsHTML() still know it. */
  {id:'people',label:'People & Roles',screens:['people'],adminOnly:true,inMenu:true}
];
function navHubFor(screen){ return NAV_HUBS.find(h=>h.screens.includes(screen)); }
function buildNav(){
  const nav=currentNav();
  const valid=new Set([...nav.work,...(PO_ACCESS?nav.budget:[]),...(nav.global||[])]);
  let html='';
  NAV_HUBS.forEach(h=>{
    if(h.adminOnly&&PAPEL!=='admin'&&!isManager) return;
    if(h.inMenu) return;
    const avail=h.screens.filter(s=>valid.has(s));
    if(!avail.length) return;
    const on=avail.includes(SCREEN)||(h.id==='list'&&SCREEN==='projectdetail');
    const badge=h.screens.reduce((n,s)=>n+(navBadge(s)||0),0);
    const go1=avail.includes(SCREEN)?SCREEN:avail[0];
    html+=`<button class="nav-btn${on?' on':''}" onclick="navGo('${go1}')">${esc(h.label)}${badge?`<span class="badge">${badge>99?'99+':badge}</span>`:h.tag?`<span class="tag">${esc(h.tag)}</span>`:''}</button>`;
  });
  acctRefresh();
  $('#navGlobal').innerHTML='';
  $('#navWork').innerHTML=html;
  $('#navBudget').innerHTML='';
  const bell=nav.global.includes('notif')?(()=>{const n=navBadge('notif');return `<button class="nav-bell${SCREEN==='notif'?' on':''}" onclick="navGo('notif')" title="Notifications" aria-label="Notifications">${icn('bell',15)}${n?`<span class="dot">${n>9?'9+':n}</span>`:''}</button>`;})():'';
  $('#navBell').innerHTML=bell;
}
/* Account block (right of the nav) — initials, first name and role tag, as

const ROLE_TAG={admin:'Admin',marketing:'Marketing',financeiro:'Finance',agencia:'Agency',tcl_member:'TCL member',pendente:'Pending'};
function acctRefresh(){
  const email=(currentUser&&currentUser.email)||'';
  const full=String(respName(email)||email||'').trim();
  const parts=full.includes('@')?[full.split('@')[0]]:full.split(/\s+/);
  const ini=(parts.length>1?parts[0][0]+parts[parts.length-1][0]:(parts[0]||'?').slice(0,2)).toUpperCase();
  const av=document.getElementById('acctAv'); if(av){ av.textContent=ini; av.style.background=''; }
  const nm=document.getElementById('acctName'); if(nm) nm.textContent=(parts[0]||'—').replace(/^./,c=>c.toUpperCase());
  const rl=document.getElementById('acctRole'); if(rl) rl.textContent=PAPEL==='agencia'&&MINHA_AGENCIA?MINHA_AGENCIA:(ROLE_TAG[PAPEL]||'');
  const em=document.getElementById('acctEmail'); if(em) em.textContent=email||'—';
  const items=document.getElementById('acctMenuItems'); if(!items) return;
  const isAdm=PAPEL==='admin'||isManager;

  if(isAdm&&(nav.budget||[]).includes('people')) h+=`<button role="menuitem" onclick="closeAcctMenu();navGo('people')">People &amp; roles</button>`;
  if(isAdm&&SCREEN!=='people'&&SCREEN!=='notif') h+=`<div class="mi"><label>View as (read-only)</label>${viewAsSelectHTML()}</div>`;
  items.innerHTML=h;
}
function toggleAcctMenu(ev){
  if(ev) ev.stopPropagation();

function closeAcctMenu(){ const m=document.getElementById('acctMenu'); if(m&&!m.hasAttribute('hidden')) toggleAcctMenu(); }
document.addEventListener('click',e=>{ const m=document.getElementById('acctMenu'); if(m&&!m.hasAttribute('hidden')&&!m.contains(e.target)) closeAcctMenu(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAcctMenu(); });
/* Sub-tab row for the current hub — sits right under the page title, same
   spot Budget.dc.html's Overview/Categories/Cost center/Timeline tabs sit. */
function hubTabsHTML(){
  const nav=currentNav();

  if(!hub||hub.screens.length<2) return '';

/* #view has no height cap of its own (it grows to fit content) — the
   PAGE/body is what actually scrolls, with .top staying pinned via its own
   sticky+z-index:20. So any sticky table header rendered inside #view can't
   just use top:0 — that sits exactly where .top already is and ends up
   hidden behind it (higher z-index). --sticky-top is the real height of
   .top + #viewAsBar (the latter only appears for admin "View as" on Budget
   screens), measured fresh after every render since it varies by screen. */
function syncStickyOffset(){
  const navBar=document.querySelector('.side'), topBar=document.querySelector('.top'), vab=document.getElementById('viewAsBar');
  const navH=navBar?navBar.getBoundingClientRect().height:56;
  document.documentElement.style.setProperty('--nav-h',navH+'px');
  const h=navH+(topBar?topBar.getBoundingClientRect().height:0)+(vab?vab.getBoundingClientRect().height:0);
  document.documentElement.style.setProperty('--sticky-top',h+'px');
}
/* The top nav's row count (and so its height) now depends on window width —
   it wraps the WORK/BUDGET pill rows and the account block as space runs
   out — where the old vertical sidebar was always 100vh regardless of
   width. A resize can change that row count without any navigation
   happening, so --nav-h/--sticky-top need their own listener, not just the
   one recompute per screen render. Debounced — resize fires continuously
   while dragging. */
let _stickyResizeT=null;
window.addEventListener('resize',()=>{ clearTimeout(_stickyResizeT); _stickyResizeT=setTimeout(syncStickyOffset,120); });

function homeMonthLine(){

  const ids=new Set(funds.map(p=>p.id)); const mNow=new Date().toISOString().slice(0,7);
  let cap=0,used=0;
  DATA.tetos.forEach(t=>{if(ids.has(t.fund_id)&&String(t.competencia).slice(0,7)===mNow)cap+=(+t.teto||0);});

   hero with 4 stat cards, sticky sub-nav, Schedule/Activities/Messages/

   ============================================================ */
