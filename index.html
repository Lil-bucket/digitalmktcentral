/* What goes to act_projects.data — the project minus editor state
   (_new/_pendingNotifs/_fromTask/_ver and which rows are expanded). */
function projClean(p){
  const c=JSON.parse(JSON.stringify(p)); delete c._new; delete c._pendingNotifs; delete c._fromTask; delete c._ver;
  (c.tasks||[]).forEach(t=>{ delete t._open; });
  return c;
}
/* The one place a project is written. A new project is inserted; an
   existing one is updated only if nobody changed it since this browser read
   it (p._ver = act_projects.updated_at, bumped by a trigger on every
   UPDATE) — otherwise nothing is written and the user is offered a reload
   instead of silently overwriting someone else's edit. Writes are queued so
   two quick autosaves from this tab never race each other's version. */
let PROJ_SAVE_Q=Promise.resolve();
function projWrite(p,isNew){
  if(DEMO_MODE) return Promise.resolve();
  const run=PROJ_SAVE_Q.then(async()=>{
    const c=projClean(p), row={data:c,campanha_id:c.campanha_id||null};
    let res;
    if(isNew) res=await SBPO.from('act_projects').insert({id:c.id,...row}).select('updated_at');
    else{
      let q=SBPO.from('act_projects').update(row).eq('id',c.id);
      if(p._ver) q=q.eq('updated_at',p._ver);
      res=await q.select('updated_at');
    }
    if(res.error) throw res.error;
    if(!res.data||!res.data.length){
      const {data:cur}=await SBPO.from('act_projects').select('updated_at').eq('id',c.id).maybeSingle();
      if(cur){ projConflict(c.id); throw new Error('This project was changed by someone else — your last change was not saved. Reload it and try again.'); }
      throw new Error('You don\'t have permission to save this project.');
    }
    p._ver=res.data[0].updated_at||null;
  });
  PROJ_SAVE_Q=run.catch(()=>{});
  return run;
}
function projConflict(id){
  setTimeout(()=>{
    if(!confirm('Someone else changed this project since you opened it, so your last change was NOT saved.\n\nReload the latest version now?')) return;
    PD_DIRTY=false; clearTimeout(PD_SAVE_T); if(document.querySelector('#modalMount .pm-modal')) closeModal();
    openProj(id);
  },0);
}

let PD_SCHED='timeline';
function pdScheduleHTML(p){
  const tasks=(p.tasks||[]).filter(t=>t.inicio||t.fim);
  const ds=[projEffStart(p),p.prazo,...tasks.flatMap(t=>[t.inicio,t.fim])].filter(Boolean).sort();
  if(!ds.length) return v2Card('','Schedule','<div style="font-size:13px;color:var(--txt-2);margin-top:8px">No dates yet — give the activities below a start and end date (and the project a due date, in the header) and the timeline appears here.</div>',{id:'pd-sec-schedule',style:'scroll-margin-top:130px'});
  const d0=new Date(ds[0].slice(0,7)+'-01T00:00:00'); const dl=new Date(ds[ds.length-1]+'T00:00:00');
  const d1=new Date(dl.getFullYear(),dl.getMonth()+1,1);
  const span=(d1-d0)/864e5;
  const pos=s=>Math.max(0,Math.min(100,(new Date(s+'T00:00:00')-d0)/864e5/span*100));
  const MM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const months=[]; for(let d=new Date(d0);d<d1;d=new Date(d.getFullYear(),d.getMonth()+1,1)) months.push(d);
  const now=today0(); const nowM=now.getFullYear()*12+now.getMonth();
  const todayIn=now>=d0&&now<d1; const today=todayIn?(now-d0)/864e5/span*100:null;
  const monthRow=`<div style="display:grid;grid-template-columns:repeat(${months.length},1fr)">${months.map(m=>{const cur=m.getFullYear()*12+m.getMonth()===nowM;return `<div style="font-weight:${cur?700:400};color:${cur?'var(--txt)':'var(--txt-2)'}">${MM[m.getMonth()]}${months.length>12||m.getMonth()===0?' '+String(m.getFullYear()).slice(2):''}</div>`;}).join('')}</div>`;
  const isG=PD_SCHED==='gantt';
  const tstat=t=>{ if(t.done) return ['#4fb8ff','#4fb8ff']; if(['atrasado'].includes(t.status)) return ['#ff5c5c','#ff5c5c']; if(['atencao','bloqueado'].includes(t.status)) return ['#ffb020','#ffb020']; const on=t.inicio&&t.fim&&daysTo(t.inicio)<=0&&daysTo(t.fim)>=0; return on?['#4d7dff','#4d7dff']:['transparent','#9aa3b8']; };
  let body;
  if(isG){
    body=`<div style="position:relative">
      ${today!=null?`<div style="position:absolute;left:230px;right:0;top:0;bottom:0;pointer-events:none"><div style="position:absolute;top:0;bottom:0;width:2px;background:#7d9dff;box-shadow:0 0 12px #4d7dff;left:${today}%"></div></div>`:''}
      ${tasks.map(t=>{const a=t.inicio||t.fim,b=t.fim||t.inicio;const l=pos(a),r=pos(dAdd(b,1));const [bg,bd]=tstat(t);
        return `<div style="display:grid;grid-template-columns:230px minmax(0,1fr);align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)"><div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px">${esc(t.n||'(untitled)')}</div><div style="position:relative;height:16px"><div title="${fmtDate(a)} – ${fmtDate(b)}" style="position:absolute;top:0;bottom:0;border-radius:5px;left:${l}%;width:${Math.max(1.2,r-l)}%;background:${bg};border:1.5px solid ${bd}"></div></div></div>`;}).join('')}
    </div>`;
  } else {
    const ms=tasks.filter(t=>t.fim).slice().sort((a,b)=>a.fim.localeCompare(b.fim));
    /* Labels go into four lanes (two above the line, two below); a label
       that would collide with the previous one in every lane is left off —
       its dot keeps the name as a tooltip. The mockup's six milestones never
       collide; a real plan with ten close activities would. */
    const LANES=[44,132,4,172], GAP=15, last=[-99,-99,-99,-99];
    const lab=ms.map(t=>{const x=pos(t.fim);const li=LANES.findIndex((_,k)=>x-last[k]>=GAP);if(li>=0)last[li]=x;return {t,x,li};});
    body=`<div style="position:relative;height:216px;margin-top:6px">
      <div style="position:absolute;left:0;right:0;top:106px;height:2px;background:rgba(255,255,255,.18)"></div>
      ${today!=null?`<div style="position:absolute;top:0;bottom:18px;width:2px;background:#7d9dff;box-shadow:0 0 12px #4d7dff;left:${today}%"></div><div class="mono" style="position:absolute;bottom:-4px;transform:translateX(-50%);font-size:11.5px;color:#9fb5ff;white-space:nowrap;left:${today}%">today · ${now.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>`:''}
      ${lab.map(({t,x,li})=>{const right=x>80;const done=t.done;
        return `<div title="${esc(t.n)} · ${fmtDate(t.fim)}" style="position:absolute;top:99px;width:16px;height:16px;margin-left:-8px;border-radius:50%;left:${x}%;background:${done?'#4fb8ff':'#10172a'};border:2px solid ${done?'#4fb8ff':'#ff3b4e'};z-index:1"></div>
          ${li>=0?`<div style="position:absolute;white-space:nowrap;left:${x}%;top:${LANES[li]}px;margin-left:${right?8:-8}px;transform:translateX(${right?'-100%':'0'});max-width:200px"><div class="mono" style="font-size:11.5px;color:var(--txt-2)">${fmtDate(t.fim)} · ${done?'done':'planned'}</div><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis">${esc(t.n||'(untitled)')}</div></div>`:''}`;}).join('')}
    </div>`;
  }
  return `<div id="pd-sec-schedule" style="scroll-margin-top:130px;border-radius:18px;border:1px solid rgba(255,255,255,.16);padding:22px 26px;background:radial-gradient(40rem 18rem at 100% 0%,rgba(255,59,78,.14),transparent 60%),radial-gradient(34rem 16rem at 45% 120%,rgba(77,125,255,.18),transparent 60%),#10172a;overflow-x:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;position:sticky;left:0">
      <div style="font-size:21px;font-weight:800;letter-spacing:-.02em">Schedule</div>
      ${v2Seg([['timeline','Timeline'],['gantt','Gantt']],PD_SCHED,v=>`PD_SCHED='${v}';go('projectdetail')`).replace('background:#0c1222','background:rgba(5,7,13,.5)')}
    </div>
    <div style="min-width:800px">
      <div style="display:grid;grid-template-columns:${isG?'230px minmax(0,1fr)':'minmax(0,1fr)'};font-size:13px;color:var(--txt-2);padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.1)">${isG?'<div>Activity</div>':''}${monthRow}</div>
      ${body}
    </div>
  </div>`;
}

/* Duplicate: opens a prefilled "new project" form (same type/categories/brand/
   activity names) rather than silently creating a copy — nothing is saved
   until the user reviews it and hits Create, same as any other new project.
   Progress-specific state (done/pct/status, sub-item completion, comment log)
   resets fresh; the due date/start carry over as a starting point to edit. */
function dupProj(id){
  if(['agencia','tcl_member'].includes(effPapel())||VIEW_AS){ toast(VIEW_AS?roMsg():'Only the internal team can create projects.'); return; }
  const src=DATA.projetos.find(x=>x.id===id); if(!src)return;
  const clone=JSON.parse(JSON.stringify(src));
  clone.id=uid();
  clone.nome=(src.nome||'Project')+' (copy)';
  clone.owner=(currentUser&&currentUser.email)||clone.owner;
  clone.resp=(currentUser&&currentUser.email)||clone.resp;
  /* New ids all round, so `dep` has to be re-pointed at them in a second
     pass — copying the arrays verbatim would leave every link aimed at the
     original project's activities, i.e. silently broken. */
  const idMap={};
  clone.tasks=(clone.tasks||[]).map(t=>{
    const nid=uid(); idMap[t.id]=nid;
    const subs=(t.subs||[]).map(s=>{ const sid=uid(); idMap[s.id]=sid; return {...s,id:sid,done:false}; });
    const nt={...t,id:nid,done:false,pct:0,subs};
    nt.status=autoAtvStatus(nt);
    return nt;
  });
  const remap=arr=>(arr||[]).map(d=>idMap[d]).filter(Boolean);
  clone.tasks.forEach(t=>{ t.dep=remap(t.dep); (t.subs||[]).forEach(s=>{ s.dep=remap(s.dep); }); });
  clone.logs=[];
  delete clone.etapa_override;
  openProjModal(clone, true);
}

/* Export (read-only) — one row per project already in projList() (respects the
   active business-type/status filters), plus one activities sheet per project. */
function sanitizeSheetName(name){
  return (name||'').replace(/[:\\\/\?\*\[\]]/g,'').trim().slice(0,31)||'Projeto';
}
function exportWorkXLSX(){
  if(!window.XLSX){ toast('Exportação indisponível — script não carregado.'); return; }
  const list=projList();
  if(!list.length){ toast('Nenhum projeto para exportar.'); return; }
  const wb=XLSX.utils.book_new();
  const resumo=list.map(p=>({
    'Projeto': p.nome||'',
    'Responsável': respName(p.resp)||'',
    'Início': p.inicio||'',
    'Fim': p.prazo||'',
    'Status': statusOf(p.status).name
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumo), 'Resumo');
  const usedNames={};
  list.forEach(p=>{
    const base=sanitizeSheetName(p.nome);
    let name=base, n=2;
    while(usedNames[name]){ name=base.slice(0,28)+'_'+n; n++; }
    usedNames[name]=true;
    const ws=XLSX.utils.aoa_to_sheet([
      ['Projeto', p.nome||''],
      ['Responsável', respName(p.resp)||''],
      ['Início', p.inicio||''],
      ['Fim', p.prazo||''],
      ['Status', statusOf(p.status).name],
      []
    ]);
    const grid=(p.tasks||[]).map(t=>({
      'Atividade': t.n||'',
      'Responsável': respName(t.resp)||'',
      'Início': t.inicio||'',
      'Fim': t.fim||'',
      'Status': statusOf(t.status).name,
      'Observações': t.obs||''
    }));
    if(grid.length) XLSX.utils.sheet_add_json(ws, grid, {origin:-1});
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, `projetos_TCL_${new Date().toISOString().slice(0,10)}.xlsx`);
}

async function reenviarFund(id){

/* ===== Category view: activity columns (fixed, aligned across categories) + compact cards ===== */

/* Itemized fund row — one per fund, grouped by activity. This is the

   one drawing routine so both places move together. */
function fundGaugeHTML(tot,cons,comp,pnd,color,width){

      <span class="mono" style="position:relative;display:flex;align-items:center;gap:6px;width:100%;padding:0 9px;font-size:10.5px;font-weight:700;color:var(--txt-2);white-space:nowrap">

/* Hairline in the section's colour. The category palette is hex, so an alpha

/* ===== Fund lifecycle + alternative views (list / timeline) ===== */
const LC_ORDER={over:0,near:1,active:2,pending:3,done:4};
function fundLastMonth(pid){
  const ms=Object.keys(fundMonthlyTotals(pid));
  (DATA.pos||[]).forEach(po=>{ if(po.fund_id===pid&&po.competencia&&!['REJEITADA','CANCELADA'].includes(po.status)) ms.push(String(po.competencia).slice(0,7)); });
  ms.sort(); return ms[ms.length-1]||'';
}
function fundLifecycle(p){
  if(!FUND_CTX) return 'active';
  if(p.aprovacao_status==='PENDENTE') return 'pending';
  const {tetoBy,consBy,compBy,pendBy}=FUND_CTX;
  const teto=tetoBy[p.id]||0, tot=(consBy[p.id]||0)+(compBy[p.id]||0)+(pendBy[p.id]||0);
  const pct=teto?tot/teto*100:0;
  const lastM=fundLastMonth(p.id), nowM=new Date().toISOString().slice(0,7);
  if(teto&&pct>=99.5&&lastM&&lastM<nowM) return 'done';
  if(teto&&pct>100.5) return 'over';
  if(teto&&pct>=90) return 'near';
  return 'active';
}
function fundBadgeHTML(p){
  const {tetoBy,consBy,compBy,pendBy}=FUND_CTX;
  const teto=tetoBy[p.id]||0, tot=(consBy[p.id]||0)+(compBy[p.id]||0)+(pendBy[p.id]||0);
  const pctTot=teto?tot/teto*100:0, lc=fundLifecycle(p);
  const base='font-size:10px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:4px';
  if(fundArquivado(p)) return `<span style="${base};background:var(--slate-bg);color:var(--slate)" title="Retired with its spend on record — the unused balance went back to the budget">${icn('folder',10)} Archived</span>`;
  if(lc==='done') return `<span style="${base};background:var(--slate-bg);color:var(--slate)">${icn('check',10)} Completed</span>`;
  if(lc==='over') return `<span style="${base};background:var(--red-bg);color:var(--red)">${icn('alert',11)} ${Math.round(pctTot)}% over</span>`;
  if(lc==='near') return `<span style="${base};background:var(--amber-bg);color:var(--amber)">${Math.round(pctTot)}% committed</span>`;
  const AP={APROVADO:{t:'Approved',c:'var(--green)',bg:'var(--green-bg)'},PENDENTE:{t:'Pending',c:'var(--amber)',bg:'var(--amber-bg)'},REJEITADO:{t:'Rejected',c:'var(--red)',bg:'var(--red-bg)'}};
  const ap=AP[p.aprovacao_status]||AP.PENDENTE;
  return `<span style="${base};background:${ap.bg};color:${ap.c}">${ap.t}</span>`;

function fmtCompactBRL(n){
  n=+n||0; if(!n) return '';

  if(abs>=1000000) return (n/1000000).toFixed(abs%1000000?1:0).replace('.',',')+'M';
  if(abs>=1000) return Math.round(n/1000)+'k';
  return String(Math.round(n));
}
function fundTimelineHTML(fl,q){

/* Detalhe do Fund — cap × PO por mês (mostra de qual mês cada PO consome) */
function openFundDetail(pid){
  const p=DATA.poProjetos.find(x=>x.id===pid); if(!p)return;

/* ============================================================
   MONTH-END BALANCE REALLOCATION — a closed month's unused cap can be
   moved forward: fully to next month, split evenly across the fund's
   remaining registered months, or manual per-month amounts. Adds new
   tetos/rateio_alocacao rows (additive — the closed month's own record is
   untouched, everything here is summed by fund_id+competencia elsewhere
   in the app already).
   ============================================================ */
let REALLOC=null; // {pid,fromMonth,balance,mode,splitCount,rows:[{id,mes,valor}]}
/* Fresh, server-side reread of a month's unused balance — mirrors
   fundPastUnallocatedBalance()'s definition exactly (cap minus every PO not
   REJEITADA/CANCELADA) but bypasses the in-memory DATA cache, which is only
   as current as this browser tab's last load/reload. Used by submitRealloc
   as a right-before-write staleness check. */
async function reallocFetchCurrentBalance(pid,fromMonth){
  const comp=fromMonth+'-01';
  const [{data:tetoRows,error:e1},{data:rateioRows,error:e2},{data:poRows,error:e3}]=await Promise.all([
    SBPO.from('tetos').select('teto,corte').eq('fund_id',pid).eq('competencia',comp),
    SBPO.from('rateio_alocacao').select('valor').eq('fund_id',pid).eq('competencia',comp),
    SBPO.from('pos').select('valor,status').eq('fund_id',pid).eq('competencia',comp)
  ]);
  if(e1)throw e1; if(e2)throw e2; if(e3)throw e3;
  const cap=(tetoRows||[]).reduce((s,r)=>s+((+r.teto||0)-(+r.corte||0)),0)+(rateioRows||[]).reduce((s,r)=>s+(+r.valor||0),0);
  const committed=(poRows||[]).filter(po=>!['REJEITADA','CANCELADA'].includes(po.status)).reduce((s,po)=>s+(+po.valor||0),0);
  return r2(cap-committed);
}
function fundNextCalMonth(m){ const y=+m.slice(0,4), mo=+m.slice(5,7); return mo===12?(y+1)+'-01':m.slice(0,4)+'-'+String(mo+1).padStart(2,'0'); }
function fundFutureRegisteredMonths(pid,afterM){ return Object.keys(fundMonthlyTotals(pid)).filter(m=>m>afterM).sort(); }
/* Reallocating a closed month's balance and cutting it are the same decision
   seen from two sides — move the money forward, or accept it is gone — so the
   cut is offered wherever the reallocation is, instead of making someone open
   the values editor to do the other half of a choice they are already making. */
let CUTBAL=null;
function openCutBalance(pid,mes,saldo){
  fdMarkBack();
  const p=DATA.poProjetos.find(x=>x.id===pid); if(!p)return;
  if(!canRestrict()&&!DEMO_MODE){ toast('Only marketing managers or admin can cut budget.'); return; }
  CUTBAL={pid,mes,max:r2(+saldo||0),valor:r2(+saldo||0),motivo:''};
  renderCutBalance();
}
function cutBalSet(k,v){ if(CUTBAL)CUTBAL[k]=v; }
function cutBalMoney(el){
  if(!CUTBAL)return;
  let v=moneyParse(el.value);
  if(v>CUTBAL.max){ v=CUTBAL.max; toast(`This month has ${BRL(CUTBAL.max)} left — that is the most that can be cut.`); }
  CUTBAL.valor=v; el.value=v?moneyFmt(v):'';
  const el2=document.getElementById('cbRest'); if(el2)el2.textContent=BRL(CUTBAL.max-v);
}
function renderCutBalance(){
  if(!CUTBAL)return; const cb=CUTBAL;
  const p=DATA.poProjetos.find(x=>x.id===cb.pid)||{};

/* tetos has UNIQUE(fund_id,competencia) — a target month that already has a
   cap must be UPDATED (existing + amount), never inserted a second time. */
async function reallocCreditTetos(pid,targets){
  for(const t of targets){
    const comp=t.mes+'-01';
    const {data,error}=await SBPO.from('tetos').select('id,teto').eq('fund_id',pid).eq('competencia',comp).limit(1);
    if(error)throw error;
    const cur=(data||[])[0];
    if(cur){ const {error:e2}=await SBPO.from('tetos').update({teto:r2((+cur.teto||0)+(+t.valor||0))}).eq('id',cur.id); if(e2)throw e2; }
    else{ const {error:e3}=await SBPO.from('tetos').insert({fund_id:pid,competencia:comp,teto:r2(+t.valor||0),definido_por:'realocacao'}); if(e3)throw e3; }
  }
}
/* Reallocation MOVES money: the source month's cap must drop by the same amount,
   otherwise the total budget grows. teto has CHECK (teto >= 0). */
async function reallocDebitTetos(pid,fromMonth,amount){
  const comp=fromMonth+'-01';
  const {data,error}=await SBPO.from('tetos').select('id,teto').eq('fund_id',pid).eq('competencia',comp).limit(1);
  if(error)throw error;
  const cur=(data||[])[0]; if(!cur)return;
  const {error:e2}=await SBPO.from('tetos').update({teto:Math.max(0,r2((+cur.teto||0)-(+amount||0)))}).eq('id',cur.id);
  if(e2)throw e2;
}
/* rateio_alocacao has no unique key (rows are summed), but the source month's
   rows still have to be reduced proportionally by the amount moved out.
   Rounding each row's reduction independently can drift the total debited
   away from `amount` by a few cents — every row but the last keeps its own
   rounded reduction, the last absorbs whatever's left so the total moved
   always matches `amount` exactly (same pattern as submitCampValues). */
async function reallocDebitRateio(pid,fromMonth,amount){
  const comp=fromMonth+'-01';
  const {data,error}=await SBPO.from('rateio_alocacao').select('id,valor').eq('fund_id',pid).eq('competencia',comp);
  if(error)throw error;
  const rows=data||[]; const tot=rows.reduce((s,r)=>s+(+r.valor||0),0); if(!tot)return;
  let runningCut=0;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    let cut=r2((+amount||0)*((+r.valor||0)/tot));
    if(i===rows.length-1) cut=r2((+amount||0)-runningCut); else runningCut+=cut;
    const nv=Math.max(0,r2((+r.valor||0)-cut));
    const {error:e2}=await SBPO.from('rateio_alocacao').update({valor:nv}).eq('id',r.id); if(e2)throw e2;
  }
}
async function submitRealloc(){

  const preview=reallocPreviewRows().filter(r=>r.mes&&(+r.valor||0)>0);
  if(!preview.length){ toast('Add at least one month with a value.'); return; }
  const sum=preview.reduce((s,r)=>s+(+r.valor||0),0);
  if(REALLOC.mode==='manual'&&r2(sum)!==r2(REALLOC.balance)){ toast('Total must match the available balance.'); return; }
  const p=DATA.poProjetos.find(x=>x.id===REALLOC.pid); if(!p)return;
  const moved=r2(sum);
  try{
    /* Guard against a stale-page double reallocation (real incident: a second
       user whose page hadn't refreshed re-opened this same month's balance
       and submitted again, crediting the destination month twice while the
       source month — already at 0 — just clamped, hiding the problem). The
       modal's REALLOC.balance was captured whenever the page/fund was
       last loaded; re-derive the SAME balance fresh from the server right
       before writing and refuse if it no longer matches — this is exactly
       what would have caught it. */
    const fresh=await reallocFetchCurrentBalance(REALLOC.pid,REALLOC.fromMonth);
    if(Math.abs(fresh-REALLOC.balance)>0.5){
      toast('This balance changed since you opened this — it may have already been reallocated. Reload and try again.');
      REALLOC=null; closeModal(); await reloadPOAll(); goCostCenter();
      return;
    }
    if(p.rateio){
      const cats=[...new Set((DATA.rateio||[]).filter(r=>r.fund_id===p.id).map(r=>r.categoria))];
      if(!cats.length){ toast('Cannot resolve rateio categories for this fund.'); return; }
      const totalByCat={}; (DATA.rateio||[]).filter(r=>r.fund_id===p.id&&r.competencia&&String(r.competencia).slice(0,7)===REALLOC.fromMonth).forEach(r=>{ totalByCat[r.categoria]=(totalByCat[r.categoria]||0)+(+r.valor||0); });
      const totAll=Object.values(totalByCat).reduce((a,b)=>a+b,0)||1;
      const rows=[];

         category but the last keeps its own rounded share of pr.valor, the
         last absorbs the remainder so each month's split always sums back

      preview.forEach(pr=>{
        let running=0;

          const share=(totalByCat[cat]||(totAll/cats.length))/totAll;

async function submitCapPedido(){

async function submitCampValues(){
  if(viewOnly()){toast(roMsg());return;}
  if(!FUNDVAL)return; const cv=FUNDVAL;
  const rows=cv.rows.filter(r=>r.mes&&(+r.valor||0)>0);
  if(!rows.length){ toast('Add at least one month with a value.'); return; }
  // Re-check the cap here too: the button is disabled while over, but the cap
  // is derived from data that a background refresh can move under the modal.
  const limit=fundCapAprovado(cv.id);
  const total=rows.reduce((s,r)=>s+(+r.valor||0),0);
  if(limit!=null&&total>limit+0.005){ toast(`Over the approved cap by ${BRL(total-limit)} — reduce the months, or request an increase.`); return; }
  try{
    if(cv.rateio){
      let splits=(DATA.fee||[]).filter(f=>f.tipo===cv.qual);
      if(!splits.length && cv.qual){ splits=(DATA.fee||[]).filter(f=>String(f.tipo||'').toUpperCase()===String(cv.qual||'').toUpperCase()); }
      if(!splits.length){ toast('Cannot resolve the rateio categories. Re-pick the rateio in "Edit category / budget".'); return; }
      const alloc=[];
      /* Independently rounding each category's share (r2(v*pct)) drifts a
         few cents/reais off the typed monthly total whenever the fee
         percentuals are repeating decimals (e.g. thirds) — every row but the
         last gets its own rounded share, the last absorbs whatever's left so
         the split always reconciles exactly to v. Same pattern already used
         by reqSplitBreakdown() for the PO-request split-by-percentage flow. */
      rows.forEach(r=>{
        const v=+r.valor||0; let running=0;
        splits.forEach((s,i)=>{
          let valor=r2(v*(+s.percentual||0));
          if(i===splits.length-1) valor=r2(v-running); else running+=valor;
          alloc.push({fund_id:cv.id,categoria:s.categoria||null,competencia:r.mes+'-01',valor});
        });
      });
      await SBPO.from('rateio_alocacao').delete().eq('fund_id',cv.id);
      const {error}=await SBPO.from('rateio_alocacao').insert(alloc); if(error)throw error;
    }else{
      /* The cut travels with the row it belongs to. This path rewrites the
         fund's months wholesale, so anything not carried here is destroyed —
         which is exactly how a cut would go missing the next time somebody
         touched an unrelated month. */
      const now=new Date().toISOString();
      await SBPO.from('tetos').delete().eq('fund_id',cv.id);
      const tetos=rows.map(r=>{
        const prev=tetoRow(cv.id,r.mes)||{};
        const devol=r2(Math.min(+prev.devolucao||0,+r.valor||0));
        const corte=r2(Math.min(+r.corte||0,Math.max(0,(+r.valor||0)-devol)));
        return {fund_id:cv.id,competencia:r.mes+'-01',teto:r2(+r.valor),definido_por:'portal',
                corte:corte,
                corte_motivo:corte?(String(r.motivo||'').trim()||null):null,
                corte_em:corte?(prev.corte_em||now):null,
                devolucao:devol,
                devolucao_motivo:devol?(prev.devolucao_motivo||null):null,
                devolucao_em:devol?(prev.devolucao_em||now):null,
                bloqueado:fundMonthBlocked(cv.id,r.mes)};
      });
      const {error}=await SBPO.from('tetos').insert(tetos); if(error)throw error;
    }
    await reloadPOAll(); toastSaved();
  }catch(e){ toastErr(e); }
}

/* Edit an existing fund — reassign it to the correct PRODUCT CATEGORY
   (TV/AC/MOB/REF/WG/LABG) so the budget the value belongs to is unambiguous.
   Values/months are untouched; only classification + name/agency change. */
let FUNDEDIT=null;
function guessCat(str){ const s=String(str||'').toUpperCase(); for(const c of PRODUCT_CATS){ if(new RegExp('(^|[^A-Z])'+c+'([^A-Z]|$)').test(s)) return c; } return ''; }
/* ============================================================
   CORTE POR MÊS
   ------------------------------------------------------------
   A month's approved ceiling (`tetos.teto`) is never rewritten when budget
   is taken back. The amount withdrawn is recorded beside it (`tetos.corte`)
   and the month's EFFECTIVE cap is teto − corte. That keeps two different
   questions answerable at once — "what was this month approved for" and
   "what may still be spent" — where lowering the teto would have destroyed
   the first to express the second, and the year's approval history with it.

   fundMonthlyTotals() returns the EFFECTIVE cap, because "the cap" is what
   nearly every screen means: gauges, timelines, campaign roll-ups, the
   Extrato. The approved original is fundMonthlyGross(), used by the two
   places that genuinely mean it — the values editor and the approved-cap
   check. An agency only ever sees the effective figure; the split is shown
   to internal profiles (canSeeCorte).
   ============================================================ */
/* Every screen that sums a month's budget reads `t.teto`, in about twenty
   places. Rather than teach each of them to subtract, the rows are normalised
   once on the way in: `teto` becomes the EFFECTIVE cap and the approved
   original is kept beside it as `teto_aprovado`. One choke point, and no
   aggregation can be forgotten and quietly keep reporting money that was
   taken back. Writes are unaffected — every path that writes a teto reads its
   current value straight from the database, never from DATA.tetos. */
function normTetos(rows){
  return (rows||[]).map(t=>{
    // Idempotent: a failed refresh hands back the rows already normalised
    // (tookOr keeps the previous array), and subtracting twice would
    // silently halve the month.
    const bruto=t.teto_aprovado!=null?+t.teto_aprovado:(+t.teto||0);
    const corte=+t.corte||0, devol=+t.devolucao||0;

async function aprovarPO(id){
  const sibs=poGroupSiblings(DATA.pos.find(x=>x.id===id));
  if(DEMO_MODE){ sibs.forEach(po=>po.status='APROVADA'); toast('PO approved ✓ (demo)'); go(SCREEN); return; }
  if(viewOnly()){toast(roMsg());return;}
  try{
    for(const po of sibs){ const {error}=await SBPO.rpc('aprovar_po',{p_po:po.id}); if(error)throw error; }
    toast('PO approved ✓'); await reloadPO(); go(SCREEN);
  }catch(e){ toastErr(e); }
}
async function rejeitarPO(id){
  const sibs=poGroupSiblings(DATA.pos.find(x=>x.id===id));
  if(!DEMO_MODE&&viewOnly()){toast(roMsg());return;}
  /* The reason travels to the requester in the rejection e-mail and in-app
     notification (motivo_rejeicao) — without it they only saw "see platform". */
  const motivo=prompt('Reason for rejecting this PO (sent to whoever requested it):'); if(motivo===null)return;
  if(!motivo.trim()){ toast('Describe the reason.'); return; }
  if(DEMO_MODE){ sibs.forEach(po=>{po.status='REJEITADA';po.motivo_rejeicao=motivo.trim();}); toast('PO rejected (demo)'); go(SCREEN); return; }
  try{
    for(const po of sibs){ const {error}=await SBPO.rpc('rejeitar_po_com_motivo',{p_po:po.id,p_motivo:motivo.trim()}); if(error)throw error; }
    toast('PO rejected'); await reloadPO(); go(SCREEN);
  }catch(e){ toastErr(e); }
}
async function aprovarCamp(id){
  if(DEMO_MODE){ const p=DATA.poProjetos.find(x=>x.id===id); if(p)p.aprovacao_status='APROVADO'; toast('Fund approved ✓ (demo)'); go(SCREEN); return; }
  if(viewOnly()){toast(roMsg());return;}
  try{
    const {error}=await SBPO.rpc('aprovar_fund',{p_fund:id}); if(error)throw error;
    /* Freeze the ceiling at approval. From here the monthly values may be
       redistributed or reduced freely, but the total can only grow through an
       approved request — which is the whole point of approving an opening. */
    const cap=r2(Object.values(fundMonthlyTotals(id)).reduce((s,v)=>s+v,0));
    try{ await SBPO.from('funds').update({cap_aprovado:cap}).eq('id',id); }
    catch(e2){ console.warn('cap_aprovado on approval:',(e2&&e2.message)||e2); }
    toast(`Fund approved ✓ — cap fixed at ${BRL(cap)}`); await reloadPOAll(); go(SCREEN);
  }
  catch(e){ toastErr(e); }
}
async function rejeitarCamp(id){
  const motivo=prompt('Reason for rejecting the fund:'); if(motivo===null)return;
  if(DEMO_MODE){ DATA.poProjetos=DATA.poProjetos.filter(x=>x.id!==id); toast('Fund rejected (demo)'); go(SCREEN); return; }

  catch(e){ toastErr(e); }
}

function fmtDataBR(s){ if(!s)return'—'; const p=String(s).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s; }
function calcVencimento(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr+'T00:00:00'); const day=d.getDate(); const y=d.getFullYear(), m=d.getMonth();
  if(day<=8) return new Date(y,m,25);
  if(day<=12) return new Date(y,m+1,5);
  if(day<=18) return new Date(y,m+1,15);
  return new Date(y,m+1,25); // 19-25 e 26-31 (bloqueio) → dia 25 do mês seguinte
}
function fmtDateObjBR(d){ if(!d)return'—'; return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function poEstimativaPagamento(po){
  if(po.vencimento) return {date:fmtDataBR(po.vencimento),confirmed:true};
  if(['REJEITADA','CANCELADA'].includes(po.status)) return null;
  const base=po.solicitado_em?String(po.solicitado_em).slice(0,10):null;
  if(!base) return null;
  return {date:fmtDateObjBR(calcVencimento(base)),confirmed:false};
}

function tasksKey(){ return 'po_ptasks_'+((currentUser&&currentUser.email)||'anon'); }
/* Personal tasks live in Supabase (painel · tarefas_pessoais, RLS per email).
   localStorage is an offline cache; on first load, local tasks migrate to the server. */
function normPTask(t){ return typeof t==='string'?({id:uid(),title:t,desc:'',due:'',tag:'—',done:false,t:Date.now(),createdAt:Date.now(),updatedAt:Date.now()}):{id:t.id||uid(),title:t.title!=null?t.title:(t.n||''),desc:t.desc||'',due:t.due||'',tag:t.tag||'—',done:!!t.done,t:t.t||Date.now(),createdAt:t.createdAt||t.t||Date.now(),updatedAt:t.updatedAt||t.t||Date.now()}; }
let PTASKS=null, _ptTimer=null;
function loadPTasksLocal(){ try{ return JSON.parse(localStorage.getItem(tasksKey())||'[]')||[]; }catch(e){ return []; } }
function loadPTasks(){ return (PTASKS!=null?PTASKS:loadPTasksLocal()).map(normPTask); }
function savePTasks(list){
  PTASKS=list;
  try{ localStorage.setItem(tasksKey(), JSON.stringify(list)); }catch(e){}
  clearTimeout(_ptTimer);
  _ptTimer=setTimeout(async()=>{
    const email=((currentUser&&currentUser.email)||'').toLowerCase(); if(!email)return;
    try{ const {error}=await SBPO.from('act_tarefas_pessoais').upsert({email,data:list,atualizado_em:new Date().toISOString()}); if(error)throw error; }
    catch(e){ console.warn('tasks sync:',(e&&e.message)||e); toast('Task saved on this device — cloud sync failed.'); }
  },600);
}
async function loadPTasksRemote(){
  const email=((currentUser&&currentUser.email)||'').toLowerCase(); if(!email)return;
  try{
    const {data,error}=await SBPO.from('act_tarefas_pessoais').select('data').eq('email',email).maybeSingle();
    if(error)throw error;
    if(data&&Array.isArray(data.data)){ PTASKS=data.data; try{localStorage.setItem(tasksKey(),JSON.stringify(PTASKS));}catch(e){} }
    else{
      const local=loadPTasksLocal(); PTASKS=local;
      if(local.length){ await SBPO.from('act_tarefas_pessoais').upsert({email,data:local,atualizado_em:new Date().toISOString()}); }
    }
  }catch(e){ console.warn('tasks load:',(e&&e.message)||e); }
}
function sanitizeRich(html){
  const tmp=document.createElement('div'); tmp.innerHTML=html||'';
  const allowed=new Set(['B','STRONG','UL','LI','BR','DIV']);
  function process(node){
    Array.from(node.childNodes).forEach(process);
    if(node.nodeType===1){
      if(!allowed.has(node.tagName)){
        while(node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
        node.parentNode.removeChild(node);
      } else {
        Array.from(node.attributes).forEach(a=>node.removeAttribute(a.name));
      }
    } else if(node.nodeType!==3){
      node.parentNode && node.parentNode.removeChild(node);
    }
  }
  Array.from(tmp.childNodes).forEach(process);
  return tmp.innerHTML;
}
let PT_FILTER='open';
/* The two-pane editor (Notes.dc.html): PT_ACTIVE is the id of the note
   currently open in the right-hand editor, or null while drafting a new one.
   PT_BUF mirrors its title/due/tag fields live; the rich-text body reads
   straight out of the DOM (#ptBody) on save, same as the old inline editor
   did. Nothing here is written to loadPTasks()/savePTasks() until "Save as
   task", matching the mockup's explicit save button instead of autosaving
   every keystroke. */
let PT_ACTIVE, PT_BUF={title:'',due:'',tag:'—',pendingHtml:null};
function ptSetFilter(v){ PT_FILTER=v; renderTasksInto(); }
/* Same Today/This week/Later/No date buckets the mockup groups by — computed
   from daysTo() so "today" and "this week" track the real calendar, not a
   stored label. */
function ptBucket(due){
  if(!due) return 'none';
  const dd=daysTo(due);
  if(dd<0) return 'today'; // overdue surfaces with today's urgency, not buried in "later"
  if(dd===0) return 'today';
  if(dd<=7) return 'week';
  return 'later';
}
function ptRtFmt(id,cmd){ const el=document.getElementById(id); if(!el)return; el.focus(); document.execCommand(cmd); }
function ptToggle(id){ const l=loadPTasks(); const t=l.find(x=>x.id===id); if(t){t.done=!t.done;t.updatedAt=Date.now();} savePTasks(l); renderTasksInto(); }
function ptDel(id){ savePTasks(loadPTasks().filter(x=>x.id!==id)); if(PT_ACTIVE===id){PT_ACTIVE=null;PT_BUF={title:'',due:'',tag:'—',pendingHtml:null};} renderTasksInto(); }
function ptOpen(id){
  PT_ACTIVE=id;
  const t=id?loadPTasks().find(x=>x.id===id):null;
  PT_BUF={title:t?t.title:'',due:t?t.due:'',tag:t?(t.tag||'—'):'—',pendingHtml:null};
  renderTasksInto();
  const ti=$('#ptTitle'); if(ti) ti.focus();
}
function ptNewNote(){ ptOpen(null); }
/* Changing Due/Project re-renders the whole pane (same as any other field
   here), which would otherwise wipe out text typed into the body but not
   saved yet — so the current DOM content is snapshotted first and the
   editor template below reads it back instead of the last-saved value. */
function ptBufSet(k,v){
  const ed=$('#ptBody'); if(ed) PT_BUF.pendingHtml=ed.innerHTML;
  PT_BUF[k]=v; renderTasksInto();
}
function ptSaveActive(){
  const ed=$('#ptBody'); const html=sanitizeRich(ed?ed.innerHTML:'');
  const title=(PT_BUF.title||'').trim();
  if(!title){ toast('Give the note a title.'); return; }
  const l=loadPTasks(); const now=Date.now();
  if(PT_ACTIVE){
    const t=l.find(x=>x.id===PT_ACTIVE);
    if(t){ t.title=title; t.due=PT_BUF.due; t.tag=PT_BUF.tag; t.desc=html; t.updatedAt=now; }
  } else {
    const id=uid(); l.unshift({id,title,due:PT_BUF.due,tag:PT_BUF.tag,desc:html,done:false,t:now,createdAt:now,updatedAt:now});

/* ============================================================

   ============================================================
   Activities depend on other activities of the same project; sub-items depend
   on siblings inside the same activity. Both are plain arrays of ids on the
   item (`dep`), so the same six helpers below serve either level — pass the
   list the item belongs to.
   The relationship is finish-to-start: an item may only begin AFTER every
   predecessor's due date. Nothing here reschedules silently — a violation is
   surfaced inline and fixed by an explicit "Reschedule" action, because a
   date someone typed on purpose should not move under them. */
const D_MS=864e5;
function newAtv(n){ return {id:uid(),n:n||'',done:false,inicio:'',fim:'',dep:[],status:'no_prazo',pct:0,obs:'',resp:'',subs:[]}; }
function newSub(n){ return {id:uid(),n:n||'',done:false,inicio:'',fim:'',dep:[],resp:'',obs:''}; }
function dISO(d){ return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function dAdd(s,n){ if(!s)return''; const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return dISO(d); }
function dDiff(a,b){ if(!a||!b)return 0; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/D_MS); }

   has to clear. Missing/undated predecessors simply don't constrain it. */
function depEnd(list,item){
  let m='';
  (item.dep||[]).forEach(id=>{ const d=(list||[]).find(x=>x.id===id); if(d&&d.fim&&(!m||d.fim>m)) m=d.fim; });

/* "Share link" now just resolves (or mints, once) the one link this project
   will ever have — no snapshot is generated or uploaded here. The link
   itself stays constant; what it shows changes on its own each time it's
   opened, straight from get_timeline_share_project(). */
async function exportProjTimeline(pid){
  if(DEMO_MODE){ toast('Demo mode — sharing is disabled.'); return; }
  const p=DATA.projetos.find(x=>x.id===pid); if(!p){toast('Project not found.');return;}
  if(!projHasDates(p)){ toast('This project has no dated activities to plot yet.'); return; }
  toast('Getting the share link…');
  try{
    const {data:shareId,error}=await SBPO.rpc('get_or_create_timeline_share',{p_project_id:pid});
    if(error) throw error;
    const url=location.origin+location.pathname+'?share='+shareId;
    openShareLinkModal(url,p.nome);
  }catch(e){ toast('Could not get the link: '+((e&&e.message)||e)); }
}
function openShareLinkModal(url,name){

/* Typing a name and pressing Enter is the primary way to add work here: the
   field keeps focus after each one, so ten activities take ten lines of
   typing instead of ten click-rename-click rounds. */
function pmQuickAtv(ev){
  if(ev.key!=='Enter')return;
  ev.preventDefault();
  const v=(ev.target.value||'').trim(); if(!v)return;
  if(!canEditAtividades(EDIT)){ toast('You can\'t edit this project\'s activities.'); return; }
  EDIT.tasks=EDIT.tasks||[]; EDIT.tasks.push(newAtv(v));
  ev.target.value='';
  PM_REFOCUS={sel:'#pmQuickAtv'};
  renderProjModal();
}
function pmQuickSub(ev,tid){
  if(ev.key!=='Enter')return;
  ev.preventDefault();
  const v=(ev.target.value||'').trim(); if(!v)return;
  const t=atv(tid); if(!t||!canEditAtividades(EDIT))return;
  t.subs=t.subs||[]; t.subs.push(newSub(v));

/* Pasting a list creates one item per line — the fastest path from a brief,
   a kickoff doc or a spreadsheet column into the plan. Leading bullets and
   "1." numbering are stripped; a single-line paste behaves normally. */
function pmPasteLines(ev,tid){
  const txt=((ev.clipboardData||window.clipboardData||{}).getData?(ev.clipboardData||window.clipboardData).getData('text'):'')||'';
  if(!/[\n\r]/.test(txt))return;
  ev.preventDefault();
  if(!canEditAtividades(EDIT)){ toast('You can\'t edit this project\'s activities.'); return; }
  const names=txt.split(/\r?\n/).map(s=>s.replace(/^\s*(?:[-*•–]|\d+[.)])\s+/,'').trim()).filter(Boolean);
  if(!names.length)return;
  if(tid){ const t=atv(tid); if(!t)return; t.subs=t.subs||[]; names.forEach(n=>t.subs.push(newSub(n))); pmRecalcPctFromSubs(t); PM_REFOCUS={sel:'#pmQuickSub-'+tid}; }
  else { EDIT.tasks=EDIT.tasks||[]; names.forEach(n=>EDIT.tasks.push(newAtv(n))); PM_REFOCUS={sel:'#pmQuickAtv'}; }
  ev.target.value='';
  renderProjModal();
  toast(names.length+' item'+(names.length===1?'':'s')+' added');
}
function pmAddAtv(){
  if(!canEditAtividades(EDIT))return;
  EDIT.tasks=EDIT.tasks||[]; EDIT.tasks.push(newAtv(''));
  PM_REFOCUS={sel:'#pmQuickAtv'};
  renderProjModal();
}
function pmDelAtv(tid){
  if(!canEditAtividades(EDIT))return;
  // Drop the link too, or the survivors keep a predecessor that no longer exists.
  EDIT.tasks=(EDIT.tasks||[]).filter(t=>t.id!==tid);
  (EDIT.tasks||[]).forEach(t=>{ t.dep=(t.dep||[]).filter(d=>d!==tid); });
  renderProjModal();
}
/* ---- dependency editing ---- */
let DEP_POP=null; // {tid, sid|null} — which cell's picker is open
function pmDepList(tid){ const t=tid?atv(tid):null; return t?(t.subs||[]):(EDIT.tasks||[]); }
function pmDepItem(tid,sid){ const l=pmDepList(sid?tid:null); return l.find(x=>x.id===(sid||tid)); }
function pmDepToggle(tid,sid,depId){
  if(!canEditAtividades(EDIT))return;
  const list=sid?pmDepList(tid):pmDepList(null);
  const it=list.find(x=>x.id===(sid||tid)); if(!it)return;
  it.dep=it.dep||[];
  const i=it.dep.indexOf(depId);
  if(i>=0) it.dep.splice(i,1);
  else{
    if(depWouldCycle(list,sid||tid,depId)){ toast('That would create a circular dependency.'); return; }
    it.dep.push(depId);
    // A brand-new link on an undated item schedules it right after its
    // predecessor — the obvious intent, and only when nothing is overwritten.
    const floor=depStartFloor(list,it);
    if(floor&&!it.inicio&&!it.fim){ it.inicio=floor; it.fim=floor; }
  }
  if(!sid) it.status=autoAtvStatus(it);
  renderProjModal();
  if(DEP_POP) pmDepPop(DEP_POP.tid,DEP_POP.sid,null,true);
}
function pmDepClosePop(){ DEP_POP=null; const h=$('#pmPop'); if(h)h.innerHTML=''; }
/* Anchored to the button with position:fixed so it escapes .modal-b's own
   scroll container (an absolutely-positioned panel in there gets clipped). */
function pmDepPop(tid,sid,ev,keepOpen){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const same=DEP_POP&&DEP_POP.tid===tid&&DEP_POP.sid===(sid||null);
  if(same&&!keepOpen){ pmDepClosePop(); return; }
  DEP_POP={tid,sid:sid||null};
  const host=$('#pmPop'); if(!host)return;
  const list=sid?pmDepList(tid):pmDepList(null);
  const selfId=sid||tid;
  const it=list.find(x=>x.id===selfId); if(!it){ pmDepClosePop(); return; }
  const opts=list.filter(x=>x.id!==selfId);
  const rows=opts.length?opts.map((x,i)=>{
    const on=(it.dep||[]).includes(x.id);
    const bad=!on&&depWouldCycle(list,selfId,x.id);
    const ix=sid?(list.indexOf(x)+1):(list.indexOf(x)+1);
    return `<button class="dep-opt${on?' on':''}" ${bad?'disabled title="Would create a loop"':''} onclick="pmDepToggle('${escJs(tid)}',${sid?"'"+esc(sid)+"'":'null'},'${escJs(x.id)}')">
      <span class="ix">${String(ix).padStart(2,'0')}</span><span class="nm">${esc(x.n||'(untitled)')}</span>
      <span style="flex-shrink:0;color:${on?'var(--accent)':'var(--txt-3)'};font-family:var(--mono);font-size:10px">${x.fim?fmtDate(x.fim):'no date'}</span>
      ${on?icn('check',12):''}</button>`;
  }).join(''):`<div class="none">Nothing else to link to yet — add another ${sid?'sub-item':'activity'} first.</div>`;
  host.innerHTML=`<div class="dep-pop" id="depPop" onclick="event.stopPropagation()"><div class="hd">Starts after</div>${rows}</div>`;
  const btn=document.getElementById('depBtn-'+(sid||tid));
  const pop=document.getElementById('depPop');
  if(btn&&pop){
    const r=btn.getBoundingClientRect(), pw=290;
    let left=Math.min(Math.max(8,r.right-pw), window.innerWidth-pw-8);
    let top=r.bottom+6;
    if(top+pop.offsetHeight>window.innerHeight-8) top=Math.max(8,r.top-pop.offsetHeight-6);
    pop.style.left=left+'px'; pop.style.top=top+'px';
  }
}
document.addEventListener('click',()=>{ if(DEP_POP) pmDepClosePop(); });
/* Explicit, never automatic: dates people typed on purpose only move when
   they ask for it, and the toast says how many did. */
function pmReschedule(){
  if(!canEditAtividades(EDIT))return;
  let moved=schedResolve(EDIT.tasks||[]);
  (EDIT.tasks||[]).forEach(t=>{ moved+=schedResolve(t.subs||[]); t.status=autoAtvStatus(t); });

/* Drag-to-reorder activities — same DRAG-id + dataTransfer pattern as the
   Kanban card drag (dragStartCard/dropOnStage), scoped to EDIT.tasks. */
let DRAG_ATV=null;
function atvDragStart(ev,tid){ DRAG_ATV=tid; ev.dataTransfer.effectAllowed='move'; try{ev.dataTransfer.setData('text/plain',tid);}catch(e){} }
function atvDragOver(ev){ ev.preventDefault(); ev.dataTransfer.dropEffect='move'; if(DRAG_ATV&&ev.currentTarget&&ev.currentTarget.classList) ev.currentTarget.classList.add('drop-tgt'); }
function atvDragLeave(ev){ if(ev.currentTarget&&ev.currentTarget.classList) ev.currentTarget.classList.remove('drop-tgt'); }
function atvDrop(ev,tid){
  ev.preventDefault();
  if(ev.currentTarget&&ev.currentTarget.classList) ev.currentTarget.classList.remove('drop-tgt');
  const from=DRAG_ATV||ev.dataTransfer.getData('text/plain'); DRAG_ATV=null;
  if(!from||from===tid||!EDIT||!canEditAtividades(EDIT))return;
  const tasks=EDIT.tasks||[];
  const fi=tasks.findIndex(t=>t.id===from), ti=tasks.findIndex(t=>t.id===tid);
  if(fi<0||ti<0)return;
  const [moved]=tasks.splice(fi,1);
  tasks.splice(ti,0,moved);
  renderProjModal();
}
/* Sub-items count toward their parent activity's % — auto-computed from
   how many sub-items are done, replacing the activity's manual % input

/* The activity/sub-item "— tag someone —" picker draws from the same roster
   and carries the same exclusion: assigning work to a login with no Work
   screens is a dead end. A name already stored on an activity is kept in the
   list so an existing assignment doesn't silently blank out on re-render. */
function subPersonOpts(sel){
  const names=[...new Set(taggablePessoas().map(pe=>[pe.nome,pe.sobrenome].filter(Boolean).join(' ')).filter(Boolean))];
  if(sel&&!names.includes(sel)) names.push(sel);
  names.sort();
  return '<option value="">— tag someone —</option>'+names.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('');
}
function pmRecalcPctFromSubs(t){
  if(!t.subs||!t.subs.length)return;
  const doneN=t.subs.filter(s=>s.done).length;
  t.pct=Math.round(doneN/t.subs.length*100);
  t.done=t.pct>=100;
  t.status=autoAtvStatus(t);
}
function pmAddSub(tid){ const t=atv(tid); if(t){ t.subs=t.subs||[]; t.subs.push(newSub('')); pmRecalcPctFromSubs(t); PM_REFOCUS={sel:'#pmQuickSub-'+tid}; renderProjModal(); } }
function pmSubSet(tid,sid,k,v){
  const t=atv(tid); if(!t)return;
  const s=(t.subs||[]).find(x=>x.id===sid); if(!s)return;
  s[k]=v;

}
function pmSubDone(tid,sid){ const t=atv(tid); if(t){ const s=(t.subs||[]).find(x=>x.id===sid); if(s){s.done=!s.done; pmRecalcPctFromSubs(t); renderProjModal();} } }
function pmDelSub(tid,sid){
  const t=atv(tid); if(!t)return;
  t.subs=(t.subs||[]).filter(x=>x.id!==sid);
  (t.subs||[]).forEach(s=>{ s.dep=(s.dep||[]).filter(d=>d!==sid); });

/* Scans a log update's text for @mentions, matched only against people
   already tagged on this project (mentionablePessoas()) — freehand typing
   an @Full Name can no longer reach or silently tag someone who isn't on
   the project yet; that still has to go through "+ tag someone" first.
   Two passes so duplicate first names don't cross-fire: pass 1 matches full
   "@First Last" mentions (typed via the autocomplete, which always inserts
   the full name) and blanks out whatever it claims; pass 2 falls back to
   bare "@First" against whatever's left, so an already-claimed "@Ana Ramos"
   can't also accidentally match a separate "Ana Costa". */
function pmMentionScan(txt){
  const esc2=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const people=mentionablePessoas();
  const out=[], seen=new Set(); let work=txt;
  people.forEach(pe=>{
    const nome=(pe.nome||'').trim();
    if(!nome||!nome.includes(' ')||seen.has(pe.email))return;
    const re=new RegExp('@'+esc2(nome)+'\\b','ig');
    if(re.test(work)){ out.push({nome,email:pe.email}); seen.add(pe.email); work=work.replace(re,m=>' '.repeat(m.length)); }
  });
  people.forEach(pe=>{
    if(seen.has(pe.email))return;
    const nome=(pe.nome||'').trim();
    if(!nome)return;
    const first=nome.split(/\s+/)[0];
    const re=new RegExp('@'+esc2(first)+'\\b','i');
    if(re.test(work)){ out.push({nome,email:pe.email}); seen.add(pe.email); }
  });
  return out;
}
function pmTogglePessoa(email,nome){
  if(!EDIT)return;
  EDIT.envolvidos=EDIT.envolvidos||[];
  const i=EDIT.envolvidos.findIndex(x=>x.email===email);
  // Untagging always works — a PO-only person tagged before this rule existed
  // (or before their access was narrowed) has to stay removable.
  if(i>=0) EDIT.envolvidos.splice(i,1);
  else{
    if(isPoOnlyPessoa(pessoaByEmail(email))){ toast('PO-only agency logins can\'t be tagged — they have no project screens.'); return; }
    EDIT.envolvidos.push({email,nome});
  }
  renderProjModal();
}

}
/* Adds a person straight from a comment mention, WITHOUT the usual full

function pmTagFromMention(email,nome){

function pmPeopleFilter(q){

  }).join('');

/* Fire-and-forget email to whoever just got tagged — never blocks the UI or
   surfaces an error to the tagger. Edge function: notifica-marcacao.
   Sends the session's own token so the function can show the real author
   instead of trusting whatever `autor` the client claims. */
async function notifyMarcacao(to,projeto,comentario){
  if(!to||DEMO_MODE||READONLY)return;
  try{
    const {data:sPO}=await SBPO.auth.getSession();
    const token=sPO&&sPO.session&&sPO.session.access_token;
    if(!token)return;
    await fetch(PO_URL+'/functions/v1/notifica-marcacao',{method:'POST',headers:{'Content-Type':'application/json','apikey':PO_KEY,'Authorization':'Bearer '+token},
      body:JSON.stringify({to,autor:(currentUser&&currentUser.email)||'Alguém',projeto:projeto||'',comentario:comentario||null})});
  }catch(e){ console.warn('notifica-marcacao:',e); }
}
/* Queues a marcação e-mail instead of sending it right away — saveProj()
   flushes the queue after the project is actually persisted, so nobody gets
   an email about a tag or comment that a closed-without-saving modal threw
   away. One entry per person: a later comment replaces the plain "marcou
   você" tag with the actual text, so each person gets a single email. */
function pmQueueNotif(email,comentario){
  if(!email||!EDIT)return;
  EDIT._pendingNotifs=EDIT._pendingNotifs||{};
  if(comentario||!EDIT._pendingNotifs[email]) EDIT._pendingNotifs[email]=comentario||null;
}
function pmPickPerson(email,nome){
  const inp=document.getElementById('pmPeopleQ'); if(inp)inp.value='';
  const dd=document.getElementById('pmPeopleDD'); if(dd){dd.style.display='none';dd.innerHTML='';}
  pmTogglePessoa(email,nome);

/* Who a comment's "@" can reach — the project's own tagged people
   (EDIT.envolvidos), not the whole org roster. Adding someone new to the
   project still goes through "+ tag someone" (taggablePessoas(), unchanged);
   @mention in a comment now only reaches people already on that list. */
function mentionablePessoas(){
  if(!EDIT)return[];
  return (EDIT.envolvidos||[]).map(e=>{
    const pe=pessoaByEmail(e.email)||{};
    return {email:e.email,nome:e.nome||[pe.nome,pe.sobrenome].filter(Boolean).join(' ')||e.email,agencia:pe.agencia};
  });
}
/* Live "@" autocomplete inside the comment box — shows matches as you type
   so people who share a first name (Lucas's original complaint) can be told
   apart before you send, instead of the old blind free-text @FirstName. */
function pmMentionQuery(ta){
  const before=ta.value.slice(0,ta.selectionStart);
  const m=before.match(/@([^\s@]*)$/);
  return m?m[1]:null;
}
function pmMentionInput(ta){
  const dd=document.getElementById('pmMentionDD'); if(!dd)return;
  const q=pmMentionQuery(ta);
  if(q===null){ dd.style.display='none'; dd.innerHTML=''; return; }
  const ql=q.toLowerCase();
  const matches=mentionablePessoas().filter(pe=>(pe.nome||'').toLowerCase().includes(ql)).slice(0,8);
  if(!matches.length){ dd.style.display='none'; dd.innerHTML=''; return; }

function pmDateCls(item,list){
  if(!item.fim) return 'empty';
  if(item.done) return '';
  if(depConflict(list,item)) return 'warn';
  const dd=daysTo(item.fim);
  if(dd!==null&&dd<0) return 'late';
  return '';
}
function pmDepCellHTML(tid,sid,item,list,EDA){
  const deps=(item.dep||[]).filter(id=>list.some(x=>x.id===id));
  const bad=depConflict(list,item);

  const chips=deps.map(id=>{
    const ix=list.findIndex(x=>x.id===id);
    const d=list[ix];
    const lbl=String(ix+1).padStart(2,'0');
    const t=`Starts after "${(d&&d.n)||'?'}"${d&&d.fim?' (due '+fmtDate(d.fim)+')':''}${EDA?' — click to unlink':''}`;
    return `<button class="dep-chip${bad?' warn':''}" title="${esc(t)}" onclick="event.stopPropagation();${EDA?`pmDepToggle('${escJs(tid)}',${sid?"'"+esc(sid)+"'":'null'},'${escJs(id)}')`:''}">${lbl}${bad?' !':''}</button>`;
  }).join('');
  const add=EDA?`<button class="dep-add" id="depBtn-${esc(key)}" title="Link to a predecessor" onclick="pmDepPop('${escJs(tid)}',${sid?"'"+esc(sid)+"'":'null'},event)">+</button>`:'';

   Ao solicitar uma PO de Fee, o valor total é dividido pelos percentuais

function feeSplitGroups(){

  (DATA.fee||[]).forEach(f=>{ if(!f.agencia||!f.categoria)return; (byAg[f.agencia]=byAg[f.agencia]||[]).push(f); });

    });
    if(splits.length && splits.every(s=>s.fund_id)) out.push({agencia:ag, splits});
  });
  return out;

/* ============================================================
   SPENDING FREEZE (fundo inteiro)
   ------------------------------------------------------------
   Freezing a fund stops new POs against every month of it at once, without
   claiming the money was withdrawn — the budget stays exactly as approved.
   It is deliberately NOT a cut: taking budget back is now recorded per
   month, with an amount and a reason, by the corte fields on tetos (see
   "CORTE POR MÊS" above). A fund-level cut used to say "some of this is
   gone" while being unable to say how much or from which month, which is
   the gap that feature closes.

   The freeze bites: a blocked fund can't have new POs requested against it.
   A freeze that only changes a colour is decoration.
   ============================================================ */
const RESTR_META={
  BLOQUEADA:{t:'Spending blocked',short:'Blocked',c:'var(--amber)',bg:'var(--amber-bg)',bd:'rgba(255,176,32,.3)',icon:'lock'}
};
function fundRestr(p){ return (p&&RESTR_META[p.restricao])?p.restricao:null; }
/* An archived fund is one that was retired with spend already on it. It keeps
   its POs — that is the point: the money it really spent stays charged to the
   category — while the balance it never used was released back. It takes no
   new spending and offers itself for nothing. */
function fundArquivado(p){ return !!p && p.ativo===false; }
/* What archiving (or deleting) would hand back: for every month, whatever the
   effective cap still has above what is already committed against it. Mirrors
   arquivar_fund() in the database, so the number in the confirmation is the
   number that actually moves. */
function fundSaldoLiberavel(pid){
  let tot=0;
  Object.keys(fundMonthlyTotals(pid)).forEach(m=>{
    const cap=fundMonthCap(pid,m);
    const comprometido=(DATA.pos||[]).filter(po=>po.fund_id===pid&&String(po.competencia).slice(0,7)===m&&!['REJEITADA','CANCELADA'].includes(po.status)).reduce((s,po)=>s+(+po.valor||0),0);
    if(cap>comprometido) tot+=cap-comprometido;
  });
  return r2(tot);
}

async function reqLoadMeses(){

function reqLoadMesesSplit(){
  const group=feeSplitGroups().find(g=>g.agencia===REQ.splitAg); if(!group)return;
  let comps=null;
  group.splits.forEach(s=>{ const set=new Set(projMonths(s.fund_id).map(m=>m.competencia)); comps=comps?new Set([...comps].filter(c=>set.has(c))):set; });
  REQ.meses=[...(comps||[])].sort().map(competencia=>({competencia}));
  REQ.competencia=REQ.meses[0]?REQ.meses[0].competencia:'';
  renderReqPO();

function reqSet(k,v){
  if(!REQ)return;
  if(k==='fund_id'){
    if(String(v).startsWith('FEE::')){ REQ.mode='split'; REQ.splitAg=v.slice(5); REQ.fund_id=v; reqLoadMesesSplit(); }
    else { REQ.mode='single'; REQ.fund_id=v; reqLoadMeses(); }
    return;
  }
  REQ[k]=v;
  if(k==='competencia'&&REQ.mode==='split'){ renderReqPO(); return; }
  renderReqPO();
}
function reqSplitBreakdown(){
  const group=feeSplitGroups().find(g=>g.agencia===REQ.splitAg); if(!group)return [];
  const total=+REQ.valor||0; const comp=REQ.competencia;
  let running=0;
  return group.splits.map((s,i)=>{
    let valor=r2(total*s.percentual);
    if(i===group.splits.length-1) valor=r2(total-running); else running+=valor;
    const teto=comp?(projMonths(s.fund_id).find(m=>m.competencia===comp)||{}).teto||0:0;
    const cons=comp?consumoMes(s.fund_id,comp):0;
    const saldo=teto-cons-valor;
    return {...s,valor,teto,cons,saldo};
  });
}

/* Retiring a fund must not hand the category back money the fund actually
   spent. Deleting one did exactly that: the POs went with it and the cascade
   took the monthly caps, so the budget recovered the FULL cap — including the
   part already consumed — and the year's spend vanished from the record.

   So the two cases are now told apart. A fund that never had a PO has nothing
   to preserve: it is deleted, and its whole cap goes back. A fund that has
   spent is archived instead — its POs stay, and stay charged to the category,
   while every month's cap is pulled down to what is already committed. What
   comes back is exactly the unused balance, recorded as a cut with a reason,
   so it shows up in the same places every other released amount does. */
async function deletarFund(id){
  if(viewOnly()){toast(roMsg());return;}
  if(PAPEL!=='admin'){ toast('Only admin can delete.'); return; }
  const p=fundAnyById(id)||{};
  const nPos=DATA.pos.filter(x=>x.fund_id===id&&!['REJEITADA','CANCELADA'].includes(x.status)).length;
  const orc=(DATA.orcamentos||[]).find(o=>o.id===p.orcamento_id);
  const destino=orc?`the "${orc.nome||orc.product_category}" budget`:'the budget';
  try{
    if(nPos){
      const saldo=fundSaldoLiberavel(id);
      if(!confirm(`Archive fund "${p.nome||''}"?\n\nIt has ${nPos} PO(s), so it is archived rather than deleted — the POs and everything they consumed stay on record, and stay charged to ${destino}.\n\n${BRL(saldo)} of unused balance goes back to ${destino} and can be allocated elsewhere.\n\nThe fund takes no new POs after this.`))return;
      const {data,error}=await SBPO.rpc('arquivar_fund',{p_fund:id,p_motivo:'Saldo devolvido ao orçamento ao arquivar o fund'});
      if(error)throw error;
      FUNDEDIT=null; closeModal(); await reloadPOAll(); goCostCenter();
      toast(`Fund archived — ${BRL(+data||0)} returned to ${destino}.`);
    }else{
      const cap=Object.values(fundMonthlyTotals(id)).reduce((s,v)=>s+v,0);

async function deletarOrcamento(id){

/* ============================================================
   CAMPANHAS — grouping layer above Fund. A campanha bundles one or more
   funds (DATA.poProjetos, via funds.campanha_id) under a name/budget/owner,
   whose categories are read back off those funds. Nothing here
   changes how a Fund itself is stored or rendered — it only adds an
   optional parent and a screen that rolls several funds up into one card.
   ============================================================ */
// Remembered like FUND_VIEW, so switching screens and coming back keeps the view.
// Defaults to the timeline view — Budget-Timeline.dc.html's own tab shows
// the gantt first, with List/By-category as the secondary switch inside it.
let CAMPANHA_VIEW=(function(){try{return localStorage.getItem('campanha_view')||'tl';}catch(e){return 'tl';}})();
function campanhaSetView(v){ CAMPANHA_VIEW=v; try{localStorage.setItem('campanha_view',v);}catch(e){} go('campanhas'); }
function campStatusMeta(s){
  return ({planejada:{t:'Planned',c:'s-blue'},ativa:{t:'Active',c:'s-green'},encerrada:{t:'Closed',c:'s-slate'}})[s]||{t:s||'—',c:'s-slate'};
}
/* Categories are read off the linked funds rather than stored on the
   campanha: the fund already carries product_category (and the budget that
   funds it), so a second hand-kept copy here could only ever drift out of
   step with what the funds actually say. */
function campCategorias(campId){
  const s=new Set();
  campFunds(campId).forEach(f=>{ const c=String(f.product_category||'').trim(); if(c)s.add(c); });
  return [...s].sort();
}
/* Agency scoping lives here, in the one place every campanha figure is
   derived from: an agency profile sees a campanha only through the funds
   that are its own, so cap/used, categories, the month split and the fund
   list underneath all narrow together instead of one of them leaking the
   campaign's full budget. Same client-side rule the Funds/POs screens use
   (effPapel/effAgencia, so "View as agency" simulates it too) — not a
   security boundary, RLS is; see the Work-module note in visProjs(). */
function campScoped(list){
  return (effPapel()==='agencia'&&effAgencia())?list.filter(p=>p.agencia===effAgencia()):list;
}
function campFunds(campId){
  return campScoped((DATA.poProjetos||[]).filter(p=>p.campanha_id===campId));
}
/* Campaigns an agency has anything in: one with no fund of theirs would be an
   empty card showing someone else's plan, so it drops off the list entirely. */
function visCampanhas(){
  const list=(DATA.campanhas||[]).slice();
  return (effPapel()==='agencia'&&effAgencia())?list.filter(c=>campFunds(c.id).length):list;
}
/* Same cap/consumed/committed aggregation renderFunds() does per-fund
   (tetos + rateio_alocacao for the cap, pos by status for spend), just
   summed across every fund that belongs to this campanha instead of one. */
function campTotals(campId){
  const ids=new Set(campFunds(campId).map(p=>p.id));
  let teto=0,cons=0,comp=0,pend=0;
  DATA.tetos.forEach(t=>{ if(ids.has(t.fund_id)) teto+=(+t.teto||0); });
  DATA.rateio.forEach(r=>{ if(ids.has(r.fund_id)) teto+=(+r.valor||0); });
  DATA.pos.forEach(po=>{ if(!ids.has(po.fund_id))return; const v=+po.valor||0;
    if(CONS.includes(po.status))cons+=v; else if(COMP.includes(po.status))comp+=v; else if(PEND.includes(po.status))pend+=v; });
  return {teto,cons,comp,pend};
}
/* Same three buckets as campTotals, kept per fund so the detail view can
   show each fund's own figures without recomputing the split twice. */
function campFundStats(funds){
  const ids=new Set(funds.map(f=>f.id));
  const cap={},cons={},comp={},pend={};
  DATA.tetos.forEach(t=>{ if(ids.has(t.fund_id)) cap[t.fund_id]=(cap[t.fund_id]||0)+(+t.teto||0); });
  DATA.rateio.forEach(r=>{ if(ids.has(r.fund_id)) cap[r.fund_id]=(cap[r.fund_id]||0)+(+r.valor||0); });
  DATA.pos.forEach(po=>{ if(!ids.has(po.fund_id))return; const v=+po.valor||0;
    if(CONS.includes(po.status)) cons[po.fund_id]=(cons[po.fund_id]||0)+v;
    else if(COMP.includes(po.status)) comp[po.fund_id]=(comp[po.fund_id]||0)+v;
    else if(PEND.includes(po.status)) pend[po.fund_id]=(pend[po.fund_id]||0)+v; });
  return {cap,cons,comp,pend};
}
/* Monthly split of a campanha's budget: its funds' monthly caps summed, and
   what each month has actually taken. Same two numbers per month the fund
   timeline plots, one level up — a campanha has no monthly cap of its own,
   it is whatever its funds were given for that month. */
function campMonthlyTotals(campId){
  const m={};
  campFunds(campId).forEach(f=>{ const mt=fundMonthlyTotals(f.id); Object.keys(mt).forEach(k=>{ m[k]=(m[k]||0)+mt[k]; }); });
  return m;
}
function campMonthUsed(campId,mm){
  return campFunds(campId).reduce((s,f)=>s+fundMonthUsed(f.id,mm),0);
}
/* One month cell, shared by the Campaigns timeline and the month strip in the
   campaign detail so the two never drift apart. Track = configured for the
   month, fill = used against it. Colour weight follows TIME, not size: a
   closed month is settled history and stays washed out, the current month and
   everything ahead carry full colour — those are the ones still actionable.
   Over-cap keeps its red in closed months, only a notch weaker. */
function campMonthCellHTML(mm,cfg,used,o){
  const nowM=new Date().toISOString().slice(0,7);
  const {maxVal=1,first='',last='',col='var(--po)',showFigures=true}=o||{};
  const inSpan=(!first||mm>=first)&&(!last||mm<=last);
  const isNow=mm===nowM, past=mm<nowM, over=used>cfg+0.5;
  const rl=mm===first?'5px':'0', rr=mm===last?'5px':'0';
  const trackBg=cfg?col:(inSpan?'var(--line-2)':'transparent');
  const trackOp=cfg?(past?0.08+0.10*cfg/maxVal:0.60+0.30*cfg/maxVal):(past?0.4:1);
  const fillPct=cfg?Math.min(100,used/cfg*100):(used?100:0);
  const fillOp=past?(over?0.75:0.26):1;
  const cut=+(o&&o.cut)||0;
  const tip=`${fmtMes(mm+'-01')} · configured ${cfg?BRL(cfg):'—'} · used ${used?BRL(used):'—'}${cfg?' · balance '+BRL(cfg-used):''}${over?' · over cap':''}${cut?' · '+BRL(cut)+' cut from this month (approved '+BRL(cfg+cut)+')':''}`;
  return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-right:1px solid #f2f3f7;padding:3px 1px;background:${isNow?'rgba(18,115,207,.09)':'transparent'}${cut?';box-shadow:inset 0 -2px 0 var(--po)':''}" title="${esc(tip)}">
    <span style="display:block;position:relative;width:100%;height:14px;border-radius:${rl} ${rr} ${rr} ${rl};overflow:hidden">
      <span style="position:absolute;inset:0;background:${trackBg};opacity:${trackOp.toFixed(2)}"></span>
      ${(cfg||used)?`<span style="position:absolute;left:0;top:0;bottom:0;width:${fillPct.toFixed(1)}%;background:${over?'var(--po)':col};opacity:${fillOp}"></span>`:''}
    </span>
    ${(showFigures&&(cfg||used))?`<span class="mono" style="font-size:8px;font-weight:600;color:${past?'var(--txt-3)':'var(--txt-3)'};line-height:1.15;white-space:nowrap">${cfg?fmtCompactBRL(cfg):'—'}</span>
    <span class="mono" style="font-size:8px;font-weight:800;color:${over?'var(--po)':(past?'var(--txt-3)':'var(--txt-2)')};line-height:1.15;white-space:nowrap">${used?fmtCompactBRL(used):'—'}</span>`:''}
  </div>`;
}
/* Month axis covering every month the given campanhas touch, gaps included —
   an empty month between two funded ones is information, not something to
   skip. Capped at 36 columns, past which the row stops being readable. */
function campMonthAxis(mtList){
  const all=[...new Set(mtList.flatMap(mt=>Object.keys(mt)))].sort();
  if(!all.length) return [];
  const axis=[]; let cm=all[0]; const endM=all[all.length-1];
  while(cm<=endM&&axis.length<36){ axis.push(cm); const y=+cm.slice(0,4), mo=+cm.slice(5,7); cm=mo===12?(y+1)+'-01':cm.slice(0,4)+'-'+String(mo+1).padStart(2,'0'); }
  return axis;
}

/* Headline numbers for the Campaigns screen. Three things this screen was

function campanhasKpisHTML(list){
  let teto=0,cons=0,comp=0,pend=0;
  let closedN=0, closedSaldo=0;
  list.forEach(c=>{
    const t=campTotals(c.id);
    teto+=t.teto; cons+=t.cons; comp+=t.comp; pend+=t.pend;
    if(c.status==='encerrada'){
      const saldo=t.teto-(t.cons+t.comp+t.pend);
      if(saldo>0.5){ closedN++; closedSaldo+=saldo; }
    }
  });
  const soltos=campScoped((DATA.poProjetos||[]).filter(p=>!p.campanha_id&&p.aprovacao_status==='APROVADO'));
  const ids=new Set(soltos.map(p=>p.id));
  let soltosTeto=0;
  DATA.tetos.forEach(t=>{ if(ids.has(t.fund_id)) soltosTeto+=(+t.teto||0); });
  DATA.rateio.forEach(r=>{ if(ids.has(r.fund_id)) soltosTeto+=(+r.valor||0); });
  const usado=cons+comp+pend;
  const pct=teto?usado/teto*100:0, over=pct>100.5, near=!over&&pct>=90;

  return `<div style="margin-bottom:18px">

      ${(function(){ if(!canSeeCorte())return '';
        const c=list.reduce((s,ca)=>s+cutTotalOf(campFunds(ca.id)),0);
        return c>0.005?stat('Cut',BRLc(c),'#ff3b4e','already out of the figure to the left','Budget taken back from specific months of these campaigns\' funds'):''; })()}
      ${stat('Consumed',BRLc(cons),'#4d7dff',`${Math.round(pct)}% of the cap committed`,'Consumed POs only — the % also counts committed and awaiting-approval')}
      ${stat('Committed',BRLc(comp),'#a685ff',pend?`+ ${BRL(pend)} awaiting approval`:'')}
      ${stat('Closed with balance',BRLc(closedSaldo),'#ffb020',`${closedN} closed campaign${closedN===1?'':'s'} still holding budget`,'Campaigns marked Closed whose cap was never fully spent')}
      ${stat('Funds with no campaign',BRLc(soltosTeto),'#9aa3b8',`${soltos.length} fund${soltos.length===1?'':'s'} ungrouped${soltos.length?' · click to see them':''}`,'Approved funds carrying no campanha_id — not counted in the totals to the left',soltos.length?'openUngroupedFunds()':'')}
    </div>
    ${(over||near)?`<div style="font-size:11.5px;color:${over?'var(--red)':'var(--amber)'};font-weight:600;margin-top:7px">Campaigns are at ${Math.round(pct)}% of their combined cap.</div>`:''}
  </div>`;
}

async function submitCampanha(){
  if(viewOnly()){toast(roMsg());return;}
  if(!CAMPEDIT)return; const ce=CAMPEDIT;
  if(!ce.nome.trim()){ toast('Give the campaign a name.'); return; }
  try{
    let campId=ce.id;
    const campos={nome:ce.nome.trim(),responsavel:ce.responsavel||null,status:ce.status};
    if(campId){
      const {error}=await SBPO.from('campanhas').update(campos).eq('id',campId);
      if(error)throw error;
    }else{
      const {data,error}=await SBPO.from('campanhas').insert(campos).select().single();
      if(error)throw error;
      campId=data.id;
    }
    // Link/unlink funds to match the picker: anything checked gets campanha_id
    // set to this campanha; anything that was linked here but got unchecked
    // (including funds reassigned away in this same edit) gets nulled out.
    const toLink=ce.funds;
    const toUnlink=(DATA.poProjetos||[]).filter(f=>f.campanha_id===campId&&!toLink.includes(f.id)).map(f=>f.id);
    if(toLink.length){
      const {error:e3}=await SBPO.from('funds').update({campanha_id:campId}).in('id',toLink);
      if(e3)throw e3;
    }
    if(toUnlink.length){
      const {error:e4}=await SBPO.from('funds').update({campanha_id:null}).in('id',toUnlink);
      if(e4)throw e4;
    }
    await reloadPOAll(); toastSaved();
  }catch(e){ toastErr(e); }
}
async function deletarCampanha(id){
  if(viewOnly()){toast(roMsg());return;}
  if(PAPEL!=='admin'){ toast('Only admin can delete.'); return; }
  const c=(DATA.campanhas||[]).find(x=>x.id===id)||{};
  const nFunds=campFunds(id).length;
  if(nFunds){ toast(`Remova o vínculo dos ${nFunds} fund(s) antes de excluir "${c.nome||''}".`); return; }
  if(!confirm('Delete campaign "'+(c.nome||'')+'"?\n\nThis cannot be undone.'))return;
  try{
    const {error}=await SBPO.from('campanhas').delete().eq('id',id);
    if(error)throw error;
    CAMPEDIT=null; closeModal(); await reloadPOAll(); go('campanhas'); toast('Campaign deleted.');
  }catch(e){ toastErr(e); }
}

/* ============================================================
   TELAS ADICIONAIS (espelham o protótipo aprovado)
   ============================================================ */
let TL_HILITE=null; // highlighted week index, or null — click a week header to toggle
function tlToggleWeek(w){ TL_HILITE=(TL_HILITE===w)?null:w; go(SCREEN); }
/* Windowed navigation — TL_OFF is a week offset from "one week before today's
   week" (so Today lands near the left edge with a little past context);
   TL_FIT=true restores the original fit-everything scale. Week indices shift
   when the window moves, so any highlighted column is cleared on navigation. */
let TL_FIT=false, TL_OFF=0; const TL_SPAN=10;
function tlNav(d){ if(d===0)TL_OFF=0; else TL_OFF+=d; TL_FIT=false; TL_HILITE=null; go(SCREEN); }
function tlFitToggle(){ TL_FIT=!TL_FIT; TL_HILITE=null; go(SCREEN); }
let TL_EXPANDED={}; // project id -> inline activities-timeline dropdown open?
function tlToggleProjRow(pid){ TL_EXPANDED[pid]=!TL_EXPANDED[pid]; go(SCREEN); }
/* Jump the Timeline's navigable window back to a specific date — used by the
   "◀ {date}" labels shown when a project/activity's bar sits entirely before
   the current window. Places that date about a week in from the left edge
   (same convention as the default "today" window) instead of flush at 0. */
function tlJumpTo(dateStr){
  if(!dateStr)return;
  const d=new Date(dateStr+'T00:00:00');
  const tdy=today0();
  const base=new Date(tdy); base.setDate(base.getDate()-base.getDay()-7);
  const dWeekStart=new Date(d); dWeekStart.setDate(dWeekStart.getDate()-dWeekStart.getDay());
  TL_OFF=Math.round((dWeekStart-base)/(7*864e5))-1;
  TL_FIT=false; TL_HILITE=null; go(SCREEN);
}
/* Gantt-style, not a plain list — each activity gets its own bar positioned
   on the SAME week scale (min/dayPct) as the parent project row above it, so
   the bars line up under the shared week header instead of needing one of
   their own. An activity's own start date is used when it has one; the old
   chain-from-the-previous-due-date approximation is now only the fallback,
   for activities that were created before start dates existed. */
function tlProjActivitiesHTML(p,min,dayPct,weeks){
  const tasks=(p.tasks||[]).slice().sort((a,b)=>String(a.inicio||a.fim||'9999').localeCompare(String(b.inicio||b.fim||'9999')));
  if(!tasks.length) return '<div style="font-size:12px;color:var(--txt-3);padding:8px 16px 8px 45px">No activities.</div>';
  const winEnd=new Date(min); winEnd.setDate(winEnd.getDate()+(weeks||1)*7);
  let prevEnd=projEffStart(p);
  return tasks.map(t=>{
    const st=statusOf(t.status), hp=healthPill(t.status);
    const endStr=t.fim||t.inicio||prevEnd;
    const startStr=t.inicio||prevEnd;
    const s=new Date((startStr<=endStr?startStr:endStr)+'T00:00:00'), e=new Date(endStr+'T00:00:00');
    prevEnd=endStr;
    let bar;
    if(e<min){
      bar=t.fim?`<span onclick="tlJumpTo('${escJs(t.fim)}')" title="Jump the timeline back to this date" style="position:absolute;left:8px;top:9px;font-size:9.5px;font-weight:700;color:var(--txt-3);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px">◀ ${fmtDate(t.fim)}</span>`
        :`<span style="position:absolute;left:8px;top:9px;font-size:9.5px;font-weight:700;color:var(--txt-3)">◀ —</span>`;
    }else if(s>=winEnd){
      bar=`<span style="position:absolute;right:8px;top:9px;font-size:9.5px;font-weight:700;color:var(--txt-3)">${t.fim?fmtDate(t.fim):'—'} ▶</span>`;
    }else{
      const left=Math.max(0,((s-min)/864e5)*dayPct);
      const rawR=(((e-min)/864e5)+1)*dayPct;
      const width=Math.min(Math.max(dayPct*1.3,Math.min(rawR,100)-left),100-left);
      bar=`<div title="${esc(t.n)} · ${t.fim?fmtDate(t.fim):'no due date'} · ${t.pct||0}%" style="position:absolute;left:${left}%;width:${width}%;top:6px;height:18px;border-radius:5px;background:${hp.dot};display:flex;align-items:center;padding:0 7px;overflow:hidden">
          <span style="font-size:9px;font-weight:700;color:#fff;white-space:nowrap">${t.pct||0}%</span>
        </div>`;
    }
    return `<div style="display:flex;align-items:center;border-bottom:1px dashed var(--line-2)">
      <div style="width:230px;flex-shrink:0;padding:7px 16px 7px 45px;border-right:1px solid var(--line);min-width:0;display:flex;align-items:center;gap:7px">
        <span class="badge ${st.cls}" style="flex-shrink:0;font-size:9px;padding:1px 6px"><span class="d"></span>${st.name}</span>
        <span style="flex:1;min-width:0;font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.n)}</span>
      </div>
      <div style="flex:1;position:relative;height:32px">${bar}</div>
    </div>`;
  }).join('');
}
function renderTimeline(){
  const list=projList().filter(p=>p.prazo).slice();
  if(!list.length)return '<div class="empty">No projects with a due date.</div>';
  // range de semanas — fit-all (escala original) ou janela navegável de TL_SPAN semanas
  const dates=[]; list.forEach(p=>{dates.push(new Date(projEffStart(p)+'T00:00:00'));if(p.prazo)dates.push(new Date(p.prazo+'T00:00:00'));});
  const tdy=today0();
  let min,weeks;
  if(TL_FIT){
    min=new Date(Math.min(...dates)); const max=new Date(Math.max(...dates));
    min.setDate(min.getDate()-min.getDay()); // início da semana
    const totalDays=Math.max(7,Math.round((max-min)/864e5)+7);
    weeks=Math.ceil(totalDays/7);
  }else{
    min=new Date(tdy); min.setDate(min.getDate()-min.getDay()-7+TL_OFF*7);
    weeks=TL_SPAN;
  }
  const dayPct=100/(weeks*7);
  const winEnd=new Date(min); winEnd.setDate(winEnd.getDate()+weeks*7);
  const MM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ranges=list.map(p=>({p,s:new Date(projEffStart(p)+'T00:00:00'),e:new Date(p.prazo+'T00:00:00')}));
  // highlight stripe for the selected week — same left/width math as a header cell, drawn behind the bars/header text
  const hiliteStripe=TL_HILITE!=null?`<div style="position:absolute;top:0;bottom:0;left:${TL_HILITE/weeks*100}%;width:${100/weeks}%;background:rgba(214,138,4,.12);pointer-events:none"></div>`:'';
  let wkHead=''; const wkTotals=[];
  for(let w=0;w<weeks;w++){

  const rows=list.sort((a,b)=>new Date(projEffStart(a)+'T00:00:00')-new Date(projEffStart(b)+'T00:00:00')).map(p=>{
    const stg=stageOf(p.etapa); const pr=computeProg(p);
