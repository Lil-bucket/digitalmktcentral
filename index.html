      bar=`<span onclick="event.stopPropagation();tlJumpTo('${escJs(p.prazo)}')" title="Jump the timeline back to this date" style="position:absolute;left:8px;top:15px;font-size:10px;font-weight:700;color:var(--txt-3);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px">◀ ended ${fmtDate(p.prazo)}</span>`;
    }else if(s>=winEnd){
      bar=`<span style="position:absolute;right:8px;top:15px;font-size:10px;font-weight:700;color:var(--txt-3)">starts ${fmtDate(projEffStart(p))} ▶</span>`;
    }else{
      const left=Math.max(0,((s-min)/864e5)*dayPct);
      const rawR=(((e-min)/864e5)+1)*dayPct;
      const width=Math.max(dayPct*2,Math.min(rawR,100)-left);
      bar=`<div style="position:absolute;left:${left}%;width:${Math.min(width,100-left)}%;top:11px;height:24px;border-radius:7px;background:${stg.color};box-shadow:0 3px 8px -3px rgba(0,0,0,.3);display:flex;align-items:center;padding:0 9px;overflow:hidden"><span style="font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap">${pr}%</span></div>`;
    }
    const open=!!TL_EXPANDED[p.id];
    return `<div>
    <div onclick="tlToggleProjRow('${escJs(p.id)}')" style="display:flex;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;background:${open?'var(--paper-2)':''}">
      <div style="width:230px;flex-shrink:0;padding:11px 16px;border-right:1px solid var(--line);min-width:0;display:flex;align-items:center;gap:7px">
        <span style="color:var(--txt-3);display:flex;flex-shrink:0;transform:rotate(${open?'0deg':'-90deg'});transition:transform .15s">${icn('chev',11)}</span>

/* ============================================================
   COST CENTER / ACCOUNT — single aggregation, three consumers
   ------------------------------------------------------------
   The on-screen table, the per-cell drill-down and the Excel export all
   read ccAggregate(). It used to be copy-pasted between the renderer and
   the exporter, which is exactly the kind of duplication that lets a
   number on screen quietly disagree with the same number in the download.

   Besides the budget/consumption totals it keeps `det` — the individual PO
   slices behind every (account, month) consumption figure. For a rateio
   fund a single PO lands on several accounts, so each slice carries the
   ratio it was split by and the resulting share, and the shares of one cell
   always add back up to that cell's consumption.
   ============================================================ */
const CC_CONS_ST=['FATURADA','VALIDADA','CONCLUIDA','APROVADA','PO_GERADA','ATUALIZAR_INFO'];
let CC_VIEW={accRows:[],monthList:[]};
/* Matriz (LABG) is both a product category and a cost center of its own, and
   it isn't one of the product lines — the Overview already carries a scope
   that takes it out (BO_SCOPE). Here it drives two things: it sinks to the
   bottom of the exported sheets (ranking, not filtering — every row is still
   there and no total moves), and it's what the "Excl. LABG" scope removes. */
const CC_LABG='LABG';
const CC_LABG_CC='1109123033';
const CC_TAIL=[CC_LABG_CC];
/* TV's "Product Campaign ()" account line is shared, verbatim, by every TV
   campaign fund (World Cup, SQD Mini LED) — the Cost center table groups by
   literal account_desc, so they collapse into one merged row with no way to
   tell them apart. Lucas wants those three shown as separate rows, but
   without touching the funds' real classification (the Monitor one is
   filed under "KOL - Influencers (TV)", not Product Campaign, on purpose)
   — so this only overrides the DISPLAY/GROUPING description used by
   ccAggregate for these three specific funds, never the stored fund data. */
const CC_TV_CAMP_OVERRIDE={
  'b11cd672-be02-4a38-a87d-5404a72bb215':'Product Campaign World Cup (TV)',
  'b3c2664c-050c-4184-be64-591f4f8ae5f8':'Product Campaign SQD Mini LED (TV)'
};
const CC_TV_MONITOR_FUND_ID='2fbd3e9f-8683-473e-b127-9038a43c8f11';
/* Same pattern as the TV Monitor fund above: AC's "Instaladores" fund is
   filed under the shared "KOL - Influencers (AC)" line, so it was merged
   into that account's total with no way to see it separately. Rerouted
   (not duplicated) into its own "Installer KOLs (AC)" row. */
const CC_AC_INSTALLER_FUND_ID='03b85ddf-554d-4af0-bc30-414ed717f9b8';
function ccEffDesc(p){
  if(p.id===CC_TV_MONITOR_FUND_ID) return 'Product Campaign Monitor (TV)';
  if(p.id===CC_AC_INSTALLER_FUND_ID) return 'Installer KOLs (AC)';
  if(p.account_desc==='Product Campaign ()'&&CC_TV_CAMP_OVERRIDE[p.campanha_id]) return CC_TV_CAMP_OVERRIDE[p.campanha_id];
  return p.account_desc;
}
/* Row order of the Extrato: cost center, then account, then line, in the
   sequence the finance sheet uses. It is NOT sortable-by-value order — TV
   lists account 32202169 before 32202171 and AC does the reverse — so it can
   only come from the maintained list, not from comparing fields.

   The list is the `extrato_layout` table (column `ord`), loaded with the rest
   of the budget data — reorder the Extrato there and the table and both Excel
   sheets follow on the next load, no deploy. CC_LAYOUT below is only the
   fallback for when that read comes back empty (the table is readable by
   marketing/finance/admin), so the ordering degrades to "slightly stale"
   instead of "alphabetical soup". Keep it roughly in step; the database
   wins whenever it answers. */
const CC_LAYOUT=[
  ['1109123014','32202169','FEE -  (TV)'],
  ['1109123014','32202169','Shutterstock Images for agency'],
  ['1109123014','32202169','Fee KOL (TV)'],
  ['1109123014','32202171','KOL - Influencers (TV)'],
  ['1109123014','32202171','Always on (media and production) (TV)'],
  ['1109123014','32202171','Product Campaign World Cup (TV)'],
  ['1109123014','32202171','Product Campaign SQD Mini LED (TV)'],
  ['1109123014','32202171','Product Campaign Monitor (TV)'],
  ['1406122014','32202171','KOL - Influencers (AC)'],
  ['1406122014','32202171','Installer KOLs (AC)'],
  ['1406122014','32202171','Always on (media and production) (AC)'],
  ['1406122014','32202169','FEE -  (AC)'],
  ['1406122014','32202169','Fee KOL (AC)'],
  ['1607122049','32202169','FEE -  (MOB)'],
  ['1603122014','32202171','KOL - Influencers (WG)'],
  ['1109123014','32202171','Live Commerce (TV)']
];
/* Descriptions drift between the layout and what funds actually carry —
   "Always on (media and production)" vs "…(TV)", "SQD Mini LED" vs
   "SQD Miniled". Comparing on letters and digits only, minus a trailing
   category tag, matches those without hand-maintaining aliases. */
const ccNormDesc=s=>String(s||'').toLowerCase()
  .replace(/\s*\((?:tv|ac|mob|ref|wg|labg)\)\s*$/,'')
  .replace(/[^a-z0-9]/g,'');
let _ccLayoutIx=null,_ccLayoutSrc=null;
function ccLayoutIndex(){
  // Memoised against the loaded rows themselves, so a refresh that brings a
  // reordered Extrato rebuilds the index and a repaint that doesn't, doesn't.
  const src=(DATA.ccLayout&&DATA.ccLayout.length)?DATA.ccLayout:null;
  if(_ccLayoutIx&&_ccLayoutSrc===src) return _ccLayoutIx;
  const rows=src?src.map(r=>[r.cc||'',r.account||'',r.account_desc||'']):CC_LAYOUT;
  const exact={},byAcc={},byCc={};
  rows.forEach(([cc,acc,desc],i)=>{
    exact[cc+'|'+acc+'|'+ccNormDesc(desc)]=i;
    byAcc[cc+'|'+acc]=i; // last wins → the end of that account's block
    byCc[cc]=i;          // last wins → the end of that cost center's rows
  });
  _ccLayoutSrc=src;
  return (_ccLayoutIx={exact,byAcc,byCc,len:rows.length});
}
/* Graded match, so a line the layout doesn't know still lands in a sensible
   place instead of at the bottom: exact line → end of its account block →
   end of its cost center → after everything listed. */
function ccLayoutRank(a){
  const ix=ccLayoutIndex(), cc=String(a.cc||'').trim(), acc=String(a.acc||'').trim();
  const e=ix.exact[cc+'|'+acc+'|'+ccNormDesc(a.desc)];
  if(e!=null) return e;
  const g=ix.byAcc[cc+'|'+acc];
  if(g!=null) return g+0.5;
  const c=ix.byCc[cc];
  if(c!=null) return c+0.6;
  return ix.len+1;
}
const ccTailRank=a=>(a&&a.isLabg)?1:0;
/* Table filter. Unlike hiding rows in the DOM, this is applied inside the
   aggregation, so every number downstream — monthly figures, row totals, the
   grand total row, the drill-down and both Excel sheets — is recomputed from
   only the contributions that survive the filter. */
let CC_FILTER={scope:(function(){try{return localStorage.getItem('labg_scope')==='nolabg'?'nolabg':'all';}catch(e){return 'all';}})(),cat:''};
function ccFilterOn(){ return CC_FILTER.scope!=='all'||!!CC_FILTER.cat; }
function ccSetScope(s){
  // Same state as every other Budget screen's LABG view (setLabgScope also
  // drops a "Category: LABG" filter that would empty the table).
  setLabgScope(s);
}
function ccSetCat(c){ CC_FILTER.cat=c; go(SCREEN); }
function ccFilterLabel(){
  const b=[];
  if(CC_FILTER.scope==='nolabg') b.push('Matriz (LABG) excluded');
  if(CC_FILTER.cat) b.push(esc(catKeyLabel(CC_FILTER.cat))+' only');
  return b.join(' · ');
}
/* Categories that actually appear in the data, in the canonical product order,
   so the picker never offers a category with nothing behind it. */
function ccCategories(){
  const s=new Set();
  (DATA.poProjetos||[]).filter(p=>p.aprovacao_status==='APROVADO'&&!p.rateio&&p.product_category).forEach(p=>s.add(p.product_category));
  (DATA.rateio||[]).forEach(r=>r.categoria&&s.add(r.categoria));
  const seen=Array.from(s);
  return PRODUCT_CATS.filter(c=>seen.includes(c)).concat(seen.filter(c=>!PRODUCT_CATS.includes(c)).sort());
}
/* Colour for a cost-center row's category. a.cat is the joined form when two
   categories share an account line, so a mixed line gets the neutral tint
   rather than one of its halves pretending to speak for both. */
function ccRowCat(a){
  const parts=String(a.cat||'').split(' + ').map(s=>s.trim()).filter(Boolean);
  return parts.length===1?catMeta(parts[0]):{c:'var(--txt-2)',bg:'var(--paper-2)'};
}
function ccAggregate(opt){
  const fee=DATA.fee||[];
  const fundsAll=(DATA.poProjetos||[]).filter(p=>p.aprovacao_status==='APROVADO');
  const accKey=(cc,acc,desc)=>`${cc||''}|${acc||''}|${desc||''}`;
  const accMap={};
  const slot=(key,cc,acc,desc,cat)=>{
    const a=(accMap[key]=accMap[key]||{key,cc,acc,desc,months:{},cons:{},det:{},detB:{},cats:new Set()});
    if(cat) a.cats.add(cat);
    return a;
  };
  const addDet=(a,m,entry)=>{ (a.det[m]=a.det[m]||[]).push(entry); };
  /* Budget side of the same idea: which funds make up the figure in the
     Budget column. One line per fund+category rather than per underlying
     record, since a fund can carry several monthly caps for one month. */
  const addDetB=(a,m,proj,categoria,valor)=>{
    const list=(a.detB[m]=a.detB[m]||[]);
    const hit=list.find(e=>e.proj.id===proj.id&&e.categoria===categoria);
    if(hit) hit.valor+=valor; else list.push({proj,categoria,valor});
  };
  const keepCat=cat=>{
    const c=String(cat||'');
    if(CC_FILTER.scope==='nolabg'&&c===CC_LABG) return false;
    return !CC_FILTER.cat||c===CC_FILTER.cat;
  };
  fundsAll.forEach(p=>{
    const consByMonth={}, posByMonth={};
    DATA.pos.filter(po=>po.fund_id===p.id&&CC_CONS_ST.includes(po.status)).forEach(po=>{
      const m=String(po.competencia).slice(0,7);
      consByMonth[m]=(consByMonth[m]||0)+(+po.valor||0);
      (posByMonth[m]=posByMonth[m]||[]).push(po);
    });
    if(p.rateio){
      const monthCat={};
      (DATA.rateio||[]).filter(r=>r.fund_id===p.id).forEach(r=>{
        const m=String(r.competencia).slice(0,7);
        monthCat[m]=monthCat[m]||{}; monthCat[m][r.categoria]=(monthCat[m][r.categoria]||0)+(+r.valor||0);
      });
      Object.keys(monthCat).forEach(m=>{
        const cats=monthCat[m]; const totalM=Object.values(cats).reduce((s,v)=>s+v,0)||1; const consM=consByMonth[m]||0;
        Object.keys(cats).forEach(cat=>{
          if(!keepCat(cat))return;
          const f=fee.find(x=>x.tipo===p.rateio_tipo&&x.categoria===cat);
          const cc=f?f.cc:'', acc=f?f.account:'', desc=f?f.descricao:'';
          if(!cc&&!acc&&!desc)return;
          /* totalM stays the month's FULL rateio total even when categories are
             filtered out — a PO's LABG share must not be redistributed onto TV
             just because LABG is hidden. Filtering drops slices, never resizes
             the ones that remain. */
          const ratio=cats[cat]/totalM;
          const a=slot(accKey(cc,acc,desc),cc,acc,desc,cat);
          a.months[m]=(a.months[m]||0)+cats[cat];
          a.cons[m]=(a.cons[m]||0)+consM*ratio;
          addDetB(a,m,p,cat,cats[cat]);
          (posByMonth[m]||[]).forEach(po=>addDet(a,m,{po,proj:p,categoria:cat,ratio,share:(+po.valor||0)*ratio}));
        });
      });
    } else {
      if(!p.cc&&!p.account&&!p.account_desc)return;
      if(!keepCat(p.product_category))return;
      const desc=ccEffDesc(p);
      const key=accKey(p.cc,p.account,desc);
      (DATA.tetos||[]).filter(t=>t.fund_id===p.id).forEach(t=>{
        const m=String(t.competencia).slice(0,7);
        const a=slot(key,p.cc,p.account,desc,p.product_category);
        a.months[m]=(a.months[m]||0)+(+t.teto||0);
        addDetB(a,m,p,p.product_category||'',+t.teto||0);
      });
      Object.keys(consByMonth).forEach(m=>{
        const a=slot(key,p.cc,p.account,desc,p.product_category);
        a.cons[m]=(a.cons[m]||0)+consByMonth[m];
        (posByMonth[m]||[]).forEach(po=>addDet(a,m,{po,proj:p,categoria:p.product_category||'',ratio:1,share:(+po.valor||0)}));
      });
    }
  });
  const allMonths=new Set(); Object.values(accMap).forEach(a=>{Object.keys(a.months).forEach(m=>allMonths.add(m));Object.keys(a.cons).forEach(m=>allMonths.add(m));});
  const monthList=Array.from(allMonths).sort();
  const all=Object.values(accMap);
  /* A row is Matriz (LABG) when every category feeding it is LABG — not when
     it sits on one hardcoded cost center. LABG spends through more than one
     (1109123033, 1109123018, and funds with no cost center at all), so
     reading it off the contributions is what actually catches them. */
  all.forEach(a=>{
    a.isLabg=a.cats.size?Array.from(a.cats).every(c=>c===CC_LABG):CC_TAIL.includes(String(a.cc||'').trim());
    // Normally one category per account line; joined rather than hidden if the
    // data ever routes two of them to the same cost center/account/description.
    a.cat=Array.from(a.cats).sort().join(' + ');
    a.totB=Object.values(a.months).reduce((s,v)=>s+v,0);
    a.totC=Object.values(a.cons).reduce((s,v)=>s+v,0);
    a.totS=a.totB-a.totC;
  });
  // Belt and braces on "Excl. LABG": keepCat already dropped every LABG
  // contribution, so this only ever catches a leftover.
  const accRows=all.filter(a=>CC_FILTER.scope!=='nolabg'||!a.isLabg);
  /* Base order is the Extrato layout, with the Matriz (LABG) lines after
     everything else. Clicking a column header re-sorts on top of this. */
  accRows.sort((x,y)=>ccTailRank(x)-ccTailRank(y)
    ||ccLayoutRank(x)-ccLayoutRank(y)
    ||String(x.cc||'').localeCompare(String(y.cc||''))
    ||String(x.acc||'').localeCompare(String(y.acc||''))
    ||String(x.desc||'').localeCompare(String(y.desc||'')));
  if(opt&&opt.sort&&CC_SORT.col){
    const key=CC_SORT.col;
    accRows.sort((x,y)=>{
      const txt=key==='cat'||key==='cc'||key==='acc'||key==='desc';
      let vx=txt?(x[key]||'').toLowerCase():x[key];
      let vy=txt?(y[key]||'').toLowerCase():y[key];
      const c=vx<vy?-1:vx>vy?1:0;
      return c*CC_SORT.dir;
    });
  }
  return {accRows,monthList};
}
/* Drill-down for one cell: what adds up to it. `kind` picks the side —
   "cons" lists the POs behind a Cons. figure, "budget" the funds behind a
   Budget figure. Addressed by position in the table the user is looking at
   (CC_VIEW is written by the renderer, so sorting and filtering are already
   applied) rather than by a cc|account|description key, which is free text
   and would need escaping through an onclick attribute. */
function ccDrill(rowIdx,monIdx,kind){
  const a=(CC_VIEW.accRows||[])[rowIdx], m=(CC_VIEW.monthList||[])[monIdx];
  if(!a||!m)return;
  return (kind==='budget'?ccDrillBudget:ccDrillCons)(a,m);
}
/* Where a drill-down was opened from, so the fund detail it hands off to
   can offer a way back. Held as the row's key rather than its index, and
   replayed through a fresh render, because the fund screen can change the
   numbers underneath (reallocating a balance) and rows can move. Cleared by
   closeModal(), so the back button only exists inside an open chain. */
let CC_DRILL_BACK=null;
function ccDrillBack(){
  const b=CC_DRILL_BACK; if(!b)return;
  go(SCREEN); // repaint the table first — CC_VIEW is what the indices address
  const ri=(CC_VIEW.accRows||[]).findIndex(a=>a.key===b.key);
  const mi=(CC_VIEW.monthList||[]).indexOf(b.m);
  if(ri<0||mi<0){ closeModal(); return; }
  ccDrill(ri,mi,b.kind);
}
function ccDrillHead(a,m,title,tint){
  return `<div class="modal-h" style="align-items:flex-start"><span style="width:7px;height:30px;border-radius:4px;background:${tint};flex-shrink:0;margin-right:2px"></span><div style="flex:1"><h3>${title} · ${esc(fmtMes(m+'-01'))}</h3><div style="font-size:12px;color:var(--txt-3)">${a.cat?esc(catKeyLabel(a.cat))+' · ':''}<span class="mono">${esc(a.cc||'—')}</span> · <span class="mono">${esc(a.acc||'—')}</span>${a.desc?' · '+esc(a.desc):''}</div></div><button class="x" onclick="closeModal()" aria-label="Close dialog">✕</button></div>`;
}
function ccDrillCons(a,m){
  const det=(a.det[m]||[]).slice().sort((x,y)=>y.share-x.share);
  if(!det.length)return;
  const total=det.reduce((s,d)=>s+d.share,0);
  const split=det.some(d=>d.ratio<0.9999);
  CC_DRILL_BACK={key:a.key,m,kind:'cons'};
  const cols=`1.5fr 1fr .8fr ${split?'.7fr ':''}.8fr`;
  const head=`<div style="display:grid;grid-template-columns:${cols};gap:10px;padding:8px 12px;background:var(--paper-2);border-radius:9px 9px 0 0;font-size:10px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.04em"><span>PO</span><span>Fund</span><span>Status</span>${split?'<span style="text-align:right">Split</span>':''}<span style="text-align:right">Value</span></div>`;
  const rows=det.map(d=>{
    const po=d.po, s=PO_STATUS[po.status]||{t:po.status,c:'s-slate'};
    /* The consumed figure was a dead end: it listed the POs behind it but
       every one of them was inert. Clicking a line now opens that PO, and
       CC_DRILL_BACK (already set above) gives the detail a way back to this

/* Budget side: the funds whose monthly cap (or rateio allocation) makes
   up the figure. Consumption is shown alongside each one so an over- or
   under-spending fund is visible without leaving the modal — the numbers
   come from the same slices the Cons. cell sums, filtered to that fund. */
function ccDrillBudget(a,m){
  const det=(a.detB[m]||[]).slice().sort((x,y)=>y.valor-x.valor);
  if(!det.length)return;
  const total=det.reduce((s,d)=>s+d.valor,0);
  const consBy={};
  (a.det[m]||[]).forEach(d=>{ consBy[d.proj.id]=(consBy[d.proj.id]||0)+d.share; });
  CC_DRILL_BACK={key:a.key,m,kind:'budget'};
  const cols='1.6fr .5fr .9fr .9fr .9fr';
  const head=`<div style="display:grid;grid-template-columns:${cols};gap:10px;padding:8px 12px;background:var(--paper-2);border-radius:9px 9px 0 0;font-size:10px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.04em"><span>Fund</span><span>Cat.</span><span style="text-align:right">Budget</span><span style="text-align:right">Cons.</span><span style="text-align:right">Balance</span></div>`;
  const rows=det.map(d=>{
    const c=consBy[d.proj.id]||0, bal=d.valor-c;
    const cut=canSeeCorte()?fundMonthCut(d.proj.id,m):0;
    return `<div class="cc-camp-row" onclick="openFundDetail('${escJs(d.proj.id)}')" title="Open fund" style="display:grid;grid-template-columns:${cols};gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;align-items:center">
      <span style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.proj.nome||'—')}</b><span style="font-size:10.5px;color:var(--txt-3)">${esc(d.proj.agencia||'—')}${d.proj.rateio?' · rateio '+esc(d.proj.rateio_tipo||''):''}${cut?`<span style="color:var(--red);font-weight:700"> · ${BRL(cut)} cut (approved ${BRL(d.valor+cut)})</span>`:''}</span></span>
      <span style="font-size:11px;font-weight:700;color:var(--txt-2)">${esc(d.categoria||'—')}</span>
      <span class="mono" style="text-align:right;font-weight:700">${BRL(d.valor)}</span>
      <span class="mono" style="text-align:right;color:var(--txt-2)">${c?BRL(c):'—'}</span>
      <span class="mono" style="text-align:right;font-weight:700;color:${bal<-0.005?'var(--po)':'var(--txt)'}">${BRL(bal)}</span>
    </div>`;
  }).join('');
  $('#modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div role="dialog" aria-modal="true" class="modal" style="max-width:760px">
    ${ccDrillHead(a,m,'Budget','var(--green)')}
    <div class="modal-b">
      <div style="display:flex;align-items:baseline;gap:16px;margin-bottom:12px">
        <span style="flex-shrink:0;white-space:nowrap"><b class="mono" style="font-size:21px;font-weight:800">${BRL(total)}</b><span style="font-size:11.5px;color:var(--txt-3);margin-left:8px">${det.length} fund${det.length>1?'s':''}</span></span>
        <span style="font-size:11.5px;color:var(--txt-3);text-align:right">Budget is the monthly cap for a direct fund, or the rateio allocation for a split one.</span>
      </div>
      <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden">${head}${rows}</div>
    </div>
  </div></div>`;
}
/* One row per PO slice — the same slices the table sums, so the sheet
   reconciles with the Cons. columns line by line. `pos` has no NF issue date
   column, so it comes from the FATURADA transition in po_log, fetched only
   when someone actually exports (and left blank if that read is denied). */
function ccPOExportRows(nfDates){
  const {accRows,monthList}=ccAggregate();
  /* Sorted on the raw YYYY-MM key, never on the rendered "Jan/26" label —
     that one sorts alphabetically (Apr before Jan) and would scramble the
     year boundary. The key is dropped again before the rows reach the sheet. */
  const items=[];
  accRows.forEach((a,ai)=>monthList.forEach(m=>{
    (a.det[m]||[]).forEach(d=>{
      const po=d.po, st=PO_STATUS[po.status]||{t:po.status};
      items.push({m,tail:ccTailRank(a),ai,row:{
        'Mês de lançamento':fmtMes(m+'-01'),
        'Categoria':d.categoria||'—',
        'Data da NF':(nfDates&&nfDates[po.id])?fmtDataBR(nfDates[po.id]):'—',
        'Valor':Math.round(d.share*100)/100,
        'Descrição da PO':po.descricao||'—',
        'Centro de custo':a.cc||'—',
        'Conta':a.acc||'—',
        'Descrição da conta':a.desc||'—',
        'Nº da PO':po.numero_po||'—',
        'Nº da NF':po.nf_numero||'—',
        'Fund':d.proj.nome||'—',
        'Agência':po.agencia||'—',
        'Status':st.t||po.status,
        '% do rateio':Math.round(d.ratio*10000)/100
      }});
    });
  }));
  /* Matriz (LABG) last, then posting month oldest first, then the Extrato
     row order (accRows already carries it) so a month's lines read down the
     sheet in the same sequence as the table above. */
  items.sort((x,y)=>x.tail-y.tail||x.m.localeCompare(y.m)||x.ai-y.ai);
  const rows=items.map(i=>i.row);
  return rows;
}
async function ccNFDates(){
  try{
    const {data,error}=await SBPO.from('po_log').select('po_id,status_para,em').eq('status_para','FATURADA');
    if(error)throw error;
    const byPo={};
    (data||[]).forEach(l=>{ const d=String(l.em||'').slice(0,10); if(!d)return; if(!byPo[l.po_id]||d>byPo[l.po_id]) byPo[l.po_id]=d; });
    return byPo;
  }catch(e){ console.warn('po_log (NF date):',(e&&e.message)||e); return null; }
}

async function exportCostCenterXLSX(){

/* The Overview's working set: approved funds this profile may see, narrowed
   by the screen's scope and period filters, with the four money buckets each
   one carries. Pulled out of renderBudgetOverview so the Available
   breakdown answers from the same arithmetic the hero figure came from —
   a second implementation would eventually disagree with the number the
   user clicked on. */
function boCtx(){
  let funds=DATA.poProjetos.filter(p=>p.aprovacao_status==='APROVADO');
  if(effPapel()==='agencia'&&effAgencia()) funds=funds.filter(p=>p.agencia===effAgencia());
  funds=funds.filter(p=>boScopeKeep(p.product_category));
  const tetoBy={},consBy={},compBy={},pendBy={};
  DATA.tetos.forEach(t=>{if(!boInPeriod(t.competencia))return;tetoBy[t.fund_id]=(tetoBy[t.fund_id]||0)+(+t.teto||0);});
  DATA.rateio.forEach(r=>{if(!boInPeriod(r.competencia))return;tetoBy[r.fund_id]=(tetoBy[r.fund_id]||0)+(+r.valor||0);});
  DATA.pos.forEach(po=>{if(!boInPeriod(po.competencia))return;const v=+po.valor||0;if(CONS.includes(po.status))consBy[po.fund_id]=(consBy[po.fund_id]||0)+v;else if(COMP.includes(po.status))compBy[po.fund_id]=(compBy[po.fund_id]||0)+v;else if(PEND.includes(po.status))pendBy[po.fund_id]=(pendBy[po.fund_id]||0)+v;});
  return {funds,tetoBy,consBy,compBy,pendBy};
}
/* Free budget per fund — cap minus everything committed against it. Negative
   for an overspent fund on purpose: floored at zero the parts would stop
   adding back up to the headline figure. Feeds "Allocated to campaigns" and
   the alerts; it is NOT what Available means (see boFundSaldo). */
function boFundFree(c,p){ return (c.tetoBy[p.id]||0)-(c.consBy[p.id]||0)-(c.compBy[p.id]||0)-(c.pendBy[p.id]||0); }
/* A fund's own balance: what it was approved for, minus what has actually
   been laid out across its months. This is the money that exists and has not
   been placed anywhere yet — the same figure the monthly-values editor calls
   "Still available" — and it is what Available reports, together with the
   budget never given to a fund at all.

   Counted against the GROSS monthly total, so a cut does not read as room
   that opened up: cut budget left the company, it did not come back to the
   fund to be placed in another month. An archived fund is skipped — nothing
   more is going to be allocated on it, and what it gave up is already in the
   category pool as a return. */
function boFundSaldo(p){
  if(!p||fundArquivado(p)) return 0;
  if(p.cap_aprovado==null||p.cap_aprovado==='') return 0;
  const alocado=Object.values(fundMonthlyGross(p.id)).reduce((s,v)=>s+v,0);
  return r2((+p.cap_aprovado||0)-alocado);
}
/* Budget registered on a category and never handed to any fund. It is as
   available as the balance sitting unused inside a fund — more so, since
   nothing has been promised against it — so it belongs in the same figure
   rather than in a footnote nobody connects to it.

   Always computed over the whole period, whatever the period filter says:
   valor_total is a ceiling for the budget's own window and cannot be sliced
   into one month. Available is a state — what has not been placed anywhere —
   not a flow, so the filter does not apply to it and the hero says so. An
   agency never sees this half: unallocated category budget is not its to
   count. */
function boUnallocated(){
  if(effPapel()==='agencia'&&effAgencia()) return [];
  const aprov=new Set((DATA.poProjetos||[]).filter(p=>p.aprovacao_status==='APROVADO').map(p=>p.id));
  const orcOf={}; (DATA.poProjetos||[]).forEach(p=>{ orcOf[p.id]=p.orcamento_id; });
  /* Allocation is counted GROSS of any cut: budget the company took back is
     not sitting in the category waiting to be given to another fund, so it
     must not reappear here as available. A return is the opposite — that is
     precisely what it is for — so it is subtracted from the allocation and
     lands back in this pool. */
  const alocBy={};
  (DATA.tetos||[]).forEach(t=>{ if(!aprov.has(t.fund_id))return; const o=orcOf[t.fund_id]; if(!o)return;
    const bruto=t.teto_aprovado!=null?+t.teto_aprovado:(+t.teto||0);
    alocBy[o]=(alocBy[o]||0)+bruto-(+t.devolucao||0); });
  (DATA.rateio||[]).forEach(r=>{ if(!aprov.has(r.fund_id))return; const o=orcOf[r.fund_id]; if(o) alocBy[o]=(alocBy[o]||0)+(+r.valor||0); });
  return (DATA.orcamentos||[]).map(o=>{
    const cat=(String(o.product_category||o.nome||'').trim())||'Uncategorized';
    return {orc:o,cat,livre:r2((+o.valor_total||0)-(alocBy[o.id]||0))};
  }).filter(r=>boScopeKeep(r.cat)&&r.livre>0.005);
}
function boUnallocatedTotal(){ return boUnallocated().reduce((s,r)=>s+r.livre,0); }

/* Monthly cap/consumed/committed for a set of fund ids, optionally only the

function v2MonthRows(fundIds,periodOnly){
  const months=new Set();

  DATA.rateio.forEach(r=>{if(fundIds.has(r.fund_id))months.add(String(r.competencia).slice(0,7));});
  DATA.pos.forEach(po=>{if(fundIds.has(po.fund_id)&&po.competencia)months.add(String(po.competencia).slice(0,7));});
  let ml=Array.from(months).sort(); if(periodOnly) ml=ml.filter(boMonthIn);

     chart — a year with four funded months still reads as a year. */
  if(ml.length){
    const y0=+ml[0].slice(0,4), y1=+ml[ml.length-1].slice(0,4), full=[];
    for(let y=y0;y<=y1;y++) for(let mo=1;mo<=12;mo++){ const k=y+'-'+String(mo).padStart(2,'0'); if(!periodOnly||boMonthIn(k)) full.push(k); }

  const MM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const multiYear=new Set(ml.map(m=>m.slice(0,4))).size>1;
  return ml.map(m=>{
    let cap=0,cons=0,comp=0;
    DATA.tetos.forEach(t=>{if(fundIds.has(t.fund_id)&&String(t.competencia).slice(0,7)===m)cap+=(+t.teto||0);});
    DATA.rateio.forEach(r=>{if(fundIds.has(r.fund_id)&&String(r.competencia).slice(0,7)===m)cap+=(+r.valor||0);});
    DATA.pos.forEach(po=>{if(!fundIds.has(po.fund_id)||String(po.competencia).slice(0,7)!==m)return;const v=+po.valor||0;if(CONS.includes(po.status))cons+=v;else if(COMP.includes(po.status))comp+=v;});

/* Two part-to-whole charts closing the Overview: allocation by product
   category and by activity.

   Capped at six slices with the tail folded into "Other" — past six a
   part-to-whole chart stops being readable, and a seventh hue would have to be
   invented. Colour is assigned by entity, never by rank: categories reuse the
   same hues they wear everywhere else in the app, and activities have a fixed
   map, so filtering the set never repaints the survivors.

   Activity hues are the validated categorical order (all six checks pass).
   Category hues are the app's own; they pass CVD separation (worst adjacent
   ΔE 12.8) and the normal-vision floor (18.3), with one deliberate exception:
   LABG is a near-gray, which the chroma check flags as "reads gray" — that is
   precisely what Matriz/corporate is meant to read as here, and it is the same
   grey it wears in every other screen. Both charts carry a legend with values

const BO_ACT_COLOR={Campaign:'#2a78d6',FEE:'#eb6834',KOL:'#1baf7a',AON:'#eda100',Communication:'#e87ba4',Other:'#4a3aa7'};
const BO_PIE_TAIL='#9aa3b8';
function boPieData(){
  let funds=DATA.poProjetos.filter(p=>p.aprovacao_status==='APROVADO');
  if(effPapel()==='agencia'&&effAgencia()) funds=funds.filter(p=>p.agencia===effAgencia());
  funds=funds.filter(p=>boScopeKeep(p.product_category));
  const ids=new Set(funds.map(c=>c.id));
  const catOf={}; DATA.poProjetos.forEach(p=>{catOf[p.id]=String(p.product_category||'').trim();});
  /* Category attribution mirrors the Overview's own: a plain fund's caps
     count under its category, a rateio fund's allocation under the
     category each slice was booked to. */
  const byCat={};
  (DATA.tetos||[]).forEach(t=>{ if(!ids.has(t.fund_id)||!boInPeriod(t.competencia))return; const c=catOf[t.fund_id]; if(c&&boScopeKeep(c)) byCat[c]=(byCat[c]||0)+(+t.teto||0); });
  (DATA.rateio||[]).forEach(r=>{ if(!ids.has(r.fund_id)||!boInPeriod(r.competencia))return; const c=r.categoria; if(c&&boScopeKeep(c)) byCat[c]=(byCat[c]||0)+(+r.valor||0); });
  const allocBy={};
  (DATA.tetos||[]).forEach(t=>{ if(!boInPeriod(t.competencia))return; allocBy[t.fund_id]=(allocBy[t.fund_id]||0)+(+t.teto||0); });
  (DATA.rateio||[]).forEach(r=>{ if(!boInPeriod(r.competencia))return; allocBy[r.fund_id]=(allocBy[r.fund_id]||0)+(+r.valor||0); });
  const byAct={}; funds.forEach(p=>{ const k=actKey(p); byAct[k]=(byAct[k]||0)+(allocBy[p.id]||0); });
  const shape=(obj,labelOf,colorOf)=>{
    let items=Object.keys(obj).filter(k=>obj[k]>0.005).map(k=>({k,label:labelOf(k),v:obj[k],color:colorOf(k)}));
    items.sort((a,b)=>b.v-a.v);
    if(items.length>6){
      const tail=items.slice(5);
      items=items.slice(0,5);
      items.push({k:'__other',label:`Other (${tail.length})`,v:tail.reduce((s,x)=>s+x.v,0),color:BO_PIE_TAIL});
    }
    const tot=items.reduce((s,x)=>s+x.v,0);
    return {items,total:tot};
  };
  return {
    cats:shape(byCat,k=>k,k=>catMeta(k).c),
    acts:shape(byAct,k=>actColLabel(k),k=>BO_ACT_COLOR[k]||BO_PIE_TAIL)
  };
}

function buildBudgetMonthlyChart(){

  const fundIds=new Set(funds.map(c=>c.id));
  const months=new Set();
  DATA.tetos.forEach(t=>{if(fundIds.has(t.fund_id))months.add(String(t.competencia).slice(0,7));});
  DATA.rateio.forEach(r=>{if(fundIds.has(r.fund_id))months.add(String(r.competencia).slice(0,7));});

/* Export (read-only) — mirrors renderBudgets' own aggregation exactly, transcribes
   what that screen already displays per fund, never recomputes new business values. */
function budgetExportRows(){
  const canSensitive=effIsManager()||['admin','financeiro'].includes(effPapel());
  const fee=DATA.fee||[];
  let funds=(DATA.poProjetos||[]).filter(p=>p.aprovacao_status==='APROVADO');
  if(effPapel()==='agencia'&&effAgencia()) funds=funds.filter(p=>p.agencia===effAgencia());
  const tetoBy={},consBy={},compBy={},pendBy={};
  DATA.tetos.forEach(t=>{tetoBy[t.fund_id]=(tetoBy[t.fund_id]||0)+(+t.teto||0);});
  DATA.rateio.forEach(r=>{tetoBy[r.fund_id]=(tetoBy[r.fund_id]||0)+(+r.valor||0);});
  DATA.pos.forEach(po=>{const v=+po.valor||0;if(CONS.includes(po.status))consBy[po.fund_id]=(consBy[po.fund_id]||0)+v;else if(COMP.includes(po.status))compBy[po.fund_id]=(compBy[po.fund_id]||0)+v;else if(PEND.includes(po.status))pendBy[po.fund_id]=(pendBy[po.fund_id]||0)+v;});
  const orcs=DATA.orcamentos||[];
  const orcByCat={}; orcs.forEach(o=>{ if(o.product_category) orcByCat[o.product_category]=o; });
  // Same grouping/order the Budgets & Campaigns screens render on-screen:
  // category in canonical PRODUCT_CATS order, then activity in ACT_COL_ORDER,
  // then project name — not raw orçamento/DB insertion order.
  const byCat={}; funds.forEach(p=>{ const k=(String(p.product_category||'').trim())||'Uncategorized'; (byCat[k]=byCat[k]||[]).push(p); });
  const catKeys=Object.keys(byCat).sort((a,b)=>{let ia=PRODUCT_CATS.indexOf(a),ib=PRODUCT_CATS.indexOf(b);if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib||a.localeCompare(b);});
  const rows=[];
  catKeys.forEach(ck=>{
    const o=orcByCat[ck];
    const list=byCat[ck].slice().sort((a,b)=>{
      let ia=ACT_COL_ORDER.indexOf(actKey(a)),ib=ACT_COL_ORDER.indexOf(actKey(b));
      if(ia<0)ia=99; if(ib<0)ib=99;
      return ia-ib||(a.nome||'').localeCompare(b.nome||'');
    });
    list.forEach(p=>{
      const tot=tetoBy[p.id]||0, cons=consBy[p.id]||0, comp=compBy[p.id]||0, pnd=pendBy[p.id]||0;
      const rawc=tot?(cons+comp+pnd)/tot*100:0;
      const status=rawc>100.5?'Estourado':rawc>=90?'Próximo do limite':'Dentro do orçamento';
      const row={
        'Categoria': catKeyLabel(o?(o.nome||o.product_category):ck),
        'Projeto': p.nome||'',
        'Fornecedor': p.agencia||'',
        'Atividade': actColLabel(actKey(p)),
        'Orçado (R$)': Math.round(tot*100)/100,
        'Consumido (R$)': Math.round(cons*100)/100,
        'Comprometido (R$)': Math.round(comp*100)/100,
        'Aguardando aprovação (R$)': Math.round(pnd*100)/100,
        '% Utilizado': Math.round(rawc),
        'Status': status
      };
      if(canSensitive){
        row['Tipo Rateio']=p.rateio?(p.rateio_tipo||''):'';
        const f=p.rateio?fee.find(x=>x.tipo===p.rateio_tipo&&x.categoria===ck):null;
        row['Rateio %']=(f&&f.percentual!=null)?Math.round(f.percentual*10000)/100:'';
      }
      rows.push(row);
    });
  });
  return rows;
}
/* The Excel twin of the on-screen "Cost center / account — monthly budget,
   consumption & balance" table: same ccAggregate() pass, same admin/finance
   gate — one row per cost center/account/description, one Orçado/Consumido/
   Saldo triplet per month, plus the grand-total row. */
function costCenterExportRows(){
  const canSensitive=effIsManager()||['admin','financeiro'].includes(effPapel());
  if(!canSensitive) return null;
  const {accRows,monthList}=ccAggregate();
  const rows=accRows.map(a=>{
    const row={'Categoria':catKeyLabel(a.cat||'—'),'Centro de custo':a.cc||'—','Conta':a.acc||'—','Descrição':a.desc||'—'};
    let totB=0,totC=0;
    monthList.forEach(m=>{
      const b=a.months[m]||0, c=a.cons[m]||0, label=fmtMes(m+'-01');
      totB+=b; totC+=c;
      row[`${label} - Orçado`]=Math.round(b*100)/100;
      row[`${label} - Consumido`]=Math.round(c*100)/100;
      row[`${label} - Saldo`]=Math.round((b-c)*100)/100;
    });
    row['Total - Orçado']=Math.round(totB*100)/100;
    row['Total - Consumido']=Math.round(totC*100)/100;
    row['Total - Saldo']=Math.round((totB-totC)*100)/100;
    return row;
  });
  if(rows.length){
    const totalRow={'Categoria':'Total','Centro de custo':'','Conta':'','Descrição':''};
    let gB=0,gC=0;
    monthList.forEach(m=>{
      let b=0,c=0; accRows.forEach(a=>{b+=a.months[m]||0;c+=a.cons[m]||0;});
      const label=fmtMes(m+'-01');
      gB+=b; gC+=c;
      totalRow[`${label} - Orçado`]=Math.round(b*100)/100;
      totalRow[`${label} - Consumido`]=Math.round(c*100)/100;
      totalRow[`${label} - Saldo`]=Math.round((b-c)*100)/100;
    });
    totalRow['Total - Orçado']=Math.round(gB*100)/100;
    totalRow['Total - Consumido']=Math.round(gC*100)/100;
    totalRow['Total - Saldo']=Math.round((gB-gC)*100)/100;
    rows.push(totalRow);
  }
  return rows;
}

async function savePerson(){
  if(!PERSON)return;
  const nivel=PERSON.papel==='agencia'&&PERSON.agencia_nivel==='po'?'po':'completo';
  if(PERSON._new){
    if(!(PERSON.email||'').trim()){ toast('Enter an email.'); return; }
    if(!PERSON.papel){ toast('Select a role.'); return; }
    if(PERSON.papel==='agencia'&&!(PERSON.agencia||'').trim()){ toast('Choose the agency.'); return; }
    if(DEMO_MODE){
      DATA.pessoas.push({user_id:'demo-'+uid(),nome:PERSON.nome,sobrenome:PERSON.sobrenome,email:PERSON.email,papel:PERSON.papel,agencia:PERSON.papel==='agencia'?PERSON.agencia:null,agencia_nivel:nivel});
      toast('Person invited ✓ (demo)'); closeModal(); go(SCREEN); return;
    }
    if(viewOnly()){ toast(roMsg()); return; }
    try{
      const {data:sPO}=await SBPO.auth.getSession();
      const token=sPO&&sPO.session&&sPO.session.access_token;
      if(!token) throw new Error('no active PO session');
      const r=await fetch(PO_URL+'/functions/v1/admin-usuarios',{method:'POST',headers:{'Content-Type':'application/json','apikey':PO_KEY,'Authorization':'Bearer '+token},body:JSON.stringify({action:'convidar',email:PERSON.email.trim().toLowerCase(),papel:PERSON.papel,agencia:PERSON.papel==='agencia'?PERSON.agencia:null,agencia_nivel:nivel,nome:PERSON.nome,sobrenome:PERSON.sobrenome})});
      const j=await r.json();
      if(!j||j.error) throw new Error((j&&j.error)||'invite failed');
      const {data:pes}=await SBPO.rpc('listar_pessoas'); DATA.pessoas=pes||[];
      toast('Invite sent ✓'); closeModal(); go(SCREEN);
    }catch(e){ toastErr(e); }
    return;
  }
  try{
    const {error}=await SBPO.rpc('definir_papel',{p_user:PERSON.user_id,p_papel:PERSON.papel,p_agencia:PERSON.papel==='agencia'?(PERSON.agencia||null):null,p_agencia_nivel:nivel});

    const {data:pes}=await SBPO.rpc('listar_pessoas'); DATA.pessoas=pes||[];
    toastSaved();

/* ============================================================
   BALANCE DECISIONS (#saldos) — reads saldos_para_decisao() and records
   via registrar_decisao_saldo(). Ported from the old controle-po "Saldos"
   tab; the day-26 e-mail links here. Values are net of cuts/returns.
   ============================================================ */
let SALDO_MES=null, SALDO_ROWS=null, SALDO_ERR='', SALDO_SEL={};
function saldoMesPadrao(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function saldoSetMes(v){ if(!v)return; SALDO_MES=v; SALDO_ROWS=null; go('saldos'); }
function renderSaldos(){
  if(!SALDO_MES) SALDO_MES=saldoMesPadrao();
  return `<div class="panel"><div class="panel-h"><h3>Unused balance by fund</h3>
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--txt-2)">Source month
        <input type="month" value="${esc(SALDO_MES)}" onchange="saldoSetMes(this.value)" style="padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);font:inherit;color:var(--txt)"></label></div>
    <div class="panel-b"><div style="font-size:12.5px;color:var(--txt-3);margin-bottom:10px">Funds whose cap for the month (net of cuts and returns) was not fully committed or requested. Record how the balance is redistributed across the remaining months of the fiscal year: <b>total</b> (all to next month), <b>split</b> (evenly) or <b>manual</b>.</div>
    <div id="saldoBody">${saldoBodyHTML()}</div></div></div>`;
}
function saldoBodyHTML(){
  if(SALDO_ROWS===null) return emptyState('clock','Loading…','');
  if(SALDO_ERR) return emptyState('alert','Could not load balances',SALDO_ERR);
  if(!SALDO_ROWS.length) return emptyState('check','No eligible balance in this month','Every fund you own used its whole cap, or there is nothing left to redistribute.');
  return SALDO_ROWS.map(saldoCardHTML).join('');
}
async function carregarSaldos(){
  if(DEMO_MODE){ SALDO_ROWS=[]; SALDO_ERR=''; const b=$('#saldoBody'); if(b)b.innerHTML=saldoBodyHTML(); return; }
  const mes=SALDO_MES;
  const {data,error}=await SBPO.rpc('saldos_para_decisao',{p_mes:mes+'-01'});
  if(mes!==SALDO_MES||SCREEN!=='saldos') return;
  SALDO_ERR=error?humanErr(error):''; SALDO_ROWS=error?[]:(data||[]);
  SALDO_ROWS.forEach(r=>{ if(!SALDO_SEL[r.fund_id]) SALDO_SEL[r.fund_id]={modo:r.decisao_modo||'',manual:Object.assign({},r.decisao_modo==='manual'?(r.decisao_alocacoes||{}):{})}; });
  const b=$('#saldoBody'); if(b) b.innerHTML=saldoBodyHTML();
  SALDO_ROWS.forEach(r=>saldoSync(r.fund_id));
}
function saldoCardHTML(r){
  const fid=r.fund_id, saldo=+r.saldo_elegivel||0, alvos=r.meses_alvo||[], sel=SALDO_SEL[fid]||{modo:'',manual:{}};
  const pode=!viewOnly();
  const dec=r.decisao_modo?`<span class="badge s-green"><span class="d"></span>decided: ${esc(r.decisao_modo)}${r.decidido_em?' · '+new Date(r.decidido_em).toLocaleDateString('pt-BR'):''}</span>`:'';
  const head=`<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div><b>${esc(r.fund||'—')}</b>${r.agencia?` <span style="color:var(--txt-3)">· ${esc(r.agencia)}</span>`:''}
      <div style="font-size:12px;color:var(--txt-3);margin-top:3px">Committed ${BRL(r.comprometido)} · Pending ${BRL(r.pendente)} · Cap (net) ${BRL(r.estimativa_base)}</div></div>
    <div style="text-align:right"><div style="font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.06em">Eligible balance</div>
      <div style="font-weight:800;font-size:18px;font-family:var(--mono,inherit)">${BRL(saldo)}</div>${dec}</div></div>`;
  if(!alvos.length) return `<div style="border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0">${head}<div style="font-size:12.5px;color:var(--amber);margin-top:8px">No later month in this fiscal year — nothing to redistribute to.</div></div>`;
  const radio=(m,lbl,dis)=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:${dis?'not-allowed':'pointer'};opacity:${dis?.5:1}"><input type="radio" name="sdModo-${esc(fid)}" value="${m}" ${sel.modo===m?'checked':''} ${dis||!pode?'disabled':''} onchange="saldoModo('${escJs(fid)}','${m}')"> ${lbl}</label>`;
  const manual=alvos.map(a=>`<label style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--txt-3)">${fmtMes(a)}
      <input type="number" min="0" step="0.01" value="${sel.manual[a]!=null?esc(sel.manual[a]):''}" ${pode?'':'disabled'} oninput="saldoManual('${escJs(fid)}','${escJs(a)}',this.value)" style="width:120px;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);font:inherit;color:var(--txt)"></label>`).join('');
  return `<div style="border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0">${head}
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px">
      ${radio('total',`Total <span style="color:var(--txt-3)">(all in ${fmtMes(alvos[0])})</span>`,false)}
      ${radio('split',`Split <span style="color:var(--txt-3)">(÷ ${alvos.length} months)</span>`,!r.split_disponivel)}
      ${radio('manual','Manual',false)}
    </div>
    <div id="sdPrev-${esc(fid)}" style="font-size:12.5px;color:var(--txt-3);margin-top:8px"></div>
    <div id="sdManual-${esc(fid)}" style="display:none;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px">${manual}
      <div style="font-size:11px;color:var(--txt-3)">Sum<div id="sdSoma-${esc(fid)}" style="font-weight:700;font-size:13px;padding:6px 0">R$ 0,00</div></div></div>
    <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
      ${pode?`<button class="btn-po" id="sdBtn-${esc(fid)}" onclick="salvarSaldo('${escJs(fid)}','${escJs(r.mes_origem)}')" disabled>Confirm decision</button>`:`<span style="font-size:12px;color:var(--txt-3)">${esc(roMsg())}</span>`}
      <span id="sdMsg-${esc(fid)}" style="font-size:12.5px"></span></div></div>`;
}
function saldoModo(fid,m){ (SALDO_SEL[fid]=SALDO_SEL[fid]||{modo:'',manual:{}}).modo=m; saldoSync(fid); }
function saldoManual(fid,mes,v){ const s=(SALDO_SEL[fid]=SALDO_SEL[fid]||{modo:'manual',manual:{}}); if(v===''||v==null) delete s.manual[mes]; else s.manual[mes]=+v; saldoSync(fid); }
function saldoSync(fid){
  const r=(SALDO_ROWS||[]).find(x=>x.fund_id===fid); if(!r)return; const s=SALDO_SEL[fid]||{modo:'',manual:{}};
  const man=$('#sdManual-'+fid), prev=$('#sdPrev-'+fid), btn=$('#sdBtn-'+fid), soma=$('#sdSoma-'+fid);
  if(man) man.style.display=s.modo==='manual'?'flex':'none';
  if(prev) prev.textContent=s.modo==='total'?'The whole balance goes to the next month.':(s.modo==='split'?'The balance is split evenly across the remaining months of the fiscal year.':'');
  let ok=!!s.modo;
  if(s.modo==='manual'){
    const tot=Object.values(s.manual).reduce((a,v)=>a+(+v||0),0), alvo=+r.saldo_elegivel||0;
    ok=Math.abs(tot-alvo)<0.01;
    if(soma){ soma.textContent=BRL(tot)+' / '+BRL(alvo); soma.style.color=ok?'var(--green)':'var(--red)'; }
  }
  if(btn) btn.disabled=!ok;
}
async function salvarSaldo(fid,mesOrigem){
  if(viewOnly()){toast(roMsg());return;}
  const s=SALDO_SEL[fid]; if(!s||!s.modo)return;
  const aloc={}; if(s.modo==='manual') Object.entries(s.manual).forEach(([m,v])=>{ if(+v>0) aloc[m]=Math.round(+v*100)/100; });
  const btn=$('#sdBtn-'+fid), msg=$('#sdMsg-'+fid);
  if(btn)btn.disabled=true; if(msg){msg.style.color='var(--txt-3)';msg.textContent='Saving…';}
  const {error}=await SBPO.rpc('registrar_decisao_saldo',{p_fund:fid,p_mes:mesOrigem,p_modo:s.modo,p_alocacoes:aloc});
  if(error){ if(msg){msg.style.color='var(--red)';msg.textContent=humanErr(error);} if(btn)btn.disabled=false; return; }
  if(msg){msg.style.color='var(--green)';msg.textContent='Decision recorded ✓';}
  delete SALDO_SEL[fid]; setTimeout(carregarSaldos,700);
}

  FUND={nome:'',orcamento_id:o0?o0.id:'',agencia:(agencyOpts()[0]||''),activity:'Campaign',campanha_id:'',rows:[{id:uid(),mes:nowM,valor:''}]};
  renderCampForm();
}
function fundSet(k,v){ if(!FUND)return; FUND[k]=v; renderCampForm(); }
function fundRowSet(id,k,v){ const r=FUND.rows.find(x=>x.id===id); if(r)r[k]=v; }
function fundAddRow(){ const last=FUND.rows[FUND.rows.length-1]; const nm=last?last.mes:new Date().toISOString().slice(0,7); FUND.rows.push({id:uid(),mes:nm,valor:''}); renderCampForm(); }
function fundDelRow(id){ FUND.rows=FUND.rows.filter(x=>x.id!==id); renderCampForm(); }
function renderCampForm(){
  if(!FUND)return;
  const orcs=DATA.orcamentos||[]; const orc=orcs.find(o=>o.id===FUND.orcamento_id);
  const cat=orc?(orc.product_category||orc.nome||''):'';
  const total=FUND.rows.reduce((s,r)=>s+(+r.valor||0),0);
  const ags=agencyOpts(); const tipos=rateioTipos();
  $('#modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div role="dialog" aria-modal="true" class="modal" style="max-width:600px">
    <div class="modal-h" style="align-items:flex-start"><span style="width:7px;height:30px;border-radius:4px;background:var(--po);flex-shrink:0;margin-right:2px"></span><div style="flex:1"><h3>New fund</h3><div style="font-size:11px;color:var(--txt-3);margin-top:1px">Activity → rateio → manual monthly distribution over the period</div></div><button class="x" onclick="closeModal()" aria-label="Close dialog">✕</button></div>
    <div class="modal-b">
      <div class="field full"><label>Fund name</label><input value="${esc(FUND.nome)}" onchange="FUND.nome=this.value" placeholder="e.g. Mini LED Push" style="width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper-2);font:inherit;font-size:13.5px"></div>
      <div class="fgrid" style="margin-top:14px">
        <div class="field"><label>Activity</label><select onchange="fundSet('activity',this.value)">${ACT_OPTS.map(a=>`<option value="${esc(a)}" ${FUND.activity===a?'selected':''}>${esc(actColLabel(a))}</option>`).join('')}</select></div>
        <div class="field"><label>Agency</label><select onchange="FUND.agencia=this.value">${ags.map(a=>`<option ${FUND.agencia===a?'selected':''}>${esc(a)}</option>`).join('')}${ags.length?'':'<option value="">—</option>'}</select></div>
      </div>
      <div class="field full" style="margin-top:14px"><label>Campaign <span style="font-weight:600;color:var(--txt-3)">(optional grouping)</span></label><select onchange="FUND.campanha_id=this.value"><option value="" ${!FUND.campanha_id?'selected':''}>— none —</option>${(DATA.campanhas||[]).map(c=>`<option value="${c.id}" ${FUND.campanha_id===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
      <div class="field full"><label>Category <span style="font-weight:600;color:var(--txt-3)">(defines which budget funds it)</span></label><select onchange="fundSet('orcamento_id',this.value)">${orcs.map(o=>`<option value="${o.id}" ${FUND.orcamento_id===o.id?'selected':''}>${esc(o.nome||o.product_category)}</option>`).join('')||'<option value="">— no budget —</option>'}</select>${/fee/i.test(FUND.activity||'')?'<div style="font-size:11.5px;color:var(--txt-3);margin-top:8px">Splitting a fee across categories (TV/AC/LABG…) is now done automatically when requesting the PO — create one fund per category instead of a shared rateio.</div>':''}</div>
      <div style="border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px">
        <div style="padding:10px 14px;background:var(--paper-2);border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em">Budget distribution by month — manual</div>
        <div style="padding:10px 14px;display:flex;flex-direction:column;gap:8px">
          ${FUND.rows.map(r=>`<div style="display:flex;align-items:center;gap:9px"><input type="month" value="${esc(r.mes)}" onchange="fundRowSet('${r.id}','mes',this.value)" style="padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);font:inherit;font-size:12.5px"><input type="number" min="0" step="100" value="${esc(r.valor)}" onchange="fundRowSet('${r.id}','valor',this.value)" placeholder="R$ 0" style="flex:1;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);font:inherit;font-size:12.5px;text-align:right" class="mono"><button class="chip-btn" onclick="fundDelRow('${r.id}')">✕</button></div>`).join('')}
          <button class="btn-ghost" onclick="fundAddRow()" style="align-self:flex-start;margin-top:2px">+ Add month</button>
        </div>
        <div style="padding:11px 14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between"><b style="font-family:'Hanken Grotesk',sans-serif;font-size:13px">Total caps (sum of months)</b><span class="mono" style="font-size:15px;font-weight:800">${BRL(total)}</span></div>
      </div>
    </div>
    <div class="modal-f"><span></span><div style="display:flex;gap:10px"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-po" onclick="submitFund()">Create fund</button></div></div>
  </div></div>`;
}
async function submitFund(){
  if(!FUND)return;
  if(!FUND.nome.trim()){ toast('Give the fund a name.'); return; }
  if(!FUND.orcamento_id){ toast('Choose a budget.'); return; }
  const rows=FUND.rows.filter(r=>r.mes&&(+r.valor||0)>0);
  if(!rows.length){ toast('Add at least one month with a value.'); return; }
  const orc=(DATA.orcamentos||[]).find(o=>o.id===FUND.orcamento_id); const cat=orc?(orc.product_category||orc.nome||''):'';
  // Same over-budget check the server enforces at approval time (aprovar_projeto),
  // surfaced here instead so the requester sees the block immediately when trying
  // to save — not later, as a surprise to whoever approves it.
  if(orc&&(+orc.valor_total||0)){
    const pStart=orc.periodo_inicio?String(orc.periodo_inicio).slice(0,10):null;
    const pEnd=orc.periodo_fim?String(orc.periodo_fim).slice(0,10):null;
    const inPeriod=mYYYYMM=>{ const d=mYYYYMM+'-01'; return (!pStart||d>=pStart)&&(!pEnd||d<=pEnd); };
    const vAloc=rows.filter(r=>inPeriod(r.mes)).reduce((s,r)=>s+(+r.valor||0),0);
    const approvedIds=new Set((DATA.poProjetos||[]).filter(p=>p.orcamento_id===FUND.orcamento_id&&p.aprovacao_status==='APROVADO').map(p=>p.id));
    const vUsado=(DATA.tetos||[]).filter(t=>approvedIds.has(t.fund_id)&&inPeriod(String(t.competencia).slice(0,7))).reduce((s,t)=>s+(+t.teto||0),0);
    const total=+orc.valor_total||0;
    if(vAloc+vUsado>total+0.5){
      toast(`This would exceed the "${esc(orc.nome||cat)}" budget: ${BRL(vAloc)} requested + ${BRL(vUsado)} already committed exceeds the ${BRL(total)} total. Reduce the values or pick a different budget.`);
      return;
    }
  }
  if(DEMO_MODE){
    const pid='demo-p-'+uid();
    DATA.poProjetos.push({id:pid,nome:FUND.nome.trim(),agencia:FUND.agencia||null,orcamento_id:FUND.orcamento_id,product_category:cat,activity:FUND.activity||null,rateio:false,aprovacao_status:'PENDENTE',dono:(currentUser&&currentUser.email)||''});
    rows.forEach(r=>DATA.tetos.push({fund_id:pid,competencia:r.mes+'-01',teto:r2(+r.valor)}));
    toast('Fund created ✓ (demo — now awaiting approval)'); closeModal(); go('funds');
    return;
  }
  if(viewOnly()){toast(roMsg());return;}
  try{
    let cc='',account='',account_desc='';
    try{ const {data:cls}=await SBPO.rpc('classificar',{p_d:cat,p_e:FUND.activity||'',p_f:''}); const c=(cls&&cls[0])||{}; cc=c.cc||''; account=c.account||''; account_desc=c.descricao||''; }catch(e){}
    const campos={nome:FUND.nome.trim(),agencia:FUND.agencia||null,orcamento_id:FUND.orcamento_id,product_category:cat,activity:FUND.activity||null,cc,account,account_desc,rateio:false,rateio_tipo:null,criado_por:'portal',campanha_id:FUND.campanha_id||null};
    const {data:proj,error}=await SBPO.from('funds').insert(campos).select().single();
    if(error)throw error;
    const pid=proj.id;
    {
      const tetos=rows.map(r=>({fund_id:pid,competencia:r.mes+'-01',teto:r2(+r.valor),definido_por:'portal'}));
      const {error:e2}=await SBPO.from('tetos').upsert(tetos,{onConflict:'fund_id,competencia'}); if(e2)throw e2;
    }
    toast('Fund created ✓'); closeModal(); await reloadPOAll(); go('funds');
  }catch(e){ toastErr(e); }
}

let ORC=null;
window.deletarOrcamento=deletarOrcamento;window.deletarFund=deletarFund;window.deletarPO=deletarPO;
/* Budgets are strictly one per product category — fixed list, no duplicates. */
function usedCats(){ return new Set((DATA.orcamentos||[]).map(o=>String(o.product_category||o.nome||'').trim().toUpperCase()).filter(Boolean)); }
function openOrcNew(){ const nowM=new Date().toISOString().slice(0,7); const free=PRODUCT_CATS.filter(c=>!usedCats().has(c)); ORC={id:null,cat:free[0]||'',valor:'',ini:nowM,fim:nowM}; renderOrcForm(); }
function openOrcEdit(id){ const o=(DATA.orcamentos||[]).find(x=>x.id===id); if(!o)return; ORC={id:o.id,cat:(o.product_category||o.nome||'').toUpperCase(),valor:o.valor_total!=null?o.valor_total:'',ini:o.periodo_inicio?String(o.periodo_inicio).slice(0,7):'',fim:o.periodo_fim?String(o.periodo_fim).slice(0,7):''}; renderOrcForm(); }
function renderOrcForm(){
  if(!ORC)return;
  const editing=!!ORC.id;
  const used=usedCats(); const free=PRODUCT_CATS.filter(c=>!used.has(c));
  const opts=free.length?free.map(c=>`<option value="${esc(c)}" ${ORC.cat===c?'selected':''}>${esc(catKeyLabel(c))}</option>`).join(''):'';
  const catField=editing
    ? `<div class="field"><label>Product category</label><input value="${esc(ORC.cat)}" disabled style="width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper-2);font:inherit;font-size:13.5px;color:var(--txt-2)"></div>`
    : `<div class="field"><label>Product category <span style="font-weight:600;color:var(--txt-3)">(one budget per category)</span></label><select onchange="ORC.cat=this.value">${opts}</select></div>`;
  const body=(editing||free.length)
    ? `${catField}
      <div class="field"><label>Total value (R$)</label><input type="number" min="0" step="1000" value="${esc(ORC.valor)}" onchange="ORC.valor=this.value" class="mono" placeholder="0,00"></div>
      <div class="fgrid">
        <div class="field"><label>Start</label><input type="month" value="${esc(ORC.ini)}" onchange="ORC.ini=this.value"></div>
        <div class="field"><label>End</label><input type="month" value="${esc(ORC.fim)}" onchange="ORC.fim=this.value"></div>
      </div>`
    : `<div class="banner">All product categories (${PRODUCT_CATS.join(', ')}) already have a budget. Edit the existing one instead of creating a duplicate.</div>`;
  $('#modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div role="dialog" aria-modal="true" class="modal" style="max-width:480px">
    <div class="modal-h"><h3>${editing?'Edit budget — '+esc(ORC.cat):'New budget'}</h3><button class="x" onclick="closeModal()" aria-label="Close dialog">✕</button></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f"><span>${(editing&&PAPEL==='admin'&&!viewOnly())?`<button class="btn-del" onclick="deletarOrcamento('${escJs(ORC.id)}')">Delete budget</button>`:''}</span><div style="display:flex;gap:10px"><button class="btn-ghost" onclick="closeModal()">Cancel</button>${(editing||free.length)?`<button class="btn-po" onclick="submitOrc()">${editing?'Save':'Create budget'}</button>`:''}</div></div>
  </div></div>`;
}
async function submitOrc(){
  if(viewOnly()){toast(roMsg());return;}
  if(!ORC)return;
  const cat=String(ORC.cat||'').trim().toUpperCase();
  const val=+ORC.valor||0; if(val<0){ toast('Enter a valid value.'); return; }
  // Block lowering an existing budget below what's already allocated to its
  // approved funds — same idea as the fund-side check in submitFund():
  // surface it here, at save time, instead of leaving the budget silently
  // inconsistent (total < committed).
  if(ORC.id){
    const approvedIds=new Set((DATA.poProjetos||[]).filter(p=>p.orcamento_id===ORC.id&&p.aprovacao_status==='APROVADO').map(p=>p.id));
    const pStart=ORC.ini?ORC.ini+'-01':null, pEnd=ORC.fim?ORC.fim+'-01':null;
    const inPeriod=comp=>{ const d=String(comp).slice(0,10); return (!pStart||d>=pStart)&&(!pEnd||d<=pEnd); };
    const vUsado=(DATA.tetos||[]).filter(t=>approvedIds.has(t.fund_id)&&inPeriod(t.competencia)).reduce((s,t)=>s+(+t.teto||0),0);
    if(val<vUsado-0.5){
      toast(`Can't set the total below ${BRL(vUsado)} — that's already allocated to approved funds in this budget.`);
      return;
    }
  }
  try{
    if(ORC.id){
      const {error}=await SBPO.from('orcamentos').update({valor_total:val,periodo_inicio:ORC.ini?ORC.ini+'-01':null,periodo_fim:ORC.fim?ORC.fim+'-01':null}).eq('id',ORC.id);
      if(error)throw error;
      toastSaved();
    }else{
      if(!PRODUCT_CATS.includes(cat)){ toast('Pick a product category.'); return; }
      if(usedCats().has(cat)){ toast('A budget for '+cat+' already exists.'); return; }
      if(val<=0){ toast('Enter the total value.'); return; }
      const {error}=await SBPO.rpc('criar_orcamento',{p_nome:cat,p_valor:val,p_inicio:ORC.ini?ORC.ini+'-01':null,p_fim:ORC.fim?ORC.fim+'-01':null});
      if(error)throw error;
      toastSaved();
    }
    closeModal(); await reloadPOAll(); go('budgets');
  }catch(e){ toastErr(e); }
}

let FEE=null;
/* percentualRaw carries the DB's full-precision value through the editor
   untouched — the visible `percentual` field is rounded to 2 decimals for
   display/typing, but percentages here often come from a fraction like
   10000/30000 that needs many more digits to reconcile split totals to the
   cent. Without this, saving the form (even to edit an unrelated field on
   some OTHER row) would silently truncate every row's percentual down to
   whatever 2-decimal value happens to be displayed. Editing the % field
   directly clears percentualRaw for that row — the typed value becomes the
   new source of truth at whatever precision was typed. */
function openFeeEditor(){ FEE=(DATA.fee||[]).map(f=>({agencia:f.agencia||'',tipo:FEE_TIPOS.some(([v])=>v===f.tipo)?f.tipo:'AGENCIA',categoria:f.categoria||'',percentual:f.percentual!=null?Math.round(f.percentual*10000)/100:'',percentualRaw:f.percentual!=null?f.percentual:null,cc:f.cc||'',account:f.account||'',descricao:f.descricao||''})); if(!FEE.length)FEE=[{agencia:'',tipo:'AGENCIA',categoria:'',percentual:'',percentualRaw:null,cc:'',account:'',descricao:''}]; renderFeeEditor(); }
function feeRowSet(i,k,v){ if(FEE&&FEE[i]){ FEE[i][k]=v; if(k==='percentual') FEE[i].percentualRaw=null; } }
function feeAddRow(){ FEE.push({agencia:'',tipo:'AGENCIA',categoria:'',percentual:'',cc:'',account:'',descricao:''}); renderFeeEditor(); }
function feeDelRow(i){ FEE.splice(i,1); renderFeeEditor(); }
/* NOTE: `tipo` is constrained by the DB (fee_rateio_tipo_check) to exactly
   'AGENCIA' or 'KOL' — it is a classifier of the split, not a free-text name.
   `agencia` is the free-text agency name. Rendering `tipo` as free text (as
   this editor used to) let people type anything and made every save fail
   the check constraint — that was the "error editing rateios" bug. Keep
   `tipo` a closed select so every row is always save-able. */
const FEE_TIPOS=[['AGENCIA','Agency fee'],['KOL','KOL fee']];
function renderFeeEditor(){
  if(!FEE)return;
  const inp=(i,k,ph,w)=>`<input value="${esc(FEE[i][k])}" onchange="feeRowSet(${i},'${k}',this.value)" placeholder="${ph}" style="width:${w||'100%'};padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--card);font:inherit;font-size:12px">`;
  const tipoSel=(i,f)=>`<select onchange="feeRowSet(${i},'tipo',this.value)" style="width:100%;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--card);font:inherit;font-size:12px">${FEE_TIPOS.map(([v,l])=>`<option value="${v}" ${f.tipo===v?'selected':''}>${l}</option>`).join('')}</select>`;
  const rows=FEE.map((f,i)=>`<div style="display:grid;grid-template-columns:1fr 1fr .8fr .6fr 1fr 1fr 1.4fr 24px;gap:7px;align-items:center;margin-bottom:7px">
    ${inp(i,'agencia','Agency')}${tipoSel(i,f)}${inp(i,'categoria','Category')}<input type="number" step="0.01" value="${esc(f.percentual)}" onchange="feeRowSet(${i},'percentual',this.value)" placeholder="%" style="padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--card);font:inherit;font-size:12px;text-align:right" class="mono">${inp(i,'cc','Cost center')}${inp(i,'account','Account')}${inp(i,'descricao','Description')}<button onclick="feeDelRow(${i})" style="width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:var(--txt-3);font-size:11px;cursor:pointer">✕</button>
  </div>`).join('');
  $('#modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div role="dialog" aria-modal="true" class="modal" style="max-width:920px">
    <div class="modal-h"><h3>Fee split configuration (rateio)</h3><button class="x" onclick="closeModal()" aria-label="Close dialog">✕</button></div>
    <div class="modal-b">
      <div style="font-size:11.5px;color:var(--txt-3);margin-bottom:10px">Define how a shared invoice is split across categories by fixed percentages. % is per row; each row carries its cost center and account for the payment process.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr .8fr .6fr 1fr 1fr 1.4fr 24px;gap:7px;font-size:10px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px"><span>Agency</span><span>Type</span><span>Category</span><span style="text-align:right">%</span><span>Cost center</span><span>Account</span><span>Description</span><span></span></div>
      ${rows}
      <button class="btn-ghost" onclick="feeAddRow()" style="margin-top:4px">+ Add split row</button>
    </div>
    <div class="modal-f"><span></span><div style="display:flex;gap:10px"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-po" onclick="saveFee()">Save splits</button></div></div>
  </div></div>`;
}
async function saveFee(){
  if(viewOnly()){toast(roMsg());return;}
  if(!FEE)return;
  const rows=FEE.filter(f=>(f.agencia||'').trim()&&FEE_TIPOS.some(([v])=>v===f.tipo)).map(f=>({agencia:f.agencia.trim(),tipo:f.tipo,categoria:(f.categoria||'').trim(),percentual:f.percentualRaw!=null?f.percentualRaw:(+f.percentual||0)/100,cc:(f.cc||'').trim(),account:(f.account||'').trim(),descricao:(f.descricao||'').trim()}));
  try{
    await SBPO.from('fee_rateio').delete().not('agencia','is',null);
    if(rows.length){ const {error}=await SBPO.from('fee_rateio').insert(rows); if(error)throw error; }
    const {data:fee}=await SBPO.from('fee_rateio').select('agencia,tipo,categoria,percentual,cc,account,descricao'); DATA.fee=fee||[];
    await reloadPOAll(); toastSaved();
  }catch(e){ toastErr(e); }
}

   INIT
   ============================================================ */
boot();
